<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DMS96 Deposit</title>
<style>
body{font-family:sans-serif;text-align:center;padding:20px;background:#f5f5f5}
input{padding:12px;margin:5px;width:80%;border-radius:8px;border:1px solid #ccc}
button{padding:12px 25px;background:#00a651;color:white;border:none;border-radius:8px;margin-top:10px;font-weight:bold}
#msg{margin-top:15px;color:green;font-weight:bold}
</style>
</head>
<body>
<h2>💰 DMS96 Deposit</h2>
<input id="userId" placeholder="User ID e.g. user123">
<input id="amount" type="number" placeholder="Amount R100">
<br>
<button id="btn">DEPOSIT NOW</button>
<p id="msg"></p>

<script type="module">
import { db } from './firebase-config.js';
import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

document.getElementById('btn').onclick=async()=>{
  const amt=document.getElementById('amount').value;
  const uid=document.getElementById('userId').value||"test_user_"+Date.now();
  if(!amt){alert("Enter amount");return;}
  document.getElementById('msg').innerText="Saving to Firestore...";
  try{
    await addDoc(collection(db,"deposits"),{
      userId:uid,
      amount:Number(amt),
      status:"pending",
      createdAt:serverTimestamp()
    });
    document.getElementById('msg').innerText="✅ R"+amt+" Saved! Check Firebase Console";
  }catch(e){document.getElementById('msg').innerText="❌ Error: "+e.message}
}
</script>
</body>
</html>
