<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS Final</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff}header{background:#000;border-bottom:2px solid #d4af37;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{color:#d4af37;font-weight:900}.gold{color:#d4af37}.card{background:#141414;border:1px solid #333;margin:12px;border-radius:14px;padding:16px}.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff}.btn{width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:900}.btn2{padding:9px 14px;background:#d4af37;color:#000;border:none;border-radius:8px;font-weight:700;margin:4px}.btnRed{padding:9px 14px;background:#ff3b3b;color:#fff;border:none;border-radius:8px;font-weight:700;margin:4px}.badge{display:inline-block;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}.pkg{border:1px solid #333;background:#1c1c1c;padding:14px;border-radius:12px;margin:10px 0}.small{font-size:12px;color:#aaa}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#111}nav button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#d4af37;white-space:nowrap}nav button.active{background:#d4af37;color:#000}.walletBox{border:1px solid #d4af37;background:#1a1a1a;padding:10px;border-radius:10px;margin:6px 0}.statBox{display:inline-block;border:1px solid #d4af37;background:#1e1e1e;padding:12px;border-radius:12px;margin:5px;min-width:140px;text-align:center}.adminTab{display:flex;gap:6px;overflow:auto;margin:10px 0}.adminTab button{padding:8px 12px;border-radius:20px;border:1px solid #d4af37;background:#111;color:#d4af37}.adminTab button.active{background:#d4af37;color:#000}</style></head><body><header><div class="logo">DMS - Devine Money Savings</div><button class="btn2" onclick="logout()" id="logoutBtn" style="display:none;background:#ff3b3b;color:#fff">Logout</button></header><nav><button onclick="goHome()" id="bH" class="active">Home</button><button onclick="goWallets()" id="bW">Wallets</button><button onclick="goPackages()" id="bP">Packages</button><button onclick="goTeam()" id="bT">Team</button><button onclick="goHistory()" id="bHI">History</button><button onclick="location.href='deposit.html'" id="bDEP" style="background:#d4af37;color:#000;font-weight:bold;">Deposit</button><button onclick="goAdmin()" id="bA">Admin</button></nav><div id="app"></div><script>
function safeParse(k,f){try{var v=localStorage.getItem(k);if(!v)return JSON.parse(f);return JSON.parse(v);}catch(e){return JSON.parse(f);}}
var PKGS=[{id:"A",name:"PACKAGE A",price:160,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"B",name:"PACKAGE B",price:250,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"C",name:"PACKAGE C",price:340,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"D",name:"PACKAGE D",price:430,daily:35,earliest:2,desc:"Earliest withdrawal in 2 days. Minimum withdrawal at R70."},{id:"E",name:"PACKAGE E",price:520,daily:70,earliest:1,desc:"Earliest withdrawal in 24hrs. Minimum withdrawal at R70."}];
var users=safeParse("dms_users","[]");var txs=safeParse("dms_txs","[]");var cur=safeParse("dms_cur","null");var adminSub="users";
function save(){localStorage.setItem("dms_users",JSON.stringify(users));localStorage.setItem("dms_txs",JSON.stringify(txs));localStorage.setItem("dms_cur",JSON.stringify(cur));}
function ensureWallets(u){if(!u.w)u.w={main:0,inviter:0,loyalty:0};if(u.w.bonus!==undefined&&u.w.inviter===undefined){u.w.inviter=u.w.bonus;delete u.w.bonus;}if(u.w.main===undefined)u.w.main=0;if(u.w.inviter===undefined)u.w.inviter=0;if(u.w.loyalty===undefined)u.w.loyalty=0;if(!u.hasOwnProperty('bank'))u.bank=null;}
function setActive(id){try{document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});var e=document.getElementById(id);if(e)e.classList.add("active");}catch(e){}}
function getUser(){if(!cur||cur.cell==="ADMIN")return null;for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell){ensureWallets(users[i]);return users[i];}}return null;}
function logout(){cur=null;localStorage.removeItem("dms_cur");var b=document.getElementById("logoutBtn");if(b)b.style.display="none";goHome();}
function checkLogout(){var b=document.getElementById("logoutBtn");if(b)b.style.display=cur?"block":"none";}
function goHome(){setActive("bH");checkLogout();try{var u=getUser();if(!u&&(!cur||cur.cell!=="ADMIN")){var html='<div class="card" style="text-align:center;border:2px solid #d4af37"><div class="badge">EXCLUSIVE PACKAGES</div><h2 class="gold">DEVINE MONEY SAVINGS</h2><div style="text-align:left;margin-top:12px">';for(var i=0;i<PKGS.length;i++){var p=PKGS[i];html+='<div class="pkg"><span class="badge">'+p.name+'</span> <b style="float:right">R'+p.price+'</b><br><br><b>R'+p.price+' > R'+p.daily+' daily</b><br><span class="small">'+p.desc+'</span></div>';}html+='</div><hr><h3>Login</h3><input id="lC" class="input" placeholder="Cellphone"><input id="lP" class="input" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button><p class="small">No account? <a href="#" onclick="goRegister()" style="color:#d4af37">Register here</a></p></div>';document.getElementById("app").innerHTML=html;return;}if(cur&&cur.cell==="ADMIN"){goAdmin();return;}var totalDaily=0;for(var j=0;j<u.pkgs.length;j++){if(!u.pkgs[j].done)totalDaily+=u.pkgs[j].daily;}var totalBal=u.w.main+u.w.inviter+u.w.loyalty;var h='<div class="card"><h3 class="gold">Welcome '+u.name+'</h3><p>Cell: '+u.cell+'<br>Invite: <b class="gold">'+u.invite+'</b></p><hr><div class="walletBox">Main Wallet: <b>R'+u.w.main.toFixed(2)+'</b></div><div class="walletBox">Inviter Bonus Wallet: <b>R'+u.w.inviter.toFixed(2)+'</b></div><div class="walletBox">Loyalty Bonus Wallet: <b>R'+u.w.loyalty.toFixed(2)+'</b></div><p>Total: <b class="gold">R'+totalBal.toFixed(2)+'</b> Daily: R'+totalDaily+'</p><button class="btn2" onclick="goWallets()">Wallets</button><button class="btn2" onclick="goPackages()">Buy Package</button><button class="btn2" onclick="goTeam()">My Team</button></div>';document.getElementById("app").innerHTML=h;}catch(e){document.getElementById("app").innerHTML='<div class="card"><h3>Recovery</h3><p>'+e.message+'</p><button class="btn" onclick="localStorage.clear();location.reload()">Fix & Reload</button></div>';}}
function goRegister(){var inv=new URLSearchParams(location.search).get("invite")||"";var h='<div class="card"><h3 class="gold">Register</h3><input id="rN" class="input" placeholder="Full Name *"><input id="rC" class="input" placeholder="Cellphone *"><input id="rE" class="input" placeholder="Email *"><select id="rPr" class="input"><option value="">Province *</option><option>Free State</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Western Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select><select id="rG" class="input"><option value="">Gender *</option><option>Male</option><option>Female</option></select><input id="rP" class="input" type="password" placeholder="Password *"><input id="rI" class="input" placeholder="Invite Code (optional)" value="'+inv+'"><button class="btn" onclick="doRegister()">Create Account</button></div>';document.getElementById("app").innerHTML=h;}
function doRegister(){var n=document.getElementById("rN").value.trim(),c=document.getElementById("rC").value.trim(),e=document.getElementById("rE").value.trim(),pr=document.getElementById("rPr").value,g=document.getElementById("rG").value,p=document.getElementById("rP").value.trim(),inv=document.getElementById("rI").value.trim().toUpperCase();if(!n||!c||!e||!pr||!g||!p){alert("Fill all *");return;}for(var i=0;i<users.length;i++){if(users[i].cell===c){alert("Cell exists");return;}}var code="DMS"+String(users.length+1).padStart(3,"0");var u={cell:c,name:n,email:e,prov:pr,gender:g,pass:p,invite:code,by:inv||null,w:{main:0,inviter:0,loyalty:0},pkgs:[],bank:null};users.push(u);if(inv){for(var k=0;k<users.length-1;k++){if(users[k].invite===inv||users[k].cell===inv){ensureWallets(users[k]);users[k].w.inviter+=10;txs.push({cell:users[k].cell,type:"bonus",amount:10,fee:0,note:"Inviter bonus from "+c+" ("+code+")",date:new Date().toISOString(),status:"approved"});break;}}}save();alert("Registered! Code "+code);goHome();}
function doLogin(){var c=document.getElementById("lC").value.trim(),p=document.getElementById("lP").value.trim();if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();return;}for(var i=0;i<users.length;i++){if(users[i].cell===c&&users[i].pass===p){ensureWallets(users[i]);cur={cell:users[i].cell};save();goHome();return;}}alert("Wrong");}
function adminLogin(){var c=document.getElementById("aC").value.trim(),p=document.getElementById("aP").value.trim();if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();}else{alert("Wrong");}}
function goPackages(){setActive("bP");checkLogout();var h='<div class="card"><h3 class="gold">Packages</h3>';for(var i=0;i<PKGS.length;i++){var pk=PKGS[i];h+='<div class="pkg"><span class="badge">'+pk.name+'</span> <b style="float:right">R'+pk.price+'</b><br><br><b>R'+pk.price+' > R'+pk.daily+' daily</b><br><span class="small">'+pk.desc+'</span><br><br><button class="btn2" onclick="buyPkg('+i+')">Buy '+pk.name+'</button></div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function buyPkg(i){var u=getUser();if(!u){alert("Login first");return;}var pkg=PKGS[i];var price=pkg.price||160;var b1=u.w.main||0;var b2=u.w.inviter||0;var b3=u.w.loyalty||0;var maxBal=Math.max(b1,b2,b3);if(maxBal<price){alert("Insufficient funds");return;}var choice=prompt("1=Main R"+b1.toFixed(2)+"\n2=Inviter R"+b2.toFixed(2)+"\n3=Loyalty R"+b3.toFixed(2)+"\nType 1,2,3");if(choice==null)return;var bal=0,key="";if(choice=="1"){bal=b1;key="main";}else if(choice=="2"){bal=b2;key="inviter";}else if(choice=="3"){bal=b3;key="loyalty";}else{alert("Invalid");return;}if(bal<price){alert("Not enough");return;}if(key=="main")u.w.main-=price;if(key=="inviter")u.w.inviter-=price;if(key=="loyalty")u.w.loyalty-=price;u.pkgs.push({id:pkg.id,price:price,daily:pkg.daily,earliest:pkg.earliest,boughtAt:new Date().toISOString(),lastClaim:null,totalEarned:0,done:false});txs.push({cell:u.cell,type:"bought",amount:price,fee:0,note:"Bought "+pkg.name+" from "+key+" wallet",date:new Date().toISOString(),status:"approved",wallet:key});save();alert("Success! "+pkg.name+" bought");goWallets();}
function goWallets(){setActive("bW");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}checkLogout();var bankInfo="";if(!u.bank){bankInfo='<div style="padding:8px;border:1px dashed #d4af37;border-radius:8px;margin:8px 0;background:#111"><span class="small">No banking details saved yet. You will be asked once on first withdrawal.</span></div>';}else{bankInfo='<div style="padding:8px;border:1px solid '+(u.bank.approved?"lightgreen":"orange") +';border-radius:8px;margin:8px 0;background:#111"><b>Bank Saved:</b> '+(u.bank.bankName||"")+' - '+(u.bank.acc||"")+'<br><b>Holder:</b> '+(u.bank.holder||"")+'<br><b>Status:</b> '+(u.bank.approved?'<span style="color:lightgreen">APPROVED ✓</span>':'<span style="color:orange">PENDING</span>')+'<br><button class="btn2" style="margin-top:6px" onclick="goBankForm()">Edit Bank</button></div>';}var h='<div class="card"><h3 class="gold">Wallets</h3>'+bankInfo;h+='<div class="walletBox">Main: <b>R'+u.w.main.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div><div class="walletBox">Inviter: <b>R'+u.w.inviter.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div><div class="walletBox">Loyalty: <b>R'+u.w.loyalty.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div><hr><h4 class="gold">My Packages ('+u.pkgs.length+')</h4>';if(u.pkgs.length===0){h+="<p class=small>No packages</p>";}else{for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];var bought=new Date(p.boughtAt);var diffDays=Math.floor((new Date()-bought)/(1000*60*60*24));var canClaim=false;var msg="";if(p.done){msg="Completed";}else if(diffDays<p.earliest){msg="Earliest in "+(p.earliest-diffDays)+" day(s)";}else{var last=p.lastClaim?new Date(p.lastClaim):null;if(!last||(new Date()-last)>=24*60*60*1000){canClaim=true;msg="Ready R"+p.daily;}else{msg="Tomorrow";}}h+='<div class="pkg"><span class="badge">'+p.id+'</span> R'+p.price+' -> R'+p.daily+'/day | Earned R'+p.totalEarned+'<br><span class="small">Bought '+bought.toLocaleDateString()+' - '+msg+'</span><br>';if(canClaim)h+='<button class="btn2" onclick="claimPkg('+i+')">Claim R'+p.daily+'</button>';h+='</div>';}}h+='</div>';document.getElementById("app").innerHTML=h;}
function claimPkg(idx){var u=getUser();if(!u)return;var p=u.pkgs[idx];if(!p||p.done)return;var diffDays=Math.floor((new Date()-new Date(p.boughtAt))/(1000*60*60*24));if(diffDays<p.earliest){alert("Earliest in "+(p.earliest-diffDays));return;}var last=p.lastClaim?new Date(p.lastClaim):null;if(last&&(new Date()-last)<24*60*60*1000){alert("Tomorrow");return;}var earned=p.daily;p.totalEarned+=earned;if(p.totalEarned>=p.price*2)p.done=true;p.lastClaim=new Date().toISOString();u.w.main+=earned;txs.push({cell:u.cell,type:"earn",amount:earned,fee:0,note:"Daily from "+p.id,date:new Date().toISOString(),status:"approved"});save();goWallets();}
function doWithdraw(){var u=getUser();if(!u){alert("Login");return;}var w=prompt("Choose wallet:\n1=Main R"+(u.w.main||0).toFixed(2)+"\n2=Inviter R"+(u.w.inviter||0).toFixed(2)+"\n3=Loyalty R"+(u.w.loyalty||0).toFixed(2));if(!w)return;var bal=0,wName="",wKey="";if(w=="1"){bal=u.w.main;wName="Main";wKey="main";}else if(w=="2"){bal=u.w.inviter;wName="Inviter";wKey="inviter";}else if(w=="3"){bal=u.w.loyalty;wName="Loyalty";wKey="loyalty";}else{alert("Invalid");return;}if(bal<70){alert("Min R70");return;}if(!u.bank){alert("Upload banking - one time");return goBankForm();}if(!u.bank.approved){alert("Bank saved, pending approval - will not ask again");return;}var amtStr=prompt("Withdraw "+wName+" R"+bal.toFixed(2)+"\nBank: "+u.bank.bankName+" "+u.bank.acc+"\nAmount:");if(!amtStr)return;var amt=parseFloat(amtStr);if(isNaN(amt)||amt<70||amt>bal){alert("Invalid");return;}var fee=amt*0.25;if(wKey=="main")u.w.main-=amt;if(wKey=="inviter")u.w.inviter-=amt;if(wKey=="loyalty")u.w.loyalty-=amt;txs.push({cell:u.cell,type:"withdraw",wallet:wKey,amount:amt,fee:fee,note:"Withdraw from "+wName+" to "+u.bank.bankName+" "+u.bank.acc,status:"pending",date:new Date().toISOString()});save();alert("Request R"+amt+" - 25% fee submitted");goWallets();}
function goBankForm(){var u=getUser();var holder=u&&u.bank?u.bank.holder:"";var bankN=u&&u.bank?u.bank.bankName:"";var acc=u&&u.bank?u.bank.acc:"";var branch=u&&u.bank?u.bank.branch:"";var h='<div class="card"><h3 class="gold">Banking - Saved Forever</h3><input id="bName" class="input" placeholder="Holder" value="'+holder+'"><input id="bBank" class="input" placeholder="Bank" value="'+bankN+'"><input id="bAcc" class="input" placeholder="Acc No" value="'+acc+'"><input id="bBranch" class="input" placeholder="Branch" value="'+branch+'"><button class="btn" onclick="saveBank()">Save</button><br><br><button class="btn2" onclick="goWallets()">Back</button></div>';document.getElementById("app").innerHTML=h;}
function saveBank(){var name=document.getElementById("bName").value.trim();var bank=document.getElementById("bBank").value.trim();var acc=document.getElementById("bAcc").value.trim();var branch=document.getElementById("bBranch").value.trim();if(!name||!bank||!acc||!branch){alert("Fill all");return;}var u=getUser();if(!u)return;var wasApproved=u.bank&&u.bank.approved;var wasBank=u.bank?u.bank.bankName:"";var wasAcc=u.bank?u.bank.acc:"";var isSame=wasBank===bank&&wasAcc===acc;if(isSame&&wasApproved){u.bank.holder=name;u.bank.bankName=bank;u.bank.acc=acc;u.bank.branch=branch;save();alert("Updated - still APPROVED");goWallets();return;}u.bank={holder:name,bankName:bank,acc:acc,branch:branch,approved:false,pending:true};save();alert("Bank saved! Awaiting approval");goWallets();}
function approveBank(cell){var u=users.find(function(x){return x.cell===cell});if(!u||!u.bank)return;u.bank.approved=true;u.bank.pending=false;save();alert("Bank Approved "+cell);goAdmin();}
function rejectBank(cell){if(!confirm("Reject "+cell+"?"))return;var u=users.find(function(x){return x.cell===cell});if(!u)return;u.bank=null;save();goAdmin();}
function goTeam(){setActive("bT");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var code=u.invite;var team=[];for(var i=0;i<users.length;i++){if(users[i].by===code||users[i].by===u.cell)team.push(users[i]);}var link=location.origin+location.pathname+"?invite="+code;var h='<div class="card"><h3 class="gold">My Team '+team.length+'</h3><p>Code <b>'+code+'</b></p><input class="input" value="'+link+'" readonly><button class="btn2" onclick="navigator.clipboard.writeText(\''+link+'\')">Copy Link</button><hr>';for(var k=0;k<team.length;k++){h+='<div>'+team[k].name+' '+team[k].cell+'</div>';}if(team.length===0)h+="No team";h+="<p>Inviter: R"+u.w.inviter.toFixed(2)+"</p></div>";document.getElementById("app").innerHTML=h;}
function goHistory(){setActive("bHI");if(!cur){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var list=[];if(cur.cell==="ADMIN"){list=txs;}else{var gu=getUser();if(!gu){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}for(var i=0;i<txs.length;i++){if(txs[i].cell===gu.cell)list.push(txs[i]);}}var h='<div class="card"><h3 class="gold">History</h3>';for(var i=list.length-1;i>=0;i--){var t=list[i];var typeDisplay=t.type;if(typeDisplay==="buy")typeDisplay="bought";var feeDisplay="";if(t.type==="withdraw"&&t.fee>0){feeDisplay=" - 25% fee";}var st=t.status;if(st==="done")st="approved";if(!st)st="approved";h+='<div style="border-bottom:1px solid #222;padding:6px 0"><b>'+typeDisplay+'</b> R'+t.amount+feeDisplay+'<br><span class="small">'+new Date(t.date).toLocaleString()+" "+(t.note||"")+" "+st+" ["+(t.wallet||"")+']</span></div>';}if(list.length===0)h+="No history";h+="</div>";document.getElementById("app").innerHTML=h;}
function setAdminSub(s){adminSub=s;goAdmin();}
function editUserWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;ensureWallets(u);var h='<div class="card"><h3 class="gold">Edit Wallets - '+u.name+'<br><span class="small">'+u.cell+' - '+u.invite+'</span></h3><label>Main</label><input id="editMain" class="input" type="number" value="'+u.w.main.toFixed(2)+'"><label>Inviter</label><input id="editInv" class="input" type="number" value="'+u.w.inviter.toFixed(2)+'"><label>Loyalty</label><input id="editLoy" class="input" type="number" value="'+u.w.loyalty.toFixed(2)+'"><button class="btn" onclick="saveWallets(\''+u.cell+'\')">Save</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;}
function saveWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;u.w.main=parseFloat(document.getElementById("editMain").value)||0;u.w.inviter=parseFloat(document.getElementById("editInv").value)||0;u.w.loyalty=parseFloat(document.getElementById("editLoy").value)||0;save();alert("Saved");goAdmin();}
function deleteUser(cell){if(!confirm("Delete "+cell+"?"))return;users=users.filter(function(x){return x.cell!==cell});txs=txs.filter(function(t){return t.cell!==cell});save();goAdmin();}
function approveWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;t.status="approved";save();alert("Approved R"+t.amount);goAdmin();}
function rejectWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;if(!confirm("Reject?"))return;var u=users.find(function(x){return x.cell===t.cell});if(u){ensureWallets(u);if(t.wallet==="main")u.w.main+=t.amount;else if(t.wallet==="inviter")u.w.inviter+=t.amount;else if(t.wallet==="loyalty")u.w.loyalty+=t.amount;else u.w.main+=t.amount;}t.status="rejected";save();goAdmin();}
function goAdmin(){setActive("bA");if(!cur||cur.cell!=="ADMIN"){document.getElementById("app").innerHTML='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cell" value="0510011039"><input id="aP" class="input" type="password" placeholder="Pass"><button class="btn" onclick="adminLogin()">Login</button></div>';return;}for(var i=0;i<users.length;i++){var exp="DMS"+String(i+1).padStart(3,"0");users[i].invite=exp;}var totalMain=0,totalInv=0,totalLoy=0;users.forEach(function(u){ensureWallets(u);totalMain+=u.w.main;totalInv+=u.w.inviter;totalLoy+=u.w.loyalty;});var pend=txs.filter(function(t){return t.status==="pending"});var h='<div class="card"><h2 class="gold">Admin Dashboard</h2><div class="statBox"><b>'+users.length+'</b><br><span class="small">Users</span></div><div class="statBox"><b>'+pend.length+'</b><br><span class="small">Pending</span></div><div class="statBox"><b>R'+totalMain.toFixed(0)+'</b><br><span class="small">Main</span></div><div class="statBox"><b>R'+totalInv.toFixed(0)+'</b><br><span class="small">Inviter</span></div><div class="statBox"><b>R'+totalLoy.toFixed(0)+'</b><br><span class="small">Loyalty</span></div><hr><div class="adminTab"><button onclick="setAdminSub(\'dashboard\')" class="'+(adminSub==="dashboard"?"active":"")+'">Dashboard</button><button onclick="setAdminSub(\'withdrawals\')" class="'+(adminSub==="withdrawals"?"active":"")+'">Withdrawals ('+pend.length+')</button><button onclick="setAdminSub(\'users\')" class="'+(adminSub==="users"?"active":"")+'">Users ('+users.length+')</button></div><hr>';if(adminSub==="dashboard"||adminSub==="withdrawals"){h+='<h3 class="gold">Pending Withdrawals</h3>';if(pend.length===0)h+="<p>No pending</p>";for(var i=0;i<pend.length;i++){var t=pend[i];var idx=txs.indexOf(t);h+='<div style="border:1px solid #d4af37;padding:10px;margin:8px 0;border-radius:10px;background:#1a1a1a"><b>'+t.cell+'</b><br>R'+t.amount+' - 25% fee<br><button class="btn2" onclick="approveWithdraw('+idx+')">Approve</button><button class="btnRed" onclick="rejectWithdraw('+idx+')">Reject</button></div>';}}if(adminSub==="users"){h+='<h3 class="gold">Users - Email Gender Banking</h3><input id="searchUser" class="input" placeholder="Search" oninput="filterUsers(this.value)"><div id="userList">';for(var j=0;j<users.length;j++){var uu=users[j];ensureWallets(uu);h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px" class="userItem" data-search="'+uu.cell+' '+uu.invite+' '+uu.name.toLowerCase()+' '+(uu.email||"")+'"><b>'+uu.name+'</b><br>'+uu.cell+' - <b class="gold">'+uu.invite+'</b><br><span style="color:#d4af37">Email: '+(uu.email||"N/A")+'</span><br>Gender: '+(uu.gender||"N/A")+' | '+uu.prov+'<br>Main R'+uu.w.main.toFixed(2)+' | Inviter R'+uu.w.inviter.toFixed(2)+' | Loyalty R'+uu.w.loyalty.toFixed(2)+'<br>';if(uu.bank){h+='<div style="margin-top:6px;padding:6px;border:1px solid gold;border-radius:8px">Bank: '+uu.bank.bankName+' '+uu.bank.acc+' - '+(uu.bank.approved?"APPROVED":"PENDING")+'<br><button class="btn2" onclick="approveBank(\''+uu.cell+'\')">Approve Bank</button></div>';}h+='<br><button class="btn2" onclick="editUserWallets(\''+uu.cell+'\')">Edit Wallets</button></div>';}h+='</div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function filterUsers(q){q=q.toLowerCase();document.querySelectorAll(".userItem").forEach(function(el){var s=el.getAttribute("data-search");el.style.display=s.includes(q)?"block":"none";});}
try{goHome();}catch(e){document.getElementById("app").innerHTML='<div class="card">Error: '+e.message+'<br><button class="btn" onclick="localStorage.clear();location.reload()">Clear & Reload</button></div>';}
</script></body></html>
