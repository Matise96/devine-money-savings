<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS - Edit 3 Wallets Fix</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff}header{background:#000;border-bottom:2px solid #d4af37;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{color:#d4af37;font-weight:900}.gold{color:#d4af37}.card{background:#141414;border:1px solid #333;margin:12px;border-radius:14px;padding:16px}.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff}.btn{width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:900}.btn2{padding:9px 14px;background:#d4af37;color:#000;border:none;border-radius:8px;font-weight:700;margin:4px}.btnRed{padding:9px 14px;background:#ff3b3b;color:#fff;border:none;border-radius:8px;font-weight:700;margin:4px}.badge{display:inline-block;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}.pkg{border:1px solid #333;background:#1c1c1c;padding:14px;border-radius:12px;margin:10px 0}.small{font-size:12px;color:#aaa}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#111}nav button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#d4af37;white-space:nowrap}nav button.active{background:#d4af37;color:#000}.walletBox{border:1px solid #d4af37;background:#1a1a1a;padding:10px;border-radius:10px;margin:6px 0}.statBox{display:inline-block;border:1px solid #d4af37;background:#1e1e1e;padding:12px;border-radius:12px;margin:5px;min-width:140px;text-align:center}.adminTab{display:flex;gap:6px;overflow:auto;margin:10px 0}.adminTab button{padding:8px 12px;border-radius:20px;border:1px solid #d4af37;background:#111;color:#d4af37}.adminTab button.active{background:#d4af37;color:#000}</style></head><body><header><div class="logo">DMS - Devine Money Savings</div><button class="btn2" onclick="logout()" id="logoutBtn" style="display:none;background:#ff3b3b;color:#fff">Logout</button></header><nav><button onclick="goHome()" id="bH" class="active">Home</button><button onclick="goWallets()" id="bW">Wallets</button><button onclick="goPackages()" id="bP">Packages</button><button onclick="goTeam()" id="bT">Team</button><button onclick="goHistory()" id="bHI">History</button><button onclick="goAdmin()" id="bA">Admin</button></nav><div id="app"></div><script>
var PKGS=[{id:"A",name:"PACKAGE A",price:160,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"B",name:"PACKAGE B",price:250,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"C",name:"PACKAGE C",price:340,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"D",name:"PACKAGE D",price:430,daily:35,earliest:2,desc:"Earliest withdrawal in 2 days. Minimum withdrawal at R70."},{id:"E",name:"PACKAGE E",price:520,daily:70,earliest:1,desc:"Earliest withdrawal in 24hrs. Minimum withdrawal at R70."}];
var users=JSON.parse(localStorage.getItem("dms_users")||"[]");var txs=JSON.parse(localStorage.getItem("dms_txs")||"[]");var cur=JSON.parse(localStorage.getItem("dms_cur")||"null");var adminSub="users";
function save(){localStorage.setItem("dms_users",JSON.stringify(users));localStorage.setItem("dms_txs",JSON.stringify(txs));localStorage.setItem("dms_cur",JSON.stringify(cur));}
function ensureWallets(u){if(!u.w)u.w={main:0,inviter:0,loyalty:0};if(u.w.bonus!==undefined&&u.w.inviter===undefined){u.w.inviter=u.w.bonus;delete u.w.bonus;}if(u.w.main===undefined)u.w.main=0;if(u.w.inviter===undefined)u.w.inviter=0;if(u.w.loyalty===undefined)u.w.loyalty=0;}
function setActive(id){document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});var e=document.getElementById(id);if(e)e.classList.add("active");}
function getUser(){if(!cur||cur.cell==="ADMIN")return null;for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell){ensureWallets(users[i]);return users[i];}}return null;}
function logout(){cur=null;localStorage.removeItem("dms_cur");document.getElementById("logoutBtn").style.display="none";goHome();}
function checkLogout(){document.getElementById("logoutBtn").style.display=cur?"block":"none";}
function goHome(){setActive("bH");checkLogout();var u=getUser();if(!u&&(!cur||cur.cell!=="ADMIN")){var html='<div class="card" style="text-align:center;border:2px solid #d4af37"><div class="badge">EXCLUSIVE PACKAGES</div><h2 class="gold">DEVINE MONEY SAVINGS</h2><p class="small">Min R70 | 3 Wallets | 25% Fee | DMS001</p><div style="text-align:left;margin-top:12px">';for(var i=0;i<PKGS.length;i++){var p=PKGS[i];html+='<div class="pkg"><span class="badge">'+p.name+'</span> <b style="float:right">R'+p.price+'</b><br><br><b>R'+p.price+' > R'+p.daily+' daily</b><br><span class="small">'+p.desc+'</span></div>';}html+='</div><hr><h3>Login</h3><input id="lC" class="input" placeholder="Cellphone"><input id="lP" class="input" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button><p class="small">No account? <a href="#" onclick="goRegister()" style="color:#d4af37">Register here</a></p></div>';document.getElementById("app").innerHTML=html;return;}if(cur&&cur.cell==="ADMIN"){goAdmin();return;}var totalDaily=0;for(var j=0;j<u.pkgs.length;j++){if(!u.pkgs[j].done)totalDaily+=u.pkgs[j].daily;}var totalBal=u.w.main+u.w.inviter+u.w.loyalty;var h='<div class="card"><h3 class="gold">Welcome '+u.name+'</h3><p>Cell: '+u.cell+'<br>Invite: <b class="gold">'+u.invite+'</b></p><hr><div class="walletBox">Main: <b>R'+u.w.main.toFixed(2)+'</b></div><div class="walletBox">Inviter: <b>R'+u.w.inviter.toFixed(2)+'</b></div><div class="walletBox">Loyalty: <b>R'+u.w.loyalty.toFixed(2)+'</b></div><p>Total: <b class="gold">R'+totalBal.toFixed(2)+'</b> Daily: R'+totalDaily+'</p><button class="btn2" onclick="goWallets()">Wallets</button><button class="btn2" onclick="goPackages()">Buy Package</button><button class="btn2" onclick="goTeam()">My Team</button></div>';document.getElementById("app").innerHTML=h;}
function goRegister(){var inv=new URLSearchParams(location.search).get("invite")||"";var h='<div class="card"><h3 class="gold">Register</h3><input id="rN" class="input" placeholder="Full Name *"><input id="rC" class="input" placeholder="Cellphone *"><input id="rE" class="input" placeholder="Email *"><select id="rPr" class="input"><option value="">Province *</option><option>Free State</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Western Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select><select id="rG" class="input"><option value="">Gender *</option><option>Male</option><option>Female</option></select><input id="rP" class="input" type="password" placeholder="Password *"><input id="rI" class="input" placeholder="Invite Code (optional)" value="'+inv+'"><button class="btn" onclick="doRegister()">Create Account</button></div>';document.getElementById("app").innerHTML=h;}
function doRegister(){var n=document.getElementById("rN").value.trim(),c=document.getElementById("rC").value.trim(),e=document.getElementById("rE").value.trim(),pr=document.getElementById("rPr").value,g=document.getElementById("rG").value,p=document.getElementById("rP").value.trim(),inv=document.getElementById("rI").value.trim().toUpperCase();if(!n||!c||!e||!pr||!g||!p){alert("Fill all *");return;}for(var i=0;i<users.length;i++){if(users[i].cell===c){alert("Cell exists");return;}}var code="DMS"+String(users.length+1).padStart(3,"0");var u={cell:c,name:n,email:e,prov:pr,gender:g,pass:p,invite:code,by:inv||null,w:{main:0,inviter:0,loyalty:0},pkgs:[]};users.push(u);if(inv){for(var k=0;k<users.length-1;k++){if(users[k].invite===inv||users[k].cell===inv){ensureWallets(users[k]);users[k].w.inviter+=10;txs.push({cell:users[k].cell,type:"bonus",amount:10,fee:0,note:"Inviter bonus from "+c+" ("+code+")",date:new Date().toISOString(),status:"done"});break;}}}save();alert("Registered! Code "+code);goHome();}
function doLogin(){var c=document.getElementById("lC").value.trim(),p=document.getElementById("lP").value.trim();if(c==="0510011039"&&p==="admin123"){cur={cell:"ADMIN"};save();goAdmin();return;}for(var i=0;i<users.length;i++){if(users[i].cell===c&&users[i].pass===p){ensureWallets(users[i]);cur={cell:users[i].cell};save();goHome();return;}}alert("Wrong");}
function adminLogin(){var c=document.getElementById("aC").value.trim(),p=document.getElementById("aP").value.trim();if(c==="0510011039"&&p==="admin123"){cur={cell:"ADMIN"};save();goAdmin();}else{alert("Wrong");}}
function goPackages(){setActive("bP");checkLogout();var h='<div class="card"><h3 class="gold">Packages</h3>';for(var i=0;i<PKGS.length;i++){var pk=PKGS[i];h+='<div class="pkg"><span class="badge">'+pk.name+'</span> <b style="float:right">R'+pk.price+'</b><br><br><b>R'+pk.price+' > R'+pk.daily+' daily</b><br><span class="small">'+pk.desc+'</span><br><br><button class="btn2" onclick="buyPkg('+i+')">Buy '+pk.name+'</button></div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function buyPkg(i){var u=getUser();if(!u){alert("Login");return;}var pk=PKGS[i];if(!confirm("Buy "+pk.name+" for R"+pk.price+"?"))return;u.pkgs.push({pkgId:pk.id,price:pk.price,daily:pk.daily,earliest:pk.earliest,boughtAt:Date.now(),claimed:0,done:false});save();alert("Bought "+pk.name);goWallets();}
function goWallets(){setActive("bW");checkLogout();var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login first</div>";return;}var now=Date.now(),canClaim=0,details="";for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];var d=Math.floor((now-p.boughtAt)/86400000);var cl=Math.min(d,30)-p.claimed;if(cl>0&&!p.done)canClaim+=cl*p.daily;details+="<div style=border-bottom:1px solid #222;padding:4px 0>"+p.pkgId+" R"+p.price+" "+p.claimed+"/30 R"+p.daily+"/day</div>";}var total=u.w.main+u.w.inviter+u.w.loyalty;var h='<div class="card"><h3 class="gold">3 Wallets</h3><div class="walletBox">Main: R'+u.w.main.toFixed(2)+'</div><div class="walletBox">Inviter: R'+u.w.inviter.toFixed(2)+'</div><div class="walletBox">Loyalty: R'+u.w.loyalty.toFixed(2)+'</div><p>Total R'+total.toFixed(2)+' Pending R'+canClaim+'</p><button class="btn" onclick="claimDaily()">Claim Daily + R2 Loyalty</button><hr><button class="btn2" onclick="doWithdraw()">Withdraw Min R70</button><hr>'+(details||"No packages")+'</div>';document.getElementById("app").innerHTML=h;}
function claimDaily(){var u=getUser();var now=Date.now(),earned=0,claims=0;for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];if(p.done)continue;var d=Math.floor((now-p.boughtAt)/86400000);var cl=Math.min(d,30)-p.claimed;if(cl>0){earned+=cl*p.daily;claims+=cl;p.claimed+=cl;if(p.claimed>=30)p.done=true;}}if(earned===0){alert("Come back tomorrow");return;}u.w.main+=earned;u.w.loyalty+=claims*2;txs.push({cell:u.cell,type:"daily",amount:earned,fee:0,note:"Daily R"+earned+" + Loyalty R"+(claims*2),date:new Date().toISOString(),status:"done"});save();alert("Claimed R"+earned+" + Loyalty R"+(claims*2));goWallets();}
function doWithdraw(){var u=getUser();if(!u)return;var total=u.w.main+u.w.inviter+u.w.loyalty;if(total<70){alert("Min R70 needed. Have R"+total.toFixed(2));return;}var now=Date.now();if(u.pkgs.length>0){var ok=false;for(var i=0;i<u.pkgs.length;i++){if(Math.floor((now-u.pkgs[i].boughtAt)/86400000)>=u.pkgs[i].earliest){ok=true;break;}}if(!ok){alert("Earliest not reached");return;}}alert("Withdrawal Fee Notice:\n\nPlease note that all withdrawals have a 25% fee.");var amt=parseFloat(prompt("Total R"+total.toFixed(2)+"\nEnter amount Min R70:","70"));if(!amt||amt<70){alert("Min R70");return;}if(amt>total){alert("Insufficient");return;}var fee=amt*0.25;var rem=amt;if(u.w.main>=rem){u.w.main-=rem;rem=0;}else{rem-=u.w.main;u.w.main=0;if(u.w.inviter>=rem){u.w.inviter-=rem;rem=0;}else{rem-=u.w.inviter;u.w.inviter=0;u.w.loyalty-=rem;}}txs.push({cell:u.cell,type:"withdraw",amount:amt,fee:fee,note:"Withdraw R"+amt+" 25% fee",date:new Date().toISOString(),status:"pending"});save();alert("Withdrawal R"+amt+" requested - 25% fee - Pending");goHistory();}
function goTeam(){setActive("bT");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var code=u.invite;var team=[];for(var i=0;i<users.length;i++){if(users[i].by===code||users[i].by===u.cell)team.push(users[i]);}var link=location.origin+location.pathname+"?invite="+code;var h='<div class="card"><h3 class="gold">My Team '+team.length+'</h3><p>Code <b>'+code+'</b></p><input class="input" value="'+link+'" readonly><button class="btn2" onclick="navigator.clipboard.writeText(\''+link+'\')">Copy Link</button><hr>';for(var k=0;k<team.length;k++){h+='<div>'+team[k].name+' '+team[k].cell+' - '+team[k].invite+'</div>';}if(team.length===0)h+="No team";h+="<p>Inviter Wallet: R"+u.w.inviter.toFixed(2)+"</p></div>";document.getElementById("app").innerHTML=h;}
function goHistory(){setActive("bHI");if(!cur){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var list=[];if(cur.cell==="ADMIN"){list=txs;}else{var gu=getUser();if(!gu){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}for(var i=0;i<txs.length;i++){if(txs[i].cell===gu.cell)list.push(txs[i]);}}var h='<div class="card"><h3 class="gold">History</h3>';for(var i=list.length-1;i>=0;i--){var t=list[i];h+='<div style="border-bottom:1px solid #222;padding:6px 0"><b>'+t.type+'</b> R'+t.amount+' '+(t.fee?"fee R"+t.fee.toFixed(2):"")+'<br><span class="small">'+new Date(t.date).toLocaleString()+" "+t.note+" "+t.status+'</span></div>';}if(list.length===0)h+="No history";h+="</div>";document.getElementById("app").innerHTML=h;}
function setAdminSub(s){adminSub=s;goAdmin();}
function editUserWallets(cell){
 var u=users.find(function(x){return x.cell===cell});
 if(!u)return;
 ensureWallets(u);
 var h='<div class="card" style="border:2px solid #d4af37"><h3 class="gold">Edit 3 Wallets - '+u.name+'<br><span class="small">'+u.cell+' - '+u.invite+'</span></h3>';
 h+='<label>Main Wallet (Daily cashback)</label><input id="editMain" class="input" type="number" value="'+u.w.main.toFixed(2)+'">';
 h+='<label>Inviter Bonus Wallet (R10 per invite)</label><input id="editInv" class="input" type="number" value="'+u.w.inviter.toFixed(2)+'">';
 h+='<label>Loyalty Bonus Wallet (R2 per daily claim)</label><input id="editLoy" class="input" type="number" value="'+u.w.loyalty.toFixed(2)+'">';
 h+='<p>Total will be: <b id="editTotal">R'+(u.w.main+u.w.inviter+u.w.loyalty).toFixed(2)+'</b></p>';
 h+='<button class="btn" onclick="saveWallets(\''+u.cell+'\')">Save All 3 Wallets</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button>';
 h+='</div>';
 document.getElementById("app").innerHTML=h;
 document.getElementById("editMain").addEventListener("input",updateTotal);
 document.getElementById("editInv").addEventListener("input",updateTotal);
 document.getElementById("editLoy").addEventListener("input",updateTotal);
 function updateTotal(){
  var m=parseFloat(document.getElementById("editMain").value)||0;
  var iv=parseFloat(document.getElementById("editInv").value)||0;
  var l=parseFloat(document.getElementById("editLoy").value)||0;
  document.getElementById("editTotal").innerText="R"+(m+iv+l).toFixed(2);
 }
}
function saveWallets(cell){
 var u=users.find(function(x){return x.cell===cell});
 if(!u)return;
 var m=parseFloat(document.getElementById("editMain").value)||0;
 var iv=parseFloat(document.getElementById("editInv").value)||0;
 var l=parseFloat(document.getElementById("editLoy").value)||0;
 u.w.main=m; u.w.inviter=iv; u.w.loyalty=l;
 save();
 alert("Saved! Main R"+m+" | Inviter R"+iv+" | Loyalty R"+l+" | Total R"+(m+iv+l).toFixed(2));
 goAdmin();
}
function deleteUser(cell){if(!confirm("Delete user "+cell+"?"))return;if(!confirm("FINAL CONFIRM DELETE "+cell+"?"))return;users=users.filter(function(x){return x.cell!==cell});txs=txs.filter(function(t){return t.cell!==cell});save();goAdmin();}
function approveWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;t.status="done";save();alert("Approved R"+t.amount+" for "+t.cell+" Fee R"+t.fee.toFixed(2)+" Receive R"+(t.amount-t.fee).toFixed(2));goAdmin();}
function rejectWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;if(!confirm("Reject and refund R"+t.amount+" to "+t.cell+"?"))return;var u=users.find(function(x){return x.cell===t.cell});if(u){ensureWallets(u);u.w.main+=t.amount;}t.status="rejected";save();goAdmin();}
function goAdmin(){
setActive("bA");
if(!cur||cur.cell!=="ADMIN"){document.getElementById("app").innerHTML='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cellphone" value="0510011039"><input id="aP" class="input" type="password" placeholder="Password"><button class="btn" onclick="adminLogin()">Login</button></div>';return;}
for(var i=0;i<users.length;i++){var exp="DMS"+String(i+1).padStart(3,"0");users[i].invite=exp;}
var totalMain=0,totalInv=0,totalLoy=0;users.forEach(function(u){ensureWallets(u);totalMain+=u.w.main;totalInv+=u.w.inviter;totalLoy+=u.w.loyalty;});
var pend=txs.filter(function(t){return t.status==="pending"});var doneW=txs.filter(function(t){return t.type==="withdraw"&&t.status==="done"});var totalPaid=0;doneW.forEach(function(t){totalPaid+=t.amount;});
var h='<div class="card"><h2 class="gold">Admin Dashboard - Full Control</h2>';
h+='<div class="statBox"><b>'+users.length+'</b><br><span class="small">Total Users</span></div><div class="statBox"><b>'+pend.length+'</b><br><span class="small">Pending</span></div><div class="statBox"><b>R'+totalMain.toFixed(0)+'</b><br><span class="small">Total Main</span></div><div class="statBox"><b>R'+totalInv.toFixed(0)+'</b><br><span class="small">Inviter</span></div><div class="statBox"><b>R'+totalLoy.toFixed(0)+'</b><br><span class="small">Loyalty</span></div><div class="statBox"><b>R'+totalPaid.toFixed(0)+'</b><br><span class="small">Paid Out</span></div>';
h+='<hr><div class="adminTab"><button onclick="setAdminSub(\'dashboard\')" class="'+(adminSub==="dashboard"?"active":"")+'">Dashboard</button><button onclick="setAdminSub(\'withdrawals\')" class="'+(adminSub==="withdrawals"?"active":"")+'">Withdrawals ('+pend.length+')</button><button onclick="setAdminSub(\'users\')" class="'+(adminSub==="users"?"active":"")+'">Users ('+users.length+')</button><button onclick="setAdminSub(\'settings\')" class="'+(adminSub==="settings"?"active":"")+'">Settings</button></div><hr>';
if(adminSub==="dashboard"){
 h+='<h3 class="gold">Pending Withdrawals</h3>';
 if(pend.length===0){h+="<p>No pending</p>";}
 for(var i=0;i<pend.length;i++){var t=pend[i];var idx=txs.indexOf(t);var receive=(t.amount-t.fee).toFixed(2);h+='<div style="border:1px solid #d4af37;padding:10px;margin:8px 0;border-radius:10px;background:#1a1a1a"><b>'+t.cell+'</b><br>Request R'+t.amount+' Fee R'+t.fee.toFixed(2)+' Receive <b class="gold">R'+receive+'</b><br><button class="btn2" onclick="approveWithdraw('+idx+')">Approve</button><button class="btnRed" onclick="rejectWithdraw('+idx+')">Reject & Refund</button></div>';}
}
if(adminSub==="withdrawals"){
 h+='<h3 class="gold">All Withdrawals</h3>';var allW=txs.filter(function(t){return t.type==="withdraw"}).reverse();for(var i=0;i<allW.length;i++){var t=allW[i];var idx=txs.indexOf(t);h+='<div style="border:1px solid #444;padding:8px;margin:6px 0"><b>'+t.cell+'</b> R'+t.amount+' Fee R'+t.fee.toFixed(2)+' Receive R'+(t.amount-t.fee).toFixed(2)+' - <b>'+t.status+'</b><br><span class="small">'+new Date(t.date).toLocaleString()+'</span>';if(t.status==="pending"){h+='<br><button class="btn2" onclick="approveWithdraw('+idx+')">Approve</button><button class="btnRed" onclick="rejectWithdraw('+idx+')">Reject</button>';}h+='</div>';}
}
if(adminSub==="users"){
 h+='<h3 class="gold">Users - Click Edit to change ALL 3 wallets</h3><input id="searchUser" class="input" placeholder="Search by phone or DMS code" oninput="filterUsers(this.value)"><div id="userList">';
 for(var j=0;j<users.length;j++){var uu=users[j];ensureWallets(uu);h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px" class="userItem" data-search="'+uu.cell+' '+uu.invite+' '+uu.name.toLowerCase()+'"><b>'+uu.name+'</b><br>'+uu.cell+' - <b class="gold">'+uu.invite+'</b><br>Main R'+uu.w.main.toFixed(2)+' | Inviter R'+uu.w.inviter.toFixed(2)+' | Loyalty R'+uu.w.loyalty.toFixed(2)+' | '+uu.pkgs.length+' pkgs<br>By: '+(uu.by||"None")+' | '+uu.prov+'<br><button class="btn2" onclick="editUserWallets(\''+uu.cell+'\')">Edit 3 Wallets</button><button class="btnRed" onclick="deleteUser(\''+uu.cell+'\')">Delete User</button></div>';}
 h+='</div>';
}
if(adminSub==="settings"){
 h+='<h3 class="gold">Settings & Tools</h3><button class="btn2" onclick="var c=prompt(\'Add bonus to ALL users - Inviter Wallet amount:\',\'10\'); if(c){var amt=parseFloat(c); users.forEach(function(u){ensureWallets(u); u.w.inviter+=amt;}); save(); alert(\'Added R\'+amt+\' to all Inviter wallets\'); goAdmin();}">Bonus All - Inviter</button><br><br><button class="btn2" onclick="var c=prompt(\'Add loyalty to ALL users:\',\'5\'); if(c){var amt=parseFloat(c); users.forEach(function(u){ensureWallets(u); u.w.loyalty+=amt;}); save(); alert(\'Added R\'+amt+\' to all Loyalty\'); goAdmin();}">Bonus All - Loyalty</button><br><br><button class="btnRed" onclick="if(confirm(\'Clear ALL data?\')){if(confirm(\'FINAL CONFIRM?\')){users=[]; txs=[]; save(); goAdmin();}}">Clear All Data</button>';
}
