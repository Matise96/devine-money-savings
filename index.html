function ensureWallets(u){if(!u.w) u.w={main:0,inviter:0,loyalty:0}; if(u.w.main===undefined) u.w.main=0; if(u.w.inviter===undefined) u.w.inviter=0; if(u.w.loyalty===undefined) u.w.loyalty=0; if(!u.hasOwnProperty('bank')) u.bank=null; if(!u.hasOwnProperty('inviterBonusGiven')) u.inviterBonusGiven=false;}

function getUser(){if(!cur||cur.cell==="ADMIN") return null; for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell){ensureWallets(users[i]);return users[i];}} return null;}
function isQualifiedInvite(invitedUser){if(!invitedUser) return false; var hasBoughtPackage = invitedUser.pkgs && invitedUser.pkgs.length > 0; return hasBoughtPackage;}
function tryGiveInviterBonus(invitedUser){if(!invitedUser ||!invitedUser.by) return false; if(invitedUser.inviterBonusGiven) return false; if(!isQualifiedInvite(invitedUser)) return false; for(var k=0;k<users.length;k++){if(users[k].invite===invitedUser.by || users[k].cell===invitedUser.by){ensureWallets(users[k]);users[k].w.inviter+=10;invitedUser.inviterBonusGiven=true;txs.push({cell:users[k].cell,type:"bonus",amount:10,fee:0,note:"Inviter bonus from "+invitedUser.cell, date:new Date().toISOString(),status:"approved"});save();return true;}} return false;}
// === ONLY FIX 1: R20 catch-up for 04th->05th->06th - NO SHIFTING ===
function autoCreditAll(){
  var now = new Date(); var today8am = new Date(); today8am.setHours(8,0,0,0);
  var totalCredited = 0;
  for(var uIdx=0; uIdx<users.length; uIdx++){
    var u = users[uIdx]; ensureWallets(u);
    for(var pIdx=0; pIdx<u.pkgs.length; pIdx++){
      var p = u.pkgs[pIdx];
      if(p.done) continue;
      if(!p.target) p.target = p.daily * p.duration;
      var bought = new Date(p.boughtAt);
      var firstCredit = new Date(bought); firstCredit.setDate(firstCredit.getDate()+1); firstCredit.setHours(8,0,0,0);
      var diffDays = Math.floor((now - bought)/(1000*60*60*24));
      if(diffDays < 1) continue;
      if(now < firstCredit &&!p.lastClaim) continue;
      var last = p.lastClaim? new Date(p.lastClaim) : null;
      if(last){ if(last.toDateString() === now.toDateString()) continue; }
      var daysToCredit = 1;
      if(!last){
        var daysSinceFirst = Math.floor((today8am - firstCredit)/(1000*60*60*24)) + 1;
        if(daysSinceFirst < 1) daysSinceFirst = 1; if(daysSinceFirst > 14) daysSinceFirst = 14;
        daysToCredit = daysSinceFirst;
      }
      for(var d=0; d<daysToCredit; d++){
        if(p.done) break; if(p.totalEarned >= p.target){p.done=true; break;}
        var remaining = p.target - p.totalEarned; var toCredit = p.daily; if(toCredit > remaining) toCredit = remaining;
        p.totalEarned += toCredit; if(p.totalEarned >= p.target) p.done=true;
        p.lastClaim = now.toISOString(); u.w.main += toCredit; totalCredited += toCredit;
        txs.push({cell:u.cell,type:"earn",amount:toCredit,fee:0,note:"AUTO Daily from "+p.id+" at 08:00 AM", date:now.toISOString(), status:"approved"});
      }
    }
  }
  if(totalCredited>0) save(); return totalCredited;
}

function buyPkg(i){
  var u=getUser();if(!u){alert("Login first");return;}var pkg=PKGS[i];var price=pkg.price||160;
  var b1=u.w.main||0;var b2=u.w.inviter||0;var b3=u.w.loyalty||0; var maxBal=Math.max(b1,b2,b3); if(maxBal<price){alert("Insufficient");return;}
  var choice=prompt("1=Main R"+b1.toFixed(2)+"\n2=Inviter R"+b2.toFixed(2)+"\n3=Loyalty R"+b3.toFixed(2)); if(choice==null)return;
  var bal=0,key="";if(choice=="1"){bal=b1;key="main";}else if(choice=="2"){bal=b2;key="inviter";}else if(choice=="3"){bal=b3;key="loyalty";}else{alert("Invalid");return;}
  if(bal<price){alert("Not enough");return;}
  if(key=="main")u.w.main-=price;if(key=="inviter")u.w.inviter-=price;if(key=="loyalty")u.w.loyalty-=price;
  u.pkgs.push({id:pkg.id,price:price,daily:pkg.daily,earliest:pkg.earliest,duration:pkg.duration,target:pkg.target,boughtAt:new Date().toISOString(),lastClaim:null,totalEarned:0,done:false});

}

function saveWallets(cell){
  var u=users.find(function(x){return x.cell===cell});if(!u)return;ensureWallets(u);
  var oldMain=u.w.main; var newMain=parseFloat(document.getElementById("editMain").value)||0;
  var newInv=parseFloat(document.getElementById("editInv").value)||0; var newLoy=parseFloat(document.getElementById("editLoy").value)||0;
  var diff=newMain-oldMain;
  if(diff>0 && u.pkgs.length>0){
    var active=u.pkgs.find(function(p){return!p.done;});
    if(active){ active.totalEarned+=diff; txs.push({cell:u.cell,type:"earn",amount:diff,fee:0,note:"Manual credit by admin - synced to Total Earned FIXED",date:new Date().toISOString(),status:"approved"}); }
  }
  u.w.main=newMain;u.w.inviter=newInv;u.w.loyalty=newLoy;save();
  if(tryGiveInviterBonus(u)){alert("Wallets Saved + bonus! Total Earned synced R"+(diff>0?diff:0));} else {alert("Wallets Saved - Total Earned synced R"+(diff>0?diff:0));} goAdmin();
}
