<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Devine Money Savings</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;background:#fff;color:#222}
header{background:#b30000;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
nav a{color:#fff;margin-left:12px;text-decoration:none;font-size:14px}
#app{padding:16px;max-width:900px;margin:auto}
.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:16px;margin:12px 0;box-shadow:0 2px 6px rgba(0,0,0,.05)}
.btn{background:#b30000;color:#fff;border:0;padding:10px 16px;border-radius:6px;cursor:pointer}
.btn2{background:#444;color:#fff;border:0;padding:8px 12px;border-radius:6px;cursor:pointer;margin:2px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
.badge{padding:2px 8px;border-radius:12px;font-size:12px;color:#fff}
.badge-pending{background:#ff9800}.badge-approved{background:#4caf50}.badge-rejected{background:#f44336}
.userItem{border-bottom:1px solid #eee;padding:8px 0}
</style>
</head>
<body>
<header>
<div><b>DEVINE MONEY SAVINGS</b></div>
<nav>
<a href="#" onclick="goHome()">Home</a>
<a href="#" onclick="goContact()">Contact us</a>
<a href="#" onclick="goLogin()">Login</a>
<a href="#" id="adminLink" style="display:none" onclick="goAdmin()">Admin</a>
<a href="#" id="logoutLink" style="display:none" onclick="logout()">Logout</a>
</nav>
</header>
<div id="app"></div>
<script>
let users=JSON.parse(localStorage.getItem('dms_users')||'[]');
let txs=JSON.parse(localStorage.getItem('dms_txs')||'[]');
let anns=JSON.parse(localStorage.getItem('dms_anns')||'[]');
let current=JSON.parse(localStorage.getItem('dms_current')||'null');
function save(){
 localStorage.setItem('dms_users',JSON.stringify(users));
 localStorage.setItem('dms_txs',JSON.stringify(txs));
 if(current) localStorage.setItem('dms_current',JSON.stringify(current));
 try{if(window.fbSaveUser&&current)fbSaveUser(current);}catch(e){}
}
function goHome(){
 let h='<div class="card"><h2>Welcome to Devine Money Savings</h2><p>Secure savings, loans, and investments.</p><button class="btn" onclick="goLogin()">Login</button></div>';
 document.getElementById('app').innerHTML=h;
}
function goContact(){document.getElementById('app').innerHTML='<div class="card"><h2>Contact us</h2><p>WhatsApp: 071 123 4567<br>Email: support@devinemoneysavings.co.za</p></div>';}
function goLogin(){document.getElementById('app').innerHTML='<div class="card"><h2>Login</h2><input id="lcell" placeholder="Cell number"><input id="lpass" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button></div>';}
function doLogin(){
 let cell=document.getElementById('lcell').value.trim();
 let pass=document.getElementById('lpass').value.trim();
 let u=users.find(x=>x.cell===cell);
 if(!u){u={cell:cell,pass:pass,name:cell,main:0,isAdmin:true,status:'approved'};users.push(u);}
 current=u;save();
 document.getElementById('adminLink').style.display='inline';
 document.getElementById('logoutLink').style.display='inline';
 goDashboard();
}
function goDashboard(){
 if(!current){goLogin();return;}
 let myTxs=txs.filter(t=>t.cell===current.cell);
 let h='<div class="card"><h2>Hello '+current.name+'</h2><p>Main Wallet: <b>R '+(current.main||0)+'</b></p></div>';
 h+='<div class="card"><h3>Make Deposit (Pending)</h3><input id="depAmt" type="number" placeholder="Amount"><button class="btn" onclick="makeDeposit()">Submit Pending Deposit</button></div>';
 h+='<div class="card"><h3>My History</h3>';
 myTxs.slice(-20).reverse().forEach(t=>{
   let badge=t.status==='pending'?'badge-pending':t.status==='approved'?'badge-approved':'badge-rejected';
   h+='<div>'+t.type+' R'+t.amount+' <span class="badge '+badge+'">'+t.status+'</span> - '+new Date(t.id).toLocaleString()+'</div>';
 });
 h+='</div>';document.getElementById('app').innerHTML=h;colorStatusHistory();
}
function makeDeposit(){
 let amt=parseFloat(document.getElementById('depAmt').value);
 if(!amt){alert('Enter amount');return;}
 let tr={id:Date.now(),cell:current.cell,amount:amt,type:'Deposit',status:'pending',note:''};
 txs.push(tr);save();try{if(window.fbSaveTx)fbSaveTx(tr);}catch(e){}
 alert('Pending deposit submitted!');goDashboard();
}
function goAdmin(){
 if(!current||!current.isAdmin){alert('Admin only');return;}
 let pendCount=txs.filter(t=>t.status==='pending').length;
 let h='<div class="card"><h2>Admin - Users ('+users.length+') Pending ('+pendCount+')</h2><input placeholder="Search" onkeyup="filterUsers(this.value)"><div>';
 users.forEach(u=>{
   let uTxs=txs.filter(t=>t.cell===u.cell);let pend=uTxs.filter(t=>t.status==='pending');
   h+='<div class="userItem" data-search="'+u.cell+'"><b>'+u.cell+' - '+u.name+'</b> Main:R'+(u.main||0)+'<br>';
   if(pend.length>0){
     h+='<div style="margin:6px 0;padding:6px;background:#fff3e0;border-radius:6px"><b>Pending Deposit ('+pend.length+')</b><br>';
     pend.forEach(p=>{
       h+='R'+p.amount+' <button class="btn2" onclick="adminConfirm('+p.id+',true)">Confirmed / Acknowledged</button> <button class="btn2" onclick="adminConfirm('+p.id+',false)">Payment not yet reflecting</button><br>';
     });h+='</div>';
   }h+='</div>';
 });h+='</div></div>';document.getElementById('app').innerHTML=h;
}
function adminConfirm(txId,isApproved){
 let t=txs.find(x=>x.id===txId);if(!t)return;
 let u=users.find(x=>x.cell===t.cell);if(!u)return;
 if(isApproved){t.status='approved';t.note='Confirmed / Acknowledged';u.main=(parseFloat(u.main)||0)+parseFloat(t.amount);if(current&&current.cell===u.cell)current.main=u.main;alert('Confirmed! R'+t.amount+' added to '+u.cell);}
 else{t.status='rejected';t.note='Payment not yet reflecting';alert('Marked as Payment not yet reflecting');}
 save();goAdmin();colorStatusHistory();
}
function colorStatusHistory(){
 document.querySelectorAll('.badge').forEach(el=>{
   let txt=el.innerText.toLowerCase();
   if(txt.includes('pending'))el.className='badge badge-pending';
   if(txt.includes('approved')||txt.includes('confirmed')||txt.includes('acknowledged'))el.className='badge badge-approved';
   if(txt.includes('rejected')||txt.includes('not yet'))el.className='badge badge-rejected';
 });
}
setInterval(colorStatusHistory,700);
function filterUsers(q){q=(q||'').toLowerCase();document.querySelectorAll('.userItem').forEach(el=>{var s=(el.getAttribute('data-search')||'').toLowerCase();el.style.display=s.indexOf(q)===-1?'none':'';});}
function logout(){localStorage.removeItem('dms_current');current=null;document.getElementById('adminLink').style.display='none';document.getElementById('logoutLink').style.display='none';goHome();}
goHome();
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getFirestore,doc,setDoc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyB8Nag3NUVQyQVK2LINbKLwbrWUA",authDomain:"dms96-5b0a1.firebaseapp.com",projectId:"dms96-5b0a1",storageBucket:"dms96-5b0a1.firebasestorage.app",messagingSenderId:"230194828323",appId:"1:230194828323:web:597f93d5a4306aafd6d96"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
window.fbSaveUser=async(u)=>{try{await setDoc(doc(db,"users",u.cell),u);}catch(e){}};
window.fbSaveTx=async(t)=>{try{await setDoc(doc(db,"transactions",Date.now()+""+Math.random().toString(36).slice(2,4)),t);}catch(e){}};
</script>
</body>
</html>
