<!DOCTYPE html>
<html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>DMS</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff}header{background:#000;border-bottom:2px solid #d4af37;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{color:#d4af37;font-weight:900}.gold{color:#d4af37}.card{background:#141414;border:1px solid #333;margin:12px;border-radius:14px;padding:16px}.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff}.btn{width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:900}.btn2{padding:9px 14px;background:#d4af37;color:#000;border:none;border-radius:8px;font-weight:700;margin:4px}.badge{display:inline-block;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}.pkg{border:1px solid #333;background:#1c1c1c;padding:14px;border-radius:12px;margin:10px 0}.small{font-size:12px;color:#aaa}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#111}nav button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#d4af37;white-space:nowrap}nav button.active{background:#d4af37;color:#000}</style></head><body><header><div class='logo'>DMS - Devine Money Savings</div><button class='btn2' onclick='logout()' id='logoutBtn' style='display:none;background:#ff3b3b;color:#fff'>Logout</button></header><nav><button onclick='goHome()' id='bH' class='active'>Home</button><button onclick='goWallets()' id='bW'>Wallets</button><button onclick='goPackages()' id='bP'>Packages</button><button onclick='goTeam()' id='bT'>Team</button><button onclick='goHistory()' id='bHI'>History</button><button onclick='goAdmin()' id='bA'>Admin</button></nav><div id='app'></div><script>
var COMPANY='Devine Pty-Ltd reg 2024/344088/07';var WHATSAPP='0510011039';
var PKGS=[{id:'A',name:'PACKAGE A',price:160,daily:10,earliest:7,desc:'Earliest withdrawal in 7 days. Minimum withdrawal at R70.'},{id:'B',name:'PACKAGE B',price:250,daily:10,earliest:7,desc:'Earliest withdrawal in 7 days. Minimum withdrawal at R70.'},{id:'C',name:'PACKAGE C',price:340,daily:10,earliest:7,desc:'Earliest withdrawal in 7 days. Minimum withdrawal at R70.'},{id:'D',name:'PACKAGE D',price:430,daily:35,earliest:2,desc:'Earliest withdrawal in 2 days. Minimum withdrawal at R70.'},{id:'E',name:'PACKAGE E',price:520,daily:70,earliest:1,desc:'Earliest withdrawal in 24hrs. Minimum withdrawal at R70.'}];
var users=JSON.parse(localStorage.getItem('dms_users')||'[]');var txs=JSON.parse(localStorage.getItem('dms_txs')||'[]');var cur=JSON.parse(localStorage.getItem('dms_cur')||'null');
function save(){localStorage.setItem('dms_users',JSON.stringify(users));localStorage.setItem('dms_txs',JSON.stringify(txs));localStorage.setItem('dms_cur',JSON.stringify(cur));}
function setActive(id){document.querySelectorAll('nav button').forEach(function(b){b.classList.remove('active')});var e=document.getElementById(id);if(e)e.classList.add('active');}
function getUser(){if(!cur||cur.cell==='ADMIN')return null;for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell)return users[i];}return null;}
function logout(){cur=null;localStorage.removeItem('dms_cur');document.getElementById('logoutBtn').style.display='none';goHome();}
function checkLogout(){document.getElementById('logoutBtn').style.display=cur?'block':'none';}
function goHome(){setActive('bH');checkLogout();var u=getUser();if(!u&&(!cur||cur.cell!=='ADMIN')){var html='<div class=card style=text-align:center;border:2px solid #d4af37><div class=badge>EXCLUSIVE PACKAGES - '+COMPANY+'</div><h2 class=gold style=margin:10px 0>DEVINE MONEY SAVINGS</h2><p class=small>WhatsApp: '+WHATSAPP+' | Min Withdraw R70</p><div style=text-align:left;margin-top:12px>';for(var i=0;i<PKGS.length;i++){var p=PKGS[i];html+='<div class=pkg><span class=badge>'+p.name+'</span> <b style=float:right>R'+p.price+'</b><br><br><b>R'+p.price+' > R'+p.daily+' daily cashback</b><br><span class=small>'+p.desc+'</span></div>';}html+='</div><hr><h3>Login</h3><input id=lC class=input placeholder=Cellphone><input id=lP class=input type=password placeholder=Password><button class=btn onclick=doLogin()>Login</button><p class=small>No account? <a href=# onclick=goRegister() style=color:#d4af37>Register here</a></p><p class=small style=margin-top:12px>'+COMPANY+'<br>WhatsApp '+WHATSAPP+'</p></div>';document.getElementById('app').innerHTML=html;return;}if(cur&&cur.cell==='ADMIN'){goAdmin();return;}var totalDaily=0;for(var j=0;j<u.pkgs.length;j++){if(!u.pkgs[j].done)totalDaily+=u.pkgs[j].daily;}var h='<div class=card><h3 class=gold>Welcome '+u.name+' </h3><p>Cell: '+u.cell+'<br>Invite Code: <b class=gold>'+u.invite+'</b><br><span class=small>'+location.origin+location.pathname+'?invite='+u.invite+'</span></p><hr><p>Main: <b>R'+u.w.main.toFixed(2)+'</b><br>Bonus: <b>R'+u.w.bonus.toFixed(2)+'</b><br>Daily: <b>R'+totalDaily+'</b></p><button class=btn2 onclick=goWallets()>Wallets</button><button class=btn2 onclick=goPackages()>Buy Package</button><button class=btn2 onclick=goTeam()>My Team</button></div>';document.getElementById('app').innerHTML=h;}
function goRegister(){var inv=new URLSearchParams(location.search).get('invite')||'';var h='<div class=card><h3 class=gold>Register - '+COMPANY+'</h3><input id=rN class=input placeholder=Full Name *><input id=rC class=input placeholder=Cellphone *><input id=rE class=input placeholder=Email *><select id=rPr class=input><option value=>Province *</option><option>Free State</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Western Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select><select id=rG class=input><option value=>Gender *</option><option>Male</option><option>Female</option></select><input id=rP class=input type=password placeholder=Password *><input id=rI class=input placeholder=Invite Code value='+inv+'><button class=btn onclick=doRegister()>Create Account</button></div>';document.getElementById('app').innerHTML=h;}
function doRegister(){var n=document.getElementById('rN').value.trim(),c=document.getElementById('rC').value.trim(),e=document.getElementById('rE').value.trim(),pr=document.getElementById('rPr').value,g=document.getElementById('rG').value,p=document.getElementById('rP').value.trim(),inv=document.getElementById('rI').value.trim().toUpperCase();if(!n||!c||!e||!pr||!g||!p){alert('Fill all *');return;}for(var i=0;i<users.length;i++){if(users[i].cell===c){alert('Cell exists');return;}}var code='DMS'+Math.floor(1000+Math.random()*9000);var u={cell:c,name:n,email:e,prov:pr,gender:g,pass:p,invite:code,by:inv||null,w:{main:0,bonus:0},pkgs:[]};users.push(u);if(inv){for(var k=0;k<users.length;k++){if(users[k].invite===inv||users[k].cell===inv){users[k].w.bonus+=10;txs.push({cell:users[k].cell,type:'bonus',amount:10,fee:0,note:'Invite bonus from '+c,date:new Date().toISOString(),status:'done'});break;}}}save();alert('Registered! Now login.');goHome();}
function doLogin(){var c=document.getElementById('lC').value.trim(),p=document.getElementById('lP').value.trim();if(c==='0510011039'&&p==='admin123'){cur={cell:'ADMIN'};save();goAdmin();return;}for(var i=0;i<users.length;i++){if(users[i].cell===c&&users[i].pass===p){cur={cell:users[i].cell};save();goHome();return;}}alert('Wrong cell or password');}
function goPackages(){setActive('bP');checkLogout();var h='<div class=card><h3 class=gold>Exclusive Packages</h3><p class=small>'+COMPANY+'</p>';for(var i=0;i<PKGS.length;i++){var pk=PKGS[i];h+='<div class=pkg><span class=badge>'+pk.name+'</span> <b style=float:right>R'+pk.price+'</b><br><br><b>R'+pk.price+' > R'+pk.daily+' daily cashback</b><br><span class=small>'+pk.desc+'</span><br><br><button class=btn2 onclick=buyPkg('+i+')>Buy '+pk.name+'</button></div>';}h+='</div>';document.getElementById('app').innerHTML=h;}
function buyPkg(i){var u=getUser();if(!u){alert('Login first');return;}var pk=PKGS[i];if(!confirm('Buy '+pk.name+' for R'+pk.price+'? Daily R'+pk.daily)){return;}u.pkgs.push({pkgId:pk.id,price:pk.price,daily:pk.daily,earliest:pk.earliest,boughtAt:Date.now(),claimed:0,done:false});save();alert('Bought '+pk.name+'!');goWallets();}
function goWallets(){setActive('bW');checkLogout();var u=getUser();if(!u){document.getElementById('app').innerHTML='<div class=card>Login first</div>';return;}var now=Date.now(),canClaim=0,details='';for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];var daysPassed=Math.floor((now-p.boughtAt)/86400000);var claimable=Math.min(daysPassed,30)-p.claimed;if(claimable>0&&!p.done)canClaim+=claimable*p.daily;details+='<div style=border-bottom:1px solid #222;padding:4px 0>'+p.pkgId+' R'+p.price+' '+p.claimed+'/30 R'+p.daily+'/day</div>';}var h='<div class=card><h3 class=gold>Wallets</h3><p>Main R'+u.w.main.toFixed(2)+'<br>Bonus R'+u.w.bonus.toFixed(2)+'<br>Total R'+(u.w.main+u.w.bonus).toFixed(2)+'</p><p>Pending: <b class=gold>R'+canClaim+'</b></p><button class=btn onclick=claimDaily()>Claim Daily</button><hr><button class=btn2 onclick=doWithdraw()>Withdraw Min R70</button><hr>'+(details||'No packages')+'</div>';document.getElementById('app').innerHTML=h;}
function claimDaily(){var u=getUser();var now=Date.now(),earned=0;for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];if(p.done)continue;var daysPassed=Math.floor((now-p.boughtAt)/86400000);var claimable=Math.min(daysPassed,30)-p.claimed;if(claimable>0){earned+=claimable*p.daily;p.claimed+=claimable;if(p.claimed>=30)p.done=true;}}if(earned===0){alert('Come back tomorrow - 24hrs needed');return;}u.w.main+=earned;txs.push({cell:u.cell,type:'daily',amount:earned,fee:0,note:'Daily R'+earned,date:new Date().toISOString(),status:'done'});save();alert('Claimed R'+earned);goWallets();}
function doWithdraw(){var u=getUser();if(!u)return;var total=u.w.main+u.w.bonus;if(total<70){alert('Min R70 needed. You have R'+total.toFixed(2));return;}var now=Date.now();if(u.pkgs.length>0){var ok=false;for(var i=0;i<u.pkgs.length;i++){if(Math.floor((now-u.pkgs[i].boughtAt)/86400000)>=u.pkgs[i].earliest){ok=true;break;}}if(!ok){var need=u.pkgs[0].earliest;for(var j=1;j<u.pkgs.length;j++){if(u.pkgs[j].earliest<need)need=u.pkgs[j].earliest;}alert('Earliest not reached. Need '+need+' day(s). E=24hrs D=2days A/B/C=7days');return;}}alert('Withdrawal Fee Notice:\n\nPlease note that all withdrawals have a 25% fee.');var amt=parseFloat(prompt('Balance R'+total.toFixed(2)+'\nEnter amount Min R70:','70'));if(!amt||amt<70){alert('Min R70');return;}if(amt>total){alert('Insufficient');return;}var fee=amt*0.25;var rem=amt;if(u.w.main>=rem){u.w.main-=rem;rem=0;}else{rem-=u.w.main;u.w.main=0;u.w.bonus-=rem;}txs.push({cell:u.cell,type:'withdraw',amount:amt,fee:fee,note:'Withdraw R'+amt+' 25% fee',date:new Date().toISOString(),status:'pending'});save();alert('Withdrawal R'+amt+' requested - 25% fee applies - Pending approval');goHistory();}
function goTeam(){setActive('bT');var u=getUser();if(!u){document.getElementById('app').innerHTML='<div class=card>Login</div>';return;}var code=u.invite;var team=[];for(var i=0;i<users.length;i++){if(users[i].by===code||users[i].by===u.cell)team.push(users[i]);}var link=location.origin+location.pathname+'?invite='+code;var h='<div class=card><h3 class=gold>My Team '+team.length+'</h3><p>Code <b>'+code+'</b></p><input class=input value='+link+' readonly><button class=btn2 onclick=navigator.clipboard.writeText(&apos;'+link+'&apos;)>Copy Link</button><hr>';for(var k=0;k<team.length;k++){h+='<div>'+team[k].name+' '+team[k].cell+'</div>';}if(team.length===0)h+='No team';h+='<p>Bonus R'+u.w.bonus+'</p></div>';document.getElementById('app').innerHTML=h;}
function goHistory(){setActive('bHI');if(!cur){document.getElementById('app').innerHTML='<div class=card>Login</div>';return;}var list=[];if(cur.cell==='ADMIN'){list=txs;}else{var gu=getUser();if(!gu){document.getElementById('app').innerHTML='<div class=card>Login</div>';return;}for(var i=0;i<txs.length;i++){if(txs[i].cell===gu.cell)list.push(txs[i]);}}var h='<div class=card><h3 class=gold>History</h3>';for(var i=list.length-1;i>=0;i--){var t=list[i];h+='<div style=border-bottom:1px solid #222;padding:6px 0><b>'+t.type+'</b> R'+t.amount+' '+(t.fee?'fee R'+t.fee.toFixed(2):'')+'<br><span class=small>'+new Date(t.date).toLocaleString()+' '+t.note+' '+t.status+'</span></div>';}if(list.length===0)h+='No history';h+='</div>';document.getElementById('app').innerHTML=h;}
function goAdmin(){setActive('bA');if(!cur||cur.cell!=='ADMIN'){document.getElementById('app').innerHTML='<div class=card><h3>Admin Login</h3><input id=aC class=input placeholder=Cell><input id=aP class=input type=password placeholder=Password><button class=btn onclick=if(document.getElementById(&apos;aC&apos;).value==&apos;0510011039&apos;&amp;&amp;document.getElementById(&apos;aP&apos;).value==&apos;admin123&apos;){cur={cell:&apos;ADMIN&apos;};save();goAdmin();}else alert(&apos;wrong&apos;)>Login</button></div>';return;}var pend=[];for(var i=0;i<txs.length;i++){if(txs[i].status==='pending')pend.push(txs[i]);}var h='<div class=card><h3 class=gold>Admin Users '+users.length+' Pending '+pend.length+'</h3>';for(var i=0;i<pend.length;i++){var t=pend[i];var idx=txs.indexOf(t);h+='<div style=border:1px solid #444;padding:8px;margin:6px 0><b>'+t.cell+'</b> R'+t.amount+' fee 25%<br><button class=btn2 onclick=txs['+idx+'].status=&apos;done&apos;;save();goAdmin()>Approve</button><button class=btn2 style=background:#ff3b3b;color:#fff onclick=var u=null;for(var k=0;k<users.length;k++){if(users[k].cell==&apos;'+t.cell+'&apos;){u=users[k];break;}}if(u)u.w.main+='+t.amount+';txs['+idx+'].status=&apos;rejected&apos;;save();goAdmin()>Reject</button></div>';}if(pend.length===0)h+='No pending';h+='<hr>';for(var j=0;j<users.length;j++){var uu=users[j];h+='<div>'+uu.name+' '+uu.cell+' Main R'+uu.w.main+' Bonus R'+uu.w.bonus+' Pkgs '+uu.pkgs.length+'</div>';}h+='</div>';document.getElementById('app').innerHTML=h;}
goHome();
</script></body></html>
