<script>
// AUTO FIX - clear bad data if URL has?reset
if(location.search.includes('reset') || location.search.includes('clear')){ localStorage.clear(); alert('Storage cleared!'); location.href=location.href.split('?')[0]; }
let users=JSON.parse(localStorage.getItem('dms_users')||'[]');
let txs=JSON.parse(localStorage.getItem('dms_txs')||'[]');
let currentUser=JSON.parse(localStorage.getItem('dms_currentUser')||'null');
let genOtp=''; let pendingAction=null; let isAdminMode=false; let activeWallet=''; const MIN_WITHDRAW=70;
const PACKAGES=[{id:1,name:'Package A',price:160,daily:12,days:30},{id:2,name:'Package B',price:320,daily:25,days:30},{id:3,name:'Package C',price:640,daily:55,days:30}];
function saveUsers(){ localStorage.setItem('dms_users',JSON.stringify(users)); }
function saveCurrent(){ localStorage.setItem('dms_currentUser',JSON.stringify(currentUser)); let idx=users.findIndex(u=>u.cell===currentUser.cell); if(idx>=0){ users[idx]=currentUser; saveUsers(); } }
function isWithdrawOpen(){ let d=new Date(); let day=d.getDay(); let hour=d.getHours(); return day>=1&&day<=6&&hour>=8&&hour<18; }
function init(){
 try{
  if(!currentUser){ showLogin(); return; }
  // Fix old users with no wallets
  if(!currentUser.wallets){ currentUser.wallets={main:0,inviter:0,loyal:0}; saveCurrent(); }
  if(!currentUser.myCode){ currentUser.myCode='DMS'+Math.floor(1000+Math.random()*9000); saveCurrent(); }
  runDailyCredits();
  document.getElementById('userInfo').innerText=currentUser.cell+' | '+currentUser.myCode;
  showNav(); showPage('home');
 }catch(e){ console.error(e); localStorage.clear(); location.reload(); }
}
function doLogout(){ localStorage.removeItem('dms_currentUser'); location.reload(); }
function showNav(){
 let nav=`<button onclick="showPage('home')" id="nb-home" class="active">Home</button><button onclick="showPage('packages')" id="nb-packages">Packages</button><button onclick="showPage('wallet')" id="nb-wallet">Wallets</button><button onclick="showPage('deposit')" id="nb-deposit">Deposit</button><button onclick="showPage('withdraw')" id="nb-withdraw">Withdraw</button><button onclick="showPage('bonus')" id="nb-bonus">Bonus</button><button onclick="showPage('history')" id="nb-history">History</button><button onclick="showPage('profile')" id="nb-profile">Profile</button><button onclick="showPage('contact')" id="nb-contact">Contact</button><button onclick="showPage('about')" id="nb-about">About</button>`;
 if(currentUser && (currentUser.cell==='admin' || currentUser.cell==='0712345678')){ nav+=`<button onclick="showPage('admin')" id="nb-admin">Admin</button>`; isAdminMode=true; }

}
function setActive(id){ document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active')); let el=document.getElementById('nb-'+id); if(el) el.classList.add('active'); }
function showPage(p){ setActive(p); if(p==='home') renderHome(); else if(p==='packages') renderPackages(); else if(p==='wallet') renderWallet(); else if(p==='deposit') renderDeposit(); else if(p==='withdraw') renderWithdrawPage(); else if(p==='bonus') renderBonus(); else if(p==='history') renderHistory(); else if(p==='profile') renderProfile(); else if(p==='contact') renderContact(); else if(p==='about') renderAbout(); else if(p==='admin') renderAdmin(); }

 document.getElementById('navBar').innerHTML=''; document.getElementById('userInfo').innerText='';
 document.getElementById('app').innerHTML=`
 <div class="card"><h3>💰 Devine Money Savings</h3><p class="small">Company: Devine Pty-Ltd | Reg: 2024/344088/07</p><img src="packages.jpg" class="responsive" onerror="this.style.display='none'"><p class="small">Bank Zero: 8020 5598 418 | Branch 888000</p></div>
 <div class="card"><h3>Login</h3><input id="lCell" class="input" placeholder="Cell number"><input id="lPass" class="input" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><p class="small">Admin login: admin / admin123</p></div>

}
function login(){
 let cell=document.getElementById('lCell').value.trim(); let pass=document.getElementById('lPass').value;
 if(cell==='admin' && pass==='admin123'){ currentUser={cell:'admin',fullname:'Admin',myCode:'ADMIN',wallets:{main:0,inviter:0,loyal:0},bank:{bankName:'Bank Zero'},invites:0}; localStorage.setItem('dms_currentUser',JSON.stringify(currentUser)); isAdminMode=true; init(); return; }
 let u=users.find(x=>x.cell===cell && x.password===pass); if(!u){ alert('Wrong cell or password. If blank before, click Clear Storage button.'); return; }
 currentUser=u; saveCurrent(); init();
}
function register(){
 let name=document.getElementById('rName').value.trim(); let cell=document.getElementById('rCell').value.trim(); let email=document.getElementById('rEmail').value.trim(); let province=document.getElementById('rProvince').value.trim(); let pass=document.getElementById('rPass').value; let inv=document.getElementById('rCode').value.trim();
 if(!name||!cell||!email||!pass){ alert('Fill all required'); return; }
 if(users.find(x=>x.cell===cell)){ alert('Cell already exists - login'); return; }
 let myCode='DMS'+Math.floor(1000+Math.random()*9000);
 let newUser={fullname:name,cell,email,province,password:pass,myCode,invites:0,wallets:{main:0,inviter:0,loyal:0},bank:{bankName:'Bank Zero',accNumber:'',branchCode:'888000',otherBanks:[]},packages:[],createdAt:new Date().toISOString()};
 users.push(newUser);
 if(inv){ let inviter=users.find(x=>x.myCode===inv); if(inviter){ inviter.invites=(inviter.invites||0)+1; inviter.wallets.inviter=(inviter.wallets.inviter||0)+10; txs.push({cell:inviter.cell,type:'bonus',wallet:'inviter',amount:10,fee:0,desc:'R10 Invite bonus from '+cell,date:new Date().toISOString(),status:'completed'}); } }
 saveUsers(); localStorage.setItem('dms_txs',JSON.stringify(txs)); currentUser=newUser; saveCurrent(); alert('Account created! Code: '+myCode); init();
}
function runDailyCredits(){
 let today=new Date().toDateString();
 if(localStorage.getItem('dms_lastCredit')===today) return;
 users.forEach(u=>{
  if(!u.packages) return;
  u.packages.forEach(pkg=>{
   if(pkg.remaining>0){ let earn=PACKAGES.find(p=>p.id===pkg.packageId)?.daily||0; u.wallets.main=(u.wallets.main||0)+earn; pkg.remaining--; txs.push({cell:u.cell,type:'earning',wallet:'main',amount:earn,fee:0,desc:'Daily '+earn+' from '+pkg.name,date:new Date().toISOString(),status:'completed'}); }
  });
 });
 localStorage.setItem('dms_lastCredit',today); localStorage.setItem('dms_txs',JSON.stringify(txs)); saveUsers(); if(currentUser){ let fresh=users.find(x=>x.cell===currentUser.cell); if(fresh) currentUser=fresh; }
}

 <div class="card"><h3>💼 3 Wallets</h3><p>Main: R${(currentUser.wallets.main||0).toFixed(2)}<br>Inviter: R${(currentUser.wallets.inviter||0).toFixed(2)} (R10/invite)<br>Loyalty: R${(currentUser.wallets.loyal||0).toFixed(2)} (No Fee)</p><button class="btn" onclick="showPage('packages')">Buy Package</button></div>
 <div class="card"><h3>📦 Our Packages</h3><img src="packages.jpg" class="responsive" onerror="this.style.display='none'"></div>`;

 document.getElementById('app').innerHTML=html+`<div class="card"><p class="small">Uses Main Wallet. Must deposit via EFT first.</p></div>`;

function buyPkg(id){
 let pkg=PACKAGES.find(p=>p.id===id); if((currentUser.wallets.main||0)<pkg.price){ alert('Insufficient Main Wallet. Deposit first. Balance R'+(currentUser.wallets.main||0)); showPage('deposit'); return; }
 currentUser.wallets.main-=pkg.price; if(!currentUser.packages) currentUser.packages=[]; currentUser.packages.push({packageId:id,name:pkg.name,daily:pkg.daily,remaining:pkg.days,boughtAt:new Date().toISOString()});
 txs.push({cell:currentUser.cell,type:'purchase',wallet:'main',amount:-pkg.price,fee:0,desc:'Bought '+pkg.name,date:new Date().toISOString(),status:'completed'}); saveCurrent(); localStorage.setItem('dms_txs',JSON.stringify(txs)); alert('Package bought! Daily R'+pkg.daily+' will credit automatically.'); showPage('wallet');
}

 document.getElementById('app').innerHTML=`
 <div class="card"><h3>💰 Main Wallet: R${(currentUser.wallets.main||0).toFixed(2)}</h3><p class="small">Used to buy packages. 25% withdrawal fee.</p><button class="btn" onclick="showPage('deposit')">Deposit EFT</button><button class="btn" onclick="showPage('withdraw')">Withdraw</button></div>

 <div class="card"><h3>🏆 Loyalty: R${(currentUser.wallets.loyal||0).toFixed(2)}</h3><p class="small">Credited by Admin. 0% fee - full amount!</p></div>`;

function doLogin(){
 let cell=document.getElementById('lcell').value.trim(); let pass=document.getElementById('lpass').value.trim();
 let u=users.find(x=>x.cell===cell && x.password===pass);
 if(!u){ alert('Wrong cell or password'); return; }
 currentUser=u; localStorage.setItem('dms_currentUser',JSON.stringify(u)); init();
}
function doRegister(){
 let fn=document.getElementById('fullname').value.trim(); let g=document.getElementById('gender').value;
 let cell=document.getElementById('cell').value.trim(); let email=document.getElementById('email').value.trim().toLowerCase();
 let prov=document.getElementById('province').value; let inv=document.getElementById('inviter').value.trim().toUpperCase();
 let pw=document.getElementById('password').value; let pw2=document.getElementById('password2').value;
 let err=document.getElementById('regErr');
 if(!fn||!g||!cell||!email||!prov||!pw||!pw2){ err.innerText='Fill all *'; return; }
 if(pw!==pw2){ err.innerText='Passwords no match'; return; }
 if(users.some(u=>u.cell===cell)){ err.innerText='Cell already exists - duplicate!'; return; }
 if(users.some(u=>u.email===email)){ err.innerText='Email exists'; return; }
 let next=users.length+1; let myCode='DMS-'+String(next).padStart(3,'0');
 let newUser={fullname:fn, gender:g, cell,email, province:prov, inviterCode:inv, myCode, password:pw, wallets:{main:0,inviter:0,loyal:0}, bank:{bankName:'Bank Zero', accNumber:'', branch:'888000', otherBanks:[]}, activePackages:[], invites:0, date:new Date().toISOString()};
 users.push(newUser); saveUsers();
 alert('Registered! Your code: '+myCode+' | Login with cell number'); showLogin();
}

 if(isAdminMode) html+=`<button onclick="showPage('admin')" id="nav-admin" style="background:#e74c3c;color:#fff">🔧 Admin</button>`;

}

 document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));

 else if(p==='history') renderHistory();
 else if(p==='profile') renderProfile();
 else if(p==='contact') renderContact();
 else if(p==='about') renderAbout();
 else if(p==='admin') renderAdmin();
}
function renderHome(){
 let pkgs=Object.entries(PACKAGES).map(([k,v])=>`
 <div class="card"><h3>${v.name} - R${v.price}</h3><p>Daily cashback system - hidden logic</p><button class="btn" onclick="buyPackage('${k}')">Buy ${v.name} - R${v.price}</button></div>`).join('');
 document.getElementById('app').innerHTML=`<div class="card"><h3>Welcome ${currentUser.fullname}</h3><p>Main Balance: <b>R${(currentUser.wallets.main||0).toFixed(2)}</b></p></div>`+pkgs;
}
function buyPackage(key){
 let pkg=PACKAGES[key];
 let w=prompt(`Buy ${pkg.name} for R${pkg.price}? Type wallet: main / inviter / loyal`);
 if(!w) return; w=w.toLowerCase(); if(!['main','inviter','loyal'].includes(w)){ alert('Invalid wallet'); return; }
 if((currentUser.wallets[w]||0)<pkg.price){ alert('Insufficient balance in '+w+' wallet. Deposit first via Deposit page.'); return; }
 currentUser.wallets[w]-=pkg.price;
 if(!currentUser.activePackages) currentUser.activePackages=[];
 currentUser.activePackages.push({key, name:pkg.name, price:pkg.price, daily:pkg.daily, totalDays:pkg.days, creditedDays:0, startDate:new Date().toISOString(), completed:false});
 txs.push({cell:currentUser.cell, type:'purchase', wallet:w, amount:-pkg.price, fee:0, desc:`Bought ${pkg.name}`, date:new Date().toISOString(), status:'completed'});
 if(currentUser.inviterCode &&!currentUser.inviterRewarded){
   let inviter=users.find(u=>u.myCode===currentUser.inviterCode);
   if(inviter){ inviter.wallets.inviter=(inviter.wallets.inviter||0)+INVITE_BONUS; inviter.invites=(inviter.invites||0)+1; txs.push({cell:inviter.cell, type:'bonus', wallet:'inviter', amount:INVITE_BONUS, fee:0, desc:`Invite bonus from ${currentUser.myCode}`, date:new Date().toISOString(), status:'completed'}); currentUser.inviterRewarded=true; }
 }
 saveCurrent(); localStorage.setItem('dms_txs',JSON.stringify(txs));
 alert(`Success! Bought ${pkg.name}. Daily R${pkg.daily} will credit to Main wallet for ${pkg.days} days.`);
 showPage('wallet');
}

function openW(wallet){
 activeWallet=wallet;
 if(!isWithdrawOpen()){ alert('Withdrawals runs from Mon-Sat 08:00 am - 18:00 pm'); return; }
 let bal=currentUser.wallets[wallet]||0;
 if(bal<MIN_WITHDRAW){ alert('Minimum withdrawal is R70. Your balance R'+bal); return; }
 document.getElementById('wWalletName').innerText=wallet+' - Balance R'+bal.toFixed(2);
 document.getElementById('wBankName').innerText=currentUser.bank?.bankName||'Bank Zero';
 document.getElementById('wAccNum').value=currentUser.bank?.accNumber||'';
 let feeRate = (wallet==='loyal'?0:0.25);
 document.getElementById('wFeeText').innerText = (feeRate*100)+'%';
 document.getElementById('wAmount').addEventListener('input', updateNet);
 document.getElementById('withdrawOverlay').style.display='flex';
}
function closeWithdraw(){ document.getElementById('withdrawOverlay').style.display='none'; }
function updateNet(){ let amt=parseFloat(document.getElementById('wAmount').value)||0; let feeRate=(activeWallet==='loyal'?0:0.25); let fee=amt*feeRate; let net=amt-fee; document.getElementById('wFeeText').innerText=(feeRate*100)+'% = R'+fee.toFixed(2); document.getElementById('wNetText').innerText='R'+net.toFixed(2); }
document.addEventListener('input', (e)=>{ if(e.target.id==='wAmount') updateNet(); });
function requestWithdraw(){
 let acc=document.getElementById('wAccNum').value.trim(); let amt=parseFloat(document.getElementById('wAmount').value);
 let err=document.getElementById('wErr');
 if(!acc){ err.innerText='Enter account number'; return; }
 if(!amt || amt<MIN_WITHDRAW){ err.innerText='Min R70'; return; }
 if(amt>(currentUser.wallets[activeWallet]||0)){ err.innerText='Insufficient balance'; return; }
 genOtp=Math.floor(100000+Math.random()*900000).toString();
 document.getElementById('otpEmail').innerText=currentUser.email;
 document.getElementById('otpShow').innerText=genOtp;
 pendingAction={type:'withdraw', wallet:activeWallet, amount:amt, acc};
 document.getElementById('withdrawOverlay').style.display='none';
 document.getElementById('otpOverlay').style.display='flex';
}
function closeOtp(){ document.getElementById('otpOverlay').style.display='none'; }
function confirmOtpAction(){
 let input=document.getElementById('otpInput').value.trim(); if(input!==genOtp){ document.getElementById('otpErr').innerText='Wrong OTP - try '+genOtp; return; }
 document.getElementById('otpOverlay').style.display='none';
 if(pendingAction.type==='withdraw'){
   let feeRate=(pendingAction.wallet==='loyal'?0:0.25); let fee=pendingAction.amount*feeRate;
   currentUser.wallets[pendingAction.wallet]-=pendingAction.amount;
   txs.push({cell:currentUser.cell, type:'withdrawal', wallet:pendingAction.wallet, amount:-pendingAction.amount, fee, net:pendingAction.amount-fee, acc:pendingAction.acc, date:new Date().toISOString(), status:'pending', desc:`Withdraw to ${pendingAction.acc}`});
   saveCurrent(); localStorage.setItem('dms_txs',JSON.stringify(txs));
   alert(`Withdrawal R${pendingAction.amount} submitted. Fee R${fee.toFixed(2)}, you receive R${(pendingAction.amount-fee).toFixed(2)}. Pending admin.`);
   showPage('history');
 } else if(pendingAction.type==='bankUpdate'){
   currentUser.bank.accNumber=pendingAction.acc; currentUser.fullname=pendingAction.name; currentUser.bank.bankName='Bank Zero';
   saveCurrent(); alert('Banking details updated with OTP!'); showPage('profile');
 }
}
function renderBonus(){
 document.getElementById('app').innerHTML=`
 <div class="card"><h3>🎁 Bonus Page</h3>
 <p>• Earn <b>R10 per invite</b> guaranteed.<br>• Invites are unlimited.<br>• <b>NB: Invitee must deposit for any package for the inviter to be rewarded.</b><br>• You do not have to invite many people, you can just invite 7 people once and everytime they deposit you earn your reward and can be immediately withdrawn from Inviter bonus Wallet as the minimum withdrawal amount is R70.</p>
 <p>Your Code: <b>${currentUser.myCode}</b><br>Invites: <b>${currentUser.invites||0}</b><br>Bonus: <b>R${(currentUser.wallets.inviter||0).toFixed(2)}</b></p></div>`;
}
function renderHistory(){
 let myTxs=txs.filter(t=>t.cell===currentUser.cell).sort((a,b)=>new Date(b.date)-new Date(a.date));
 let html=myTxs.map(t=>`<tr><td>${new Date(t.date).toLocaleString()}</td><td>${t.type}</td><td>${t.wallet}</td><td>R${t.amount}</td><td>${t.fee?'R'+t.fee.toFixed(2):''}</td><td>${t.status||''}</td><td>${t.desc||''}</td></tr>`).join('');
 if(!html) html='<tr><td colspan=7>No transactions</td></tr>';
 document.getElementById('app').innerHTML=`<div class="card"><h3>📜 Transaction History</h3><div style="overflow-x:auto"><table><tr><th>Date</th><th>Type</th><th>Wallet</th><th>Amount</th><th>Fee</th><th>Status</th><th>Desc</th></tr>${html}</table></div></div>`;
}

 <h4>Banking Details (Bank Zero only)</h4>
 <p>Bank: Bank Zero (auto)<br>Branch: 888000 (auto)</p>
 <input id="pAcc" class="input" placeholder="Account Number" value="${currentUser.bank?.accNumber||''}">

}
function updateProfile(){
 let acc=document.getElementById('pAcc').value.trim(); let name=document.getElementById('pName').value.trim();

 document.getElementById('otpShow').innerText=genOtp;
 pendingAction={type:'bankUpdate', acc, name};
 document.getElementById('otpOverlay').style.display='flex';
}

function renderAdmin(){
 if(!isAdminMode){ document.getElementById('app').innerHTML='<div class="card">Access denied - Admin only via admin.html</div>'; return; }
 let sorted=[...users].sort((a,b)=>(b.invites||0)-(a.invites||0));
 let leaderHtml=sorted.map((u,i)=>`<tr><td>${i+1}</td><td>${u.myCode}</td><td>${u.fullname}</td><td>${u.cell}</td><td>${u.invites||0}</td><td>R${(u.wallets.inviter||0).toFixed(2)}</td><td>R${(u.wallets.main||0).toFixed(2)}</td><td>R${(u.wallets.loyal||0).toFixed(2)}</td></tr>`).join('') || '<tr><td colspan=8>No users</td></tr>';
 let pendingW=txs.filter(t=>t.type==='withdrawal' && t.status==='pending');
 let pendingHtml=pendingW.map(t=>`<tr><td>${new Date(t.date).toLocaleString()}</td><td>${t.cell}</td><td>${t.wallet}</td><td>R${Math.abs(t.amount)}</td><td>R${t.fee.toFixed(2)}</td><td>${t.acc}</td><td><button onclick="approveW(${txs.indexOf(t)})">Approve</button> <button onclick="rejectW(${txs.indexOf(t)})">Reject</button></td></tr>`).join('') || '<tr><td colspan=7>No pending</td></tr>';
 document.getElementById('app').innerHTML=`
 <div class="card"><h3>🔧 Admin - Full Control</h3><p>Inviter Leaderboard (Admin Only)</p><div style="overflow-x:auto"><table><tr><th>Rank</th><th>Code</th><th>Name</th><th>Cell</th><th>Invites</th><th>Inviter W</th><th>Main</th><th>Loyalty</th></tr>${leaderHtml}</table></div></div>
 <div class="card"><h3>Pending Withdrawals</h3><div style="overflow-x:auto"><table><tr><th>Date</th><th>Cell</th><th>Wallet</th><th>Amount</th><th>Fee</th><th>Acc</th><th>Action</th></tr>${pendingHtml}</table></div></div>
 <div class="card"><h3>Credit Loyalty / Add Bank (Admin Only)</h3>
 <input id="aCell" class="input" placeholder="User Cell"><input id="aLoyalAmt" class="input" type="number" placeholder="Loyalty Amount"><button class="btn" onclick="creditLoyal()">Credit Loyalty Wallet (No Fee)</button><hr>
 <input id="aBankCell" class="input" placeholder="User Cell"><input id="aBankName" class="input" placeholder="Other Bank Name"><input id="aBankAcc" class="input" placeholder="Account Number"><button class="btn btn-blue" onclick="addOtherBank()">Add Other Bank for User</button></div>
 <div class="card"><button class="btn btn-red" onclick="clearAll()">⚠️ Reset All Data</button></div>`;
}
function creditLoyal(){ let cell=document.getElementById('aCell').value.trim(); let amt=parseFloat(document.getElementById('aLoyalAmt').value); let u=users.find(x=>x.cell===cell); if(!u||!amt){ alert('Enter valid'); return; } u.wallets.loyal=(u.wallets.loyal||0)+amt; txs.push({cell, type:'bonus', wallet:'loyal', amount:amt, fee:0, desc:'Loyalty bonus from Admin', date:new Date().toISOString(), status:'completed'}); saveUsers(); localStorage.setItem('dms_txs',JSON.stringify(txs)); alert('Credited R'+amt+' loyalty to '+cell); renderAdmin(); }
function addOtherBank(){ let cell=document.getElementById('aBankCell').value.trim(); let bName=document.getElementById('aBankName').value.trim(); let bAcc=document.getElementById('aBankAcc').value.trim(); let u=users.find(x=>x.cell===cell); if(!u||!bName||!bAcc){ alert('Fill all'); return; } if(!u.bank.otherBanks) u.bank.otherBanks=[]; u.bank.bankName=bName; u.bank.accNumber=bAcc; u.bank.otherBanks.push(bName); saveUsers(); alert('Added '+bName+' for '+cell); renderAdmin(); }
function approveW(idx){ txs[idx].status='completed'; localStorage.setItem('dms_txs',JSON.stringify(txs)); alert('Approved!'); renderAdmin(); }
function rejectW(idx){ let t=txs[idx]; let u=users.find(x=>x.cell===t.cell); if(u){ u.wallets[t.wallet]+=Math.abs(t.amount); } txs[idx].status='rejected'; localStorage.setItem('dms_txs',JSON.stringify(txs)); saveUsers(); alert('Rejected & refunded'); renderAdmin(); }
function clearAll(){ if(confirm('Delete ALL users & txs?')){ localStorage.removeItem('dms_users'); localStorage.removeItem('dms_txs'); users=[]; txs=[]; alert('Cleared'); location.reload(); } }
init();
</script>
