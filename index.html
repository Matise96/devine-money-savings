function goWallets(){setActive("bW");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}checkLogout();var bankInfo="";if(!u.bank){bankInfo='<div style="padding:8px;border:1px dashed #d4af37;border-radius:8px;margin:8px 0;background:#111"><span class="small">No banking details saved yet. You will be asked once on first withdrawal.</span></div>';}else{bankInfo='<div style="padding:8px;border:1px solid '+(u.bank.approved?"lightgreen":"orange") +';border-radius:8px;margin:8px 0;background:#111"><b>Bank Saved:</b> '+(u.bank.bankName||"")+' - '+(u.bank.acc||"")+'<br><b>Holder:</b> '+(u.bank.holder||"")+'<br><b>Status:</b> '+(u.bank.approved?'<span style="color:lightgreen">APPROVED ✓</span>':'<span style="color:orange">PENDING APPROVAL</span>')+'<br><button class="btn2" style="margin-top:6px" onclick="goBankForm()">Edit Bank Details</button></div>';}var activeCount=u.pkgs.filter(p=>!p.done).length;var h='<div class="card"><h3 class="gold">Wallets</h3>'+bankInfo;h+='<button class="btn" onclick="goActivePackages()" style="background:#0f2a22;color:#2ee89e;border:1px solid #2ee89e;margin-bottom:12px">📦 View Active Packages ('+activeCount+' active) - 08:00 AM Daily</button>';h+='<div class="walletBox">Main: <b>R'+u.w.main.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div><div class="walletBox">Inviter: <b>R'+u.w.inviter.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div><div class="walletBox">Loyalty: <b>R'+u.w.loyalty.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div></div>';document.getElementById("app").innerHTML=h;}
function claimPkg(idx){var u=getUser();if(!u)return;var p=u.pkgs[idx];if(!p||p.done)return;var diffDays=Math.floor((new Date()-new Date(p.boughtAt))/(1000*60*60*24));if(diffDays<p.earliest){alert("Earliest in "+(p.earliest-diffDays));return;}var last=p.lastClaim?new Date(p.lastClaim):null;if(last&&(new Date()-last)<24*60*60*1000){alert("Tomorrow 08:00 AM");return;}var earned=p.daily;p.totalEarned+=earned;if(p.totalEarned>=p.price*2)p.done=true;p.lastClaim=new Date().toISOString();u.w.main+=earned;txs.push({cell:u.cell,type:"earn",amount:earned,fee:0,note:"Daily from "+p.id,date:new Date().toISOString(),status:"approved"});save();goActivePackages();}
function doWithdraw(){var u=getUser();if(!u){alert("Login");return;}var w=prompt("Choose wallet:\n1=Main R"+(u.w.main||0).toFixed(2)+"\n2=Inviter R"+(u.w.inviter||0).toFixed(2)+"\n3=Loyalty R"+(u.w.loyalty||0).toFixed(2));if(!w)return;var bal=0,wName="",wKey="";if(w=="1"){bal=u.w.main;wName="Main";wKey="main";}else if(w=="2"){bal=u.w.inviter;wName="Inviter";wKey="inviter";}else if(w=="3"){bal=u.w.loyalty;wName="Loyalty";wKey="loyalty";}else{alert("Invalid");return;}if(bal<70){alert("Min R70");return;}if(wKey==="main"){if(bal>=160){if(!u.pkgs||u.pkgs.length===0){alert("Purchase a package first to withdraw");return;}var totalSpent=0;for(var sp=0;sp<u.pkgs.length;sp++){totalSpent+=u.pkgs[sp].price||0;}var totalDeposited=bal+totalSpent;var needed=Math.floor(totalDeposited/160);if(u.pkgs.length<needed){var needMore=needed-u.pkgs.length;alert("Every R160 must buy a package. You deposited ~R"+totalDeposited.toFixed(0)+" which needs "+needed+" package(s). You have "+u.pkgs.length+". Buy "+needMore+" more package(s) first.");return;}var free=bal%160;if(free<70&&bal>=160){if(bal%160===0){alert("Main has R"+bal.toFixed(0)+". Every R160 must buy a package. Buy package first.");}else{alert("Main R"+bal.toFixed(0)+". Free only R"+free.toFixed(0)+" (<R70). Buy package.");}return;}}}if(!u.bank){alert("Upload banking - one time");return goBankForm();}if(!u.bank.approved){alert("Bank saved, pending approval - will not ask again");return;}var amtStr=prompt("Withdraw "+wName+" R"+bal.toFixed(2)+"\nBank: "+u.bank.bankName+" "+u.bank.acc+"\n"+(wKey==="main"&&bal>=160?"FREE max: R"+(bal%160).toFixed(2)+"\n":"")+"Amount:");if(!amtStr)return;var amt=parseFloat(amtStr);if(isNaN(amt)||amt<70||amt>bal){alert("Invalid");return;}if(wKey==="main"&&bal>=160){var free2=bal%160;if(amt>free2){alert("Cannot withdraw R"+amt+". Max free is R"+free2.toFixed(2)+".");return;}}var fee=amt*0.25;if(wKey=="main")u.w.main-=amt;if(wKey=="inviter")u.w.inviter-=amt;if(wKey=="loyalty")u.w.loyalty-=amt;txs.push({cell:u.cell,type:"withdraw",wallet:wKey,amount:amt,fee:fee,note:"Withdraw from "+wName+" to "+u.bank.bankName+" "+u.bank.acc,status:"pending",date:new Date().toISOString()});save();alert("Request R"+amt+" - 25% fee submitted");goWallets();}
function goBankForm(){var u=getUser();var holder=u&&u.bank?u.bank.holder:"";var acc=u&&u.bank?u.bank.acc:"";var h='<div class="card"><h3 class="gold">Upload Banking Details</h3><p class="small">Required before withdrawal. Admin will approve.</p><label class="small">Account Holder Name *</label><input id="bName" class="input" placeholder="Account Holder Name" value="'+holder+'"><label class="small">Bank Name</label><input id="bBank" class="input" value="Bank Zero" readonly disabled style="background:#1e1e1e;color:#d4af37;border-color:#d4af37;font-weight:800"><label class="small">Account Number *</label><input id="bAcc" class="input" placeholder="Account Number" value="'+acc+'"><label class="small">Branch Code</label><input id="bBranch" class="input" value="888000" readonly disabled style="background:#1e1e1e;color:#d4af37;border-color:#d4af37;font-weight:800"><button class="btn" onclick="saveBank()">Submit for Approval</button><br><br><button class="btn2" onclick="goWallets()">Back to Wallets</button></div>';document.getElementById("app").innerHTML=h;}
function saveBank(){var name=document.getElementById("bName").value.trim();var acc=document.getElementById("bAcc").value.trim();var bank="Bank Zero";var branch="888000";if(!name||!acc){alert("Fill Account Holder and Account Number");return;}var u=getUser();if(!u)return;var wasApproved=u.bank&&u.bank.approved;var wasBank=u.bank?u.bank.bankName:"";var wasAcc=u.bank?u.bank.acc:"";var isSame=wasBank===bank&&wasAcc===acc;if(isSame&&wasApproved){u.bank.holder=name;u.bank.bankName=bank;u.bank.acc=acc;u.bank.branch=branch;save();alert("Updated - still APPROVED");goWallets();return;}u.bank={holder:name,bankName:bank,acc:acc,branch:branch,approved:false,pending:true};save();alert("Bank saved! Awaiting approval - will not ask again");goWallets();}
function approveBank(cell){var u=users.find(function(x){return x.cell===cell});if(!u||!u.bank)return;u.bank.approved=true;u.bank.pending=false;save();alert("Bank Approved "+cell);goAdmin();}
function rejectBank(cell){if(!confirm("Reject "+cell+"?"))return;var u=users.find(function(x){return x.cell===cell});if(!u)return;u.bank=null;save();goAdmin();}
function goTeam(){setActive("bT");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var code=u.invite;var team=[];for(var i=0;i<users.length;i++){if(users[i].by===code||users[i].by===u.cell)team.push(users[i]);}var link=location.origin+location.pathname+"?invite="+code;var h='<div class="card"><h3 class="gold">My Team '+team.length+'</h3><p>Code <b>'+code+'</b></p><input class="input" value="'+link+'" readonly><button class="btn2" onclick="navigator.clipboard.writeText(\''+link+'\')">Copy Link</button><hr>';for(var k=0;k<team.length;k++){h+='<div>'+team[k].name+' '+team[k].cell+'</div>';}if(team.length===0)h+="No team";h+="<p>Inviter: R"+u.w.inviter.toFixed(2)+"</p></div>";document.getElementById("app").innerHTML=h;}
function goHistory(){setActive("bHI");if(!cur){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var list=[];if(cur.cell==="ADMIN"){list=txs;}else{var gu=getUser();if(!gu){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}for(var i=0;i<txs.length;i++){if(txs[i].cell===gu.cell)list.push(txs[i]);}}var h='<div class="card"><h3 class="gold">History</h3>';for(var i=list.length-1;i>=0;i--){var t=list[i];var typeDisplay=t.type;if(typeDisplay==="buy")typeDisplay="bought";var feeDisplay="";if(t.type==="withdraw"&&t.fee>0){feeDisplay=" - 25% fee";}var st=t.status;if(st==="done")st="approved";if(!st)st="approved";h+='<div style="border-bottom:1px solid #222;padding:6px 0"><b>'+typeDisplay+'</b> R'+t.amount+feeDisplay+'<br><span class="small">'+new Date(t.date).toLocaleString()+" "+(t.note||"")+" "+st+" ["+(t.wallet||"")+']</span></div>';}if(list.length===0)h+="No history";h+="</div>";document.getElementById("app").innerHTML=h;}
function setAdminSub(s){adminSub=s;goAdmin();}
function editUserWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;ensureWallets(u);var h='<div class="card" style="border:2px solid #d4af37"><h3 class="gold">Edit 3 Wallets - '+u.name+'<br><span class="small">'+u.cell+' - '+u.invite+'</span></h3><label>Main Wallet</label><input id="editMain" class="input" type="number" value="'+u.w.main.toFixed(2)+'"><label>Inviter Bonus</label><input id="editInv" class="input" type="number" value="'+u.w.inviter.toFixed(2)+'"><label>Loyalty Bonus</label><input id="editLoy" class="input" type="number" value="'+u.w.loyalty.toFixed(2)+'"><button class="btn" onclick="saveWallets(\''+u.cell+'\')">Save Wallets</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;}
function saveWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;u.w.main=parseFloat(document.getElementById("editMain").value)||0;u.w.inviter=parseFloat(document.getElementById("editInv").value)||0;u.w.loyalty=parseFloat(document.getElementById("editLoy").value)||0;save();if(tryGiveInviterBonus(u)){alert("Wallets Saved + Inviter bonus R10 triggered!");} else {alert("Wallets Saved");}goAdmin();}
function editUserDetails(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;var h='<div class="card" style="border:2px solid #d4af37"><h3 class="gold">Edit Personal Details - '+u.cell+'<br><span class="small">'+u.invite+'</span></h3><label>Name & Surname</label><input id="editName" class="input" value="'+(u.name||"")+'"><label>Email</label><input id="editEmail" class="input" value="'+(u.email||"")+'"><label>Gender</label><select id="editGender" class="input"><option value="Male" '+(u.gender==="Male"?"selected":"")+' >Male</option><option value="Female" '+(u.gender==="Female"?"selected":"")+' >Female</option></select><label>Province</label><select id="editProv" class="input"><option '+(u.prov==="Free State"?"selected":"")+' >Free State</option><option '+(u.prov==="Gauteng"?"selected":"")+' >Gauteng</option><option '+(u.prov==="KwaZulu-Natal"?"selected":"")+' >KwaZulu-Natal</option><option '+(u.prov==="Eastern Cape"?"selected":"")+' >Eastern Cape</option><option '+(u.prov==="Western Cape"?"selected":"")+' >Western Cape</option><option '+(u.prov==="Limpopo"?"selected":"")+' >Limpopo</option><option '+(u.prov==="Mpumalanga"?"selected":"")+' >Mpumalanga</option><option '+(u.prov==="North West"?"selected":"")+' >North West</option><option '+(u.prov==="Northern Cape"?"selected":"")+' >Northern Cape</option></select><button class="btn" onclick="saveUserDetails(\''+u.cell+'\')">Save Details</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;}
function saveUserDetails(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;u.name=document.getElementById("editName").value.trim();u.email=document.getElementById("editEmail").value.trim();u.gender=document.getElementById("editGender").value;u.prov=document.getElementById("editProv").value;save();alert("Details Updated");goAdmin();}
function editUserPackages(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;var h='<div class="card" style="border:2px solid #d4af37"><h3 class="gold">Edit Packages - '+u.name+'<br><span class="small">'+u.cell+' - '+u.pkgs.length+' pkgs</span></h3>';if(u.pkgs.length===0){h+='<p class="small">No packages bought</p>';}else{for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px;background:#1a1a1a"><b>'+p.id+'</b> - R'+p.price+' -> R'+p.daily+'/day<br><span class="small">Bought: '+new Date(p.boughtAt).toLocaleDateString()+' | Earned: R'+p.totalEarned+' | '+(p.done?"Completed":"Active")+'</span><br><button class="btnRed" onclick="removePackage(\''+cell+'\','+i+')">Remove Package</button> ';if(p.done){h+='<button class="btn2" onclick="reinstatePackage(\''+cell+'\','+i+')">Reinstate</button>';}else{h+='<button class="btn2" onclick="completePackage(\''+cell+'\','+i+')">Mark Completed</button>';}h+='</div>';}}h+='<hr><h4 class="gold">Add Package Manually</h4>';for(var j=0;j<PKGS.length;j++){h+='<button class="btn2" onclick="addPackage(\''+cell+'\','+j+')">+ '+PKGS[j].name+' R'+PKGS[j].price+'</button> ';}h+='<br><br><button class="btn2" onclick="goAdmin()">Back</button></div>';document.getElementById("app").innerHTML=h;}
function removePackage(cell,idx){if(!confirm("Remove this package?"))return;var u=users.find(function(x){return x.cell===cell});if(!u)return;u.pkgs.splice(idx,1);save();alert("Package removed");editUserPackages(cell);}
function reinstatePackage(cell,idx){var u=users.find(function(x){return x.cell===cell});if(!u||!u.pkgs[idx])return;u.pkgs[idx].done=false;save();alert("Reinstated");editUserPackages(cell);}
function completePackage(cell,idx){var u=users.find(function(x){return x.cell===cell});if(!u||!u.pkgs[idx])return;u.pkgs[idx].done=true;save();alert("Completed");editUserPackages(cell);}
function addPackage(cell,pkgIdx){
  var u=users.find(function(x){return x.cell===cell});if(!u)return;
  var pkg=PKGS[pkgIdx];
  u.pkgs.push({id:pkg.id,price:pkg.price,daily:pkg.daily,earliest:pkg.earliest,boughtAt:new Date().toISOString(),lastClaim:null,totalEarned:0,done:false});
  txs.push({cell:u.cell,type:"bought",amount:pkg.price,fee:0,note:"Admin added "+pkg.name,date:new Date().toISOString(),status:"approved",wallet:"admin"});
  save();
  if(tryGiveInviterBonus(u)){alert(pkg.name+" added + Inviter R10 bonus given!");} else {alert(pkg.name+" added");}
  editUserPackages(cell);
}
function deleteUser(cell){if(!confirm("Delete "+cell+"?"))return;users=users.filter(function(x){return x.cell!==cell});txs=txs.filter(function(t){return t.cell!==cell});save();goAdmin();}
function approveWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;t.status="approved";save();alert("Approved R"+t.amount);goAdmin();}
function rejectWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;if(!confirm("Reject and refund?"))return;var u=users.find(function(x){return x.cell===t.cell});if(u){ensureWallets(u);if(t.wallet==="main")u.w.main+=t.amount;else if(t.wallet==="inviter")u.w.inviter+=t.amount;else if(t.wallet==="loyalty")u.w.loyalty+=t.amount;else u.w.main+=t.amount;}t.status="rejected";save();goAdmin();}
function exportData(){var data={users:users,txs:txs,date:new Date().toISOString()};var blob=new Blob([JSON.stringify(data)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="DMS_backup_"+new Date().toISOString().slice(0,10)+".json";a.click();}
function importData(){var inp=document.getElementById("importFile");if(!inp||!inp.files[0]){alert("Choose file");return;}var reader=new FileReader();reader.onload=function(e){try{var data=JSON.parse(e.target.result);if(data.users&&data.txs){if(confirm("Import "+data.users.length+" users?")){users=data.users;txs=data.txs;save();alert("Imported!");goAdmin();}}else{alert("Invalid");}}catch(err){alert(err.message);}};reader.readAsText(inp.files[0]);}
function goAdmin(){setActive("bA");if(!cur||cur.cell!=="ADMIN"){document.getElementById("app").innerHTML='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cell" value="0510011039"><input id="aP" class="input" type="password" placeholder="Pass"><button class="btn" onclick="adminLogin()">Login</button></div>';return;}for(var i=0;i<users.length;i++){var exp="DMS"+String(i+1).padStart(3,"0");users[i].invite=exp;ensureWallets(users[i]);}var totalMain=0,totalInv=0,totalLoy=0,totalPaid=0;users.forEach(function(u){ensureWallets(u);totalMain+=u.w.main;totalInv+=u.w.inviter;totalLoy+=u.w.loyalty;});txs.forEach(function(t){if(t.type==="withdraw"&&(t.status==="approved"||t.status==="done"))totalPaid+=t.amount;});var pend=txs.filter(function(t){return t.status==="pending"});var h='<div class="card"><h2 class="gold">Admin Dashboard</h2><div class="statBox"><b>'+users.length+'</b><br><span class="small">Users</span></div><div class="statBox"><b>'+pend.length+'</b><br><span class="small">Pending</span></div><div class="statBox"><b>R'+totalMain.toFixed(0)+'</b><br><span class="small">Total Main</span></div><div class="statBox"><b>R'+totalInv.toFixed(0)+'</b><br><span class="small">Inviter</span></div><div class="statBox"><b>R'+totalLoy.toFixed(0)+'</b><br><span class="small">Loyalty</span></div><div class="statBox"><b>R'+totalPaid.toFixed(0)+'</b><br><span class="small">Paid Out</span></div><hr><div class="adminTab"><button onclick="setAdminSub(\'dashboard\')" class="'+(adminSub==="dashboard"?"active":"")+'">Dashboard</button><button onclick="setAdminSub(\'withdrawals\')" class="'+(adminSub==="withdrawals"?"active":"")+'">Withdrawals ('+pend.length+')</button><button onclick="setAdminSub(\'users\')" class="'+(adminSub==="users"?"active":"")+'">Users ('+users.length+')</button><button onclick="setAdminSub(\'settings\')" class="'+(adminSub==="settings"?"active":"")+'">Settings</button></div><hr>';if(adminSub==="dashboard"||adminSub==="withdrawals"){h+='<h3 class="gold">Pending Withdrawals</h3>';if(pend.length===0)h+="<p>No pending</p>";for(var i=0;i<pend.length;i++){var t=pend[i];var idx=txs.indexOf(t);h+='<div style="border:1px solid #d4af37;padding:10px;margin:8px 0;border-radius:10px;background:#1a1a1a"><b>'+t.cell+'</b><br>R'+t.amount+' - 25% fee Receive R'+(t.amount-t.fee).toFixed(2)+'<br><button class="btn2" onclick="approveWithdraw('+idx+')">Approve</button><button class="btnRed" onclick="rejectWithdraw('+idx+')">Reject</button></div>';}}if(adminSub==="users"){h+='<h3 class="gold">Users</h3><input id="searchUser" class="input" placeholder="Search Email Cell" oninput="filterUsers(this.value)"><div id="userList">';for(var j=0;j<users.length;j++){var uu=users[j];ensureWallets(uu);h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px" class="userItem" data-search="'+uu.cell+' '+uu.invite+' '+uu.name.toLowerCase()+' '+(uu.email||"").toLowerCase()+'"><b>'+uu.name+'</b><br>'+uu.cell+' - <b class="gold">'+uu.invite+'</b><br><span style="color:#d4af37">Email: '+(uu.email||"N/A")+'</span><br>Gender: '+(uu.gender||"N/A")+' | '+uu.prov+'<br>Main R'+uu.w.main.toFixed(2)+' | Inviter R'+uu.w.inviter.toFixed(2)+' | Loyalty R'+uu.w.loyalty.toFixed(2)+' | '+uu.pkgs.length+' pkgs<br>By: '+(uu.by||"None")+' | BonusGiven: '+(uu.inviterBonusGiven?"YES":"NO")+'<br>';if(uu.bank){h+='<div style="margin-top:8px;padding:8px;border:1px solid gold;border-radius:8px;background:#1a1a1a"><b>Bank:</b> '+(uu.bank.bankName||"")+'<br><b>Holder:</b> '+(uu.bank.holder||"")+'<br><b>Acc:</b> '+(uu.bank.acc||"")+'<br><b>Branch:</b> '+(uu.bank.branch||"")+'<br><b>Status:</b> '+(uu.bank.approved?'<span style="color:lightgreen">APPROVED ✓</span>':'<span style="color:orange">PENDING</span>')+'<br><button class="btn2" onclick="approveBank(\''+uu.cell+'\')" style="background:green;color:#fff">Approve Banking</button> <button class="btnRed" onclick="rejectBank(\''+uu.cell+'\')">Reject</button></div>';}else{h+='<div class="small" style="margin-top:6px">No banking yet</div>';}h+='<br><button class="btn2" onclick="editUserDetails(\''+uu.cell+'\')" style="background:#4da6ff">Edit Details</button><button class="btn2" onclick="editUserWallets(\''+uu.cell+'\')">Edit 3 Wallets</button><button class="btn2" onclick="editUserPackages(\''+uu.cell+'\')" style="background:#d4af37">Edit Packages ('+uu.pkgs.length+')</button><br><br><button class="btnRed" onclick="deleteUser(\''+uu.cell+'\')">Delete User</button></div>';}h+='</div>';}if(adminSub==="settings"){h+='<h3 class="gold">Settings - Backup</h3><div style="border:2px solid #d4af37;padding:10px;border-radius:10px"><button class="btn" onclick="exportData()" style="background:#90ee90">Export Backup</button><br><br><input type="file" id="importFile" class="input" accept=".json"><button class="btn2" onclick="importData()">Import Backup</button></div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function filterUsers(q){q=q.toLowerCase();document.querySelectorAll(".userItem").forEach(function(el){var s=el.getAttribute("data-search");el.style.display=s.includes(q)?"block":"none";});}
try{goHome();}catch(e){document.getElementById("app").innerHTML='<div class="card">Error: '+e.message+'<br><button class="btn" onclick="localStorage.clear();location.reload()">Clear & Reload</button></div>';}
</script></body></html>
