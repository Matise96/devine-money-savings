<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS Final</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#1a1a1a;color:#fff;padding:10px}nav{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}nav button{padding:8px 12px;background:#d4af37;color:#000;border:none;cursor:pointer;font-weight:bold;border-radius:4px}nav button.active{background:#ffed4e}nav button:hover{background:#ffed4e}.card{background:#222;border:1px solid #555;border-radius:8px;padding:20px;margin:10px 0}h3{color:#d4af37;margin-top:0}.badge{background:#d4af37;color:#000;padding:4px 8px;border-radius:4px;font-weight:bold;font-size:12px;display:inline-block}.small{font-size:12px;color:#aaa}.input{width:100%;padding:10px;margin:8px 0;background:#333;border:1px solid #555;color:#fff;border-radius:4px}.btn{width:100%;padding:12px;background:#d4af37;color:#000;border:none;cursor:pointer;font-weight:bold;border-radius:4px;margin:8px 0}.btn:hover{background:#ffed4e}.btn2{width:100%;padding:12px;background:#555;color:#fff;border:none;cursor:pointer;font-weight:bold;border-radius:4px;margin:8px 0}.btn2:hover{background:#777}label{display:block;margin-top:12px;font-weight:bold;color:#d4af37}.pkg{background:#333;padding:15px;margin:10px 0;border-left:3px solid #d4af37;border-radius:4px}.tx{background:#333;padding:12px;margin:8px 0;border-left:3px solid #d4af37;border-radius:4px}.user-list{list-style:none;padding:0}.userItem{background:#333;padding:12px;margin:8px 0;border-radius:4px;cursor:pointer}.userItem:hover{background:#444}p{margin:8px 0}b{color:#d4af37}#logoutBtn{display:none;background:#d4af37;color:#000;padding:8px 12px;border:none;cursor:pointer;font-weight:bold;border-radius:4px}#logoutBtn:hover{background:#ffed4e}</style><script>
var PKGS=[{id:"A",name:"PACKAGE A",price:160,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"B",name:"PACKAGE B",price:250,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"C",name:"PACKAGE C",price:400,daily:15,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"D",name:"PACKAGE D",price:600,daily:20,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."}];
var users=JSON.parse(localStorage.getItem("dms_users")||"[]");var txs=JSON.parse(localStorage.getItem("dms_txs")||"[]");var cur=JSON.parse(localStorage.getItem("dms_cur")||"null");var adminSub="users";
function save(){localStorage.setItem("dms_users",JSON.stringify(users));localStorage.setItem("dms_txs",JSON.stringify(txs));localStorage.setItem("dms_cur",JSON.stringify(cur));}
function ensureWallets(u){if(!u.w)u.w={main:0,inviter:0,loyalty:0};if(u.w.bonus!==undefined&&u.w.inviter===undefined){u.w.inviter=u.w.bonus;delete u.w.bonus;}if(u.w.main===undefined)u.w.main=0;if(u.w.inviter===undefined)u.w.inviter=0;if(u.w.loyalty===undefined)u.w.loyalty=0;}
function setActive(id){document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});var e=document.getElementById(id);if(e)e.classList.add("active");}
function getUser(){if(!cur||cur.cell==="ADMIN")return null;for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell){ensureWallets(users[i]);return users[i];}}return null;}
function logout(){cur=null;localStorage.removeItem("dms_cur");document.getElementById("logoutBtn").style.display="none";goHome();}
function checkLogout(){document.getElementById("logoutBtn").style.display=cur?"block":"none";}
function goHome(){setActive("bH");checkLogout();var u=getUser();if(!u&&(!cur||cur.cell!=="ADMIN")){var html='<div class="card" style="text-align:center;border:2px solid #d4af37"><div class="badge" style="padding:10px;margin:10px">DMS</div><h3>Welcome to Devine Money Savings</h3><p style="font-size:16px">Login or Register to get started</p><button class="btn" onclick="goLogin()">Login</button><button class="btn" onclick="goRegister()">Register</button></div>';document.getElementById("app").innerHTML=html;}else if(u){var m=u.w.main||0,inv=u.w.inviter||0,loy=u.w.loyalty||0,ttl=m+inv+loy;var html='<div class="card"><h3 class="gold">Welcome '+u.name+'</h3><p>Cell: '+u.cell+'</p><p>Main Wallet: <b>R'+m.toFixed(2)+'</b><br>Inviter Bonus: <b>R'+inv.toFixed(2)+'</b><br>Loyalty Bonus: <b>R'+loy.toFixed(2)+'</b></p><p style="font-size:18px">Total: <b>R'+ttl.toFixed(2)+'</b></p><button class="btn" onclick="goPackages()">View Packages</button></div>';document.getElementById("app").innerHTML=html;}}
function goLogin(){setActive("bL");checkLogout();var html='<div class="card"><h3 class="gold">Login</h3><input id="lC" class="input" placeholder="Cellphone"><input id="lP" class="input" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button></div>';document.getElementById("app").innerHTML=html;}
function goRegister(){var inv=new URLSearchParams(location.search).get("invite")||"";var h='<div class="card"><h3 class="gold">Register</h3><input id="rN" class="input" placeholder="Full Name *"><input id="rC" class="input" placeholder="Cellphone *"><input id="rE" class="input" placeholder="Email"><input id="rPr" class="input" type="password" placeholder="Password *"><input id="rPr2" class="input" type="password" placeholder="Confirm Password *"><input id="rInv" class="input" placeholder="Invite Code" value="'+inv+'"><button class="btn" onclick="doRegister()">Register</button></div>';document.getElementById("app").innerHTML=h;}
function doRegister(){var n=document.getElementById("rN").value.trim(),c=document.getElementById("rC").value.trim(),e=document.getElementById("rE").value.trim(),pr=document.getElementById("rPr").value,pr2=document.getElementById("rPr2").value,inv=document.getElementById("rInv").value.trim();if(!n||!c||!pr){alert("Name, Cell, Password required");return;}if(pr!==pr2){alert("Passwords don't match");return;}if(users.find(function(x){return x.cell===c})){alert("Cell already registered");return;}var newInviteCode=Math.random().toString(36).substr(2,9).toUpperCase();var nu={cell:c,name:n,email:e,password:pr,invite:newInviteCode,w:{main:0,inviter:0,loyalty:0},pkgs:[],createdAt:Date.now()};if(inv){var inviter=users.find(function(x){return x.invite===inv});if(inviter){inviter.w.inviter=(inviter.w.inviter||0)+10;}}users.push(nu);save();alert("Registered! Your invite code: "+newInviteCode);goLogin();}
function doLogin(){var c=document.getElementById("lC").value.trim(),p=document.getElementById("lP").value.trim();if(c==="0510011039"&&p==="admin123"){cur={cell:"ADMIN"};save();goAdmin();return;}for(var i=0;i<users.length;i++){if(users[i].cell===c&&users[i].password===p){cur={cell:c};save();goHome();return;}}alert("Invalid login");}
function adminLogin(){var c=document.getElementById("aC").value.trim(),p=document.getElementById("aP").value.trim();if(c==="0510011039"&&p==="admin123"){cur={cell:"ADMIN"};save();goAdmin();}else{alert("Invalid admin credentials");}}
function goPackages(){setActive("bP");checkLogout();var h='<div class="card"><h3 class="gold">Packages</h3>';for(var i=0;i<PKGS.length;i++){var pk=PKGS[i];h+='<div class="pkg"><span class="badge">'+pk.id+'</span> <b>'+pk.name+'</b><br>Price: R'+pk.price+'<br>Daily: R'+pk.daily+'<br>Min R70 | 3 Wallets<br><p style="font-size:12px;color:#aaa">'+pk.desc+'</p><button class="btn" onclick="buyPkg('+i+')">Buy Now</button></div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function buyPkg(i){
var u=getUser();
if(!u){alert("Please login");return;}
var p=PKGS[i];
ensureWallets(u);
var main=u.w.m!=null?u.w.m:(u.w.main||0);
var inv=u.w.i!=null?u.w.i:(u.w.inviter!=null?u.w.inviter:(u.w.inv||0));
var loy=u.w.l!=null?u.w.l:(u.w.loyalty!=null?u.w.loyalty:(u.w.loy||0));
var total=Number(main)+Number(inv)+Number(loy);
if(total<p.price){alert("Insufficient funds, deposit to purchase.");return;}
var need=p.price;
if(main>=need){if(u.w.m!=null)u.w.m-=need;else u.w.main-=need;need=0;}
else{need-=main;if(u.w.m!=null)u.w.m=0;else u.w.main=0;
if(inv>=need){if(u.w.i!=null)u.w.i-=need;else if(u.w.inviter!=null)u.w.inviter-=need;else u.w.inv-=need;need=0;}
else{need-=inv;if(u.w.i!=null)u.w.i=0;else if(u.w.inviter!=null)u.w.inviter=0;else u.w.inv=0;
if(u.w.l!=null)u.w.l-=need;else if(u.w.loyalty!=null)u.w.loyalty-=need;else u.w.loy-=need;}}
if(!u.pkgs)u.pkgs=[];u.pkgs.push({id:p.id,name:p.name,price:p.price,daily:p.daily,boughtAt:Date.now(),done:false});
save();
alert("Bought "+p.name+"!");
goWallets();
}
function goWallets(){setActive("bW");checkLogout();var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login first</div>";return;}var now=Date.now(),canClaim=0,details='<h3 class="gold">My Wallets & Daily Cashback</h3>';details+='<p><b>Main Wallet:</b> R'+(u.w.main||0).toFixed(2)+'</p>';details+='<p><b>Inviter Bonus:</b> R'+(u.w.inviter||0).toFixed(2)+'</p>';details+='<p><b>Loyalty Bonus:</b> R'+(u.w.loyalty||0).toFixed(2)+'</p>';var ttl=(u.w.main||0)+(u.w.inviter||0)+(u.w.loyalty||0);details+='<p style="font-size:16px"><b>Total: R'+ttl.toFixed(2)+'</b></p><hr>';if(u.pkgs&&u.pkgs.length>0){details+='<h4 style="color:#d4af37">Active Packages:</h4>';for(var i=0;i<u.pkgs.length;i++){var pkg=u.pkgs[i];if(pkg.done)continue;var d=Math.floor((now-pkg.boughtAt)/86400000);var claimsLeft=pkg.earliest-d;var earned=d*pkg.daily;details+='<div style="background:#333;padding:10px;margin:5px 0;border-left:3px solid #d4af37"><b>'+pkg.name+'</b> (ID: '+pkg.id+') - Bought '+(d+1)+' days ago<br>Earned: R'+earned.toFixed(2);if(claimsLeft>0){details+=' | Claim in '+claimsLeft+' days';}else{details+=' | Ready to claim';canClaim+=earned;}details+='</div>';}}details+='<button class="btn" onclick="claimDaily()">Claim Daily Cashback (R'+canClaim.toFixed(2)+')</button>';}details+='<button class="btn" onclick="doWithdraw()">Withdraw</button>';document.getElementById("app").innerHTML='<div class="card">'+details+'</div>';}
function claimDaily(){var u=getUser();var now=Date.now(),earned=0,claims=0;for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];if(p.done)continue;var d=Math.floor((now-p.boughtAt)/86400000);var cl=Math.max(0,d-p.earliest+1);if(cl>0){earned+=cl*p.daily;claims+=cl;p.done=true;}}if(earned>0){u.w.main=(u.w.main||0)+earned;save();alert("Claimed R"+earned.toFixed(2)+" from "+claims+" package(s)!");goWallets();}else{alert("No packages ready to claim yet");}}
function doWithdraw(){var u=getUser();if(!u)return;var total=u.w.main+u.w.inviter+u.w.loyalty;if(total<70){alert("Min R70 needed. Have R"+total.toFixed(2));return;}var now=Date.now();if(u.pkgs.length>0&&!u.pkgs.every(function(p){return p.done})){alert("All packages must be completed before withdrawal");return;}var amt=prompt("Withdraw amount (Max R"+total.toFixed(2)+", Min R70):");if(!amt)return;amt=parseFloat(amt);if(isNaN(amt)||amt<70||amt>total){alert("Invalid amount");return;}var fee=amt*0.25;u.w.main-=amt;txs.push({cell:u.cell,name:u.name,amount:amt,fee:fee,receive:amt-fee,status:"pending",date:new Date().toLocaleString()});save();alert("Withdrawal requested. You will receive R"+(amt-fee).toFixed(2));goWallets();}
function goTeam(){setActive("bT");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var code=u.invite;var team=[];for(var i=0;i<users.length;i++){if(users[i].cell!==u.cell)continue;}var html='<div class="card"><h3 class="gold">My Team</h3><p>Your Invite Code: <b>'+code+'</b> (Share this with your team!)</p>';if(team.length>0){html+='<h4>Team Members:</h4>';for(var i=0;i<team.length;i++){html+='<p>'+team[i].name+' ('+team[i].cell+')</p>';}}html+='</div>';document.getElementById("app").innerHTML=html;}
function goHistory(){setActive("bHI");if(!cur){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var list=[];if(cur.cell==="ADMIN"){list=txs;}else{var gu=getUser();if(gu){list=txs.filter(function(t){return t.cell===gu.cell});}}var html='<div class="card"><h3 class="gold">Transaction History</h3>';if(list.length===0){html+='<p>No transactions</p>';}else{for(var i=0;i<list.length;i++){var t=list[i];html+='<div class="tx"><b>'+t.name+' ('+t.cell+')</b><br>Amount: R'+t.amount.toFixed(2)+' | Fee: R'+t.fee.toFixed(2)+' | Receive: R'+t.receive.toFixed(2)+'<br>Status: <span style="color:'+(t.status==="done"?"#0f0":"#f90")+'">'+t.status.toUpperCase()+'</span><br>Date: '+t.date+'</div>';}}html+='</div>';document.getElementById("app").innerHTML=html;}
function setAdminSub(s){adminSub=s;goAdmin();}
function editUserWallets(cell){
 var u=users.find(function(x){return x.cell===cell});
 if(!u)return;
 ensureWallets(u);
 var h='<div class="card" style="border:2px solid #d4af37"><h3 class="gold">Edit 3 Wallets - '+u.name+'<br><span class="small">'+u.cell+' - '+u.invite+'</span></h3>';
 h+='<label>Main Wallet (Daily cashback)</label><input id="editMain" class="input" type="number" value="'+u.w.main.toFixed(2)+'">';
 h+='<label>Inviter Bonus Wallet (R10 per invite)</label><input id="editInv" class="input" type="number" value="'+u.w.inviter.toFixed(2)+'">';
 h+='<label>Loyalty Bonus Wallet</label><input id="editLoy" class="input" type="number" value="'+u.w.loyalty.toFixed(2)+'">';
 h+='<p>Total will be: <b id="editTotal">R'+(u.w.main+u.w.inviter+u.w.loyalty).toFixed(2)+'</b></p>';
 h+='<button class="btn" onclick="saveWallets(\''+u.cell+'\')">Save All 3 Wallets</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button>';
 h+='</div>';
 document.getElementById("app").innerHTML=h;
 var upd=function(){var m=parseFloat(document.getElementById("editMain").value)||0;var iv=parseFloat(document.getElementById("editInv").value)||0;var l=parseFloat(document.getElementById("editLoy").value)||0;document.getElementById("editTotal").innerText="R"+(m+iv+l).toFixed(2);};
 document.getElementById("editMain").addEventListener("input",upd);
 document.getElementById("editInv").addEventListener("input",upd);
 document.getElementById("editLoy").addEventListener("input",upd);
}
function saveWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;var m=parseFloat(document.getElementById("editMain").value)||0;var iv=parseFloat(document.getElementById("editInv").value)||0;var l=parseFloat(document.getElementById("editLoy").value)||0;u.w.main=m;u.w.inviter=iv;u.w.loyalty=l;save();alert("Saved! Main R"+m+" | Inviter R"+iv+" | Loyalty R"+l);goAdmin();}
function deleteUser(cell){if(!confirm("Delete user "+cell+"?"))return;if(!confirm("FINAL CONFIRM DELETE "+cell+"?"))return;users=users.filter(function(x){return x.cell!==cell});txs=txs.filter(function(t){return t.cell!==cell});save();goAdmin();}
function approveWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;t.status="done";save();alert("Approved R"+t.amount+" for "+t.cell+" Receive R"+(t.amount-t.fee).toFixed(2));goAdmin();}
function rejectWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;if(!confirm("Reject and refund R"+t.amount+" to "+t.cell+"?"))return;var u=users.find(function(x){return x.cell===t.cell});if(u){ensureWallets(u);u.w.main+=t.amount;}t.status="rejected";save();goAdmin();}
function goAdmin(){setActive("bA");if(!cur||cur.cell!=="ADMIN"){document.getElementById("app").innerHTML='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cellphone"><input id="aP" class="input" type="password" placeholder="Password"><button class="btn" onclick="adminLogin()">Admin Login</button></div>';return;}var sub=adminSub;var html='<div class="card"><h3 class="gold">Admin Dashboard</h3><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn2" onclick="setAdminSub(\'users\')">Users</button><button class="btn2" onclick="setAdminSub(\'txs\')">Withdrawals</button></div><hr>';if(sub==="users"){html+='<h4>All Users</h4><input id="searchInput" class="input" placeholder="Search users..." onkeyup="filterUsers(this.value)"><ul class="user-list" id="userList">';for(var i=0;i<users.length;i++){var usr=users[i];html+='<li class="userItem" data-search="'+usr.name.toLowerCase()+' '+usr.cell.toLowerCase()+'"><b>'+usr.name+'</b> ('+usr.cell+') - Invite: '+usr.invite+'<br><button class="btn2" onclick="editUserWallets(\''+usr.cell+'\')">Edit Wallets</button> <button class="btn2" onclick="deleteUser(\''+usr.cell+'\')">Delete</button></li>';}html+='</ul>';}else if(sub==="txs"){html+='<h4>Pending Withdrawals</h4>';for(var i=0;i<txs.length;i++){if(txs[i].status==="pending"){html+='<div style="background:#333;padding:10px;margin:5px 0"><b>'+txs[i].name+' ('+txs[i].cell+')</b><br>Amount: R'+txs[i].amount.toFixed(2)+' | Fee: R'+txs[i].fee.toFixed(2)+' | Receive: R'+txs[i].receive.toFixed(2)+'<br><button class="btn" onclick="approveWithdraw('+i+')">Approve</button> <button class="btn2" onclick="rejectWithdraw('+i+')">Reject</button></div>';}}}html+='</div>';document.getElementById("app").innerHTML=html;}
function filterUsers(q){q=q.toLowerCase();document.querySelectorAll(".userItem").forEach(function(el){var s=el.getAttribute("data-search");el.style.display=s.includes(q)?"block":"none";});}
</script></head><body>
<button id="logoutBtn" onclick="logout()">Logout</button>
<nav>
<button id="bH" onclick="goHome()">Home</button>
<button id="bL" onclick="goLogin()">Login</button>
<button id="bP" onclick="goPackages()">Packages</button>
<button id="bW" onclick="goWallets()">Wallets</button>
<button id="bT" onclick="goTeam()">Team</button>
<button id="bHI" onclick="goHistory()">History</button>
<button id="bA" onclick="goAdmin()">Admin</button>
</nav>
<div id="app"></div>
<script>goHome();</script>
</body></html>
