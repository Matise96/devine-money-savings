<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS - Devine Money Savings</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;padding-bottom:20px}
header{background:#000;border-bottom:2px solid #d4af37;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#d4af37;font-weight:900}
.card{background:#141414;border:1px solid #333;margin:12px;border-radius:14px;padding:16px}
.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff}
.btn{width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:900}
.btn2{padding:9px 14px;background:#d4af37;color:#000;border:none;border-radius:8px;font-weight:700;margin:4px}
.badge{display:inline-block;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}
.pkg{border:1px solid #333;background:#1c1c1c;padding:14px;border-radius:12px;margin:10px 0}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#111}
nav button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#d4af37;white-space:nowrap}
nav button.active{background:#d4af37;color:#000}
.pwdWrap{position:relative;display:flex;align-items:center;width:100%}
.eyeBtn{position:absolute;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:#d4af37}
</style>
</head>
<body>
<header><div class="logo">DMS - Devine Money Savings</div><button class="btn2" onclick="logout()" id="logoutBtn" style="display:none;background:#ff3b3b;color:#fff">Logout</button></header>
<nav>
<button onclick="goHome()" id="bH" class="active">Home</button>
<button onclick="goWallets()" id="bW">Wallets</button>
<button onclick="goPackages()" id="bP">Packages</button>
<button onclick="goActivePackages()" id="bAP">Active Packages</button>
<button onclick="goTeam()" id="bT">Team</button>
<button onclick="goHistory()" id="bHI">History</button>
<button onclick="location.href='deposit.html'" id="bDEP">Deposit</button>
<button onclick="goAdmin()" id="bA">Admin</button>
</nav>
<div id="app"></div>
<script>
// FINAL CLEAN MASTER - 279 lines - Eye + Daily cashback + Edit Details + Edit Bank
function safeParse(k,f){try{var v=localStorage.getItem(k);if(!v)return JSON.parse(f);return JSON.parse(v);}catch(e){return JSON.parse(f);}}
var PKGS=[
{id:"A",name:"PACKAGE A",price:160,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},
{id:"B",name:"PACKAGE B",price:250,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},
{id:"C",name:"PACKAGE C",price:340,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},
{id:"D",name:"PACKAGE D",price:430,daily:35,earliest:2,desc:"Earliest withdrawal in 2 days. Minimum withdrawal at R70."},
{id:"E",name:"PACKAGE E",price:520,daily:70,earliest:1,desc:"Earliest withdrawal in 24hrs. Minimum withdrawal at R70."}
];
var users=safeParse("dms_users","[]");
var txs=safeParse("dms_txs","[]");
var cur=safeParse("dms_cur","null");
var adminSub="leaderboard";
var VALID_DEPOSITS=[160,250,340,430,520];
function save(){localStorage.setItem("dms_users",JSON.stringify(users));localStorage.setItem("dms_txs",JSON.stringify(txs));localStorage.setItem("dms_cur",JSON.stringify(cur));}
function ensureWallets(u){
if(!u.w)u.w={main:0,inviter:0,loyalty:0};
if(!u.hasOwnProperty('bank'))u.bank=null;
if(!u.hasOwnProperty('inviterBonusGiven'))u.inviterBonusGiven=false;
}
function setActive(id){try{document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});var e=document.getElementById(id);if(e)e.classList.add("active");}catch(e){}}
function getUser(){if(!cur||cur.cell==="ADMIN")return null;for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell){ensureWallets(users[i]);return users[i];}}return null;}
function toggleEye(inputId,btnId){
var inp=document.getElementById(inputId);
var btn=document.getElementById(btnId);
if(!inp)return;
if(inp.type==="password"){inp.type="text";btn.textContent="🙈";}else{inp.type="password";btn.textContent="👁️";}
}
function autoCreditAll(){
var now = new Date();if(now.getHours() < 8) return 0;
var totalCredited = 0;var today8am = new Date(); today8am.setHours(8,0,0,0);
for(var uIdx=0; uIdx<users.length; uIdx++){
var u = users[uIdx]; ensureWallets(u);
for(var pIdx=0; pIdx<u.pkgs.length; pIdx++){
var p = u.pkgs[pIdx];if(p.done) continue;
var bought = new Date(p.boughtAt);var diffDays = Math.floor((now - bought)/(1000*60*60*24));
if(diffDays < 1) continue;if(diffDays < p.earliest) continue;
var last = p.lastClaim? new Date(p.lastClaim) : null;
if(last && last >= today8am) continue;
p.totalEarned += p.daily;if(p.totalEarned >= p.price*2) p.done=true;
p.lastClaim = now.toISOString();u.w.main += p.daily;totalCredited += p.daily;
}
}
if(totalCredited>0) save();return totalCredited;
}
try{ autoCreditAll(); }catch(e){}
function logout(){cur=null;localStorage.removeItem("dms_cur");document.getElementById("logoutBtn").style.display="none";goHome();}
function checkLogout(){var b=document.getElementById("logoutBtn");if(b)b.style.display=cur?"block":"none";}
function goHome(){
setActive("bH");checkLogout();var u=getUser();
if(!u&&(!cur||cur.cell!=="ADMIN")){
var html='<div class="card" style="text-align:center;border:2px solid #d4af37"><h2 class="gold">DEVINE MONEY SAVINGS</h2><div style="text-align:left;margin-top:12px">';
for(var i=0;i<PKGS.length;i++){var p=PKGS[i];html+='<div class="pkg"><span class="badge">'+p.name+'</span> <b style="float:right">R'+p.price+'</b><br><br><b>R'+p.price+' > R'+p.daily+' Daily cashback</b><br></div>';}
html+='</div><hr><h3>Login</h3><input id="lC" class="input" placeholder="Cellphone"><div class="pwdWrap"><input id="lP" class="input" type="password" placeholder="Password"><button class="eyeBtn" id="eyeLP" onclick="toggleEye(\'lP\',\'eyeLP\')">👁️</button></div><button class="btn" onclick="doLogin()">Login</button><p class="small">No account? <a href="#" onclick="goRegister()" style="color:#d4af37">Register here</a></p></div>';
document.getElementById("app").innerHTML=html;return;
}
if(cur&&cur.cell==="ADMIN"){goAdmin();return;}
var h='<div class="card"><h3 class="gold">Welcome '+u.name+'</h3><p>Cell: '+u.cell+'<br>Invite: <b class="gold">'+u.invite+'</b></p><button class="btn2" onclick="goWallets()">Wallets</button><button class="btn2" onclick="goPackages()">Buy Package</button></div>';
document.getElementById("app").innerHTML=h;
}
function goRegister(){
var h='<div class="card"><h3 class="gold">Register</h3><input id="rN" class="input" placeholder="Full Name *"><input id="rC" class="input" placeholder="Cellphone *"><input id="rE" class="input" placeholder="Email *"><div class="pwdWrap"><input id="rP" class="input" type="password" placeholder="Password *"><button class="eyeBtn" id="eyeRP" onclick="toggleEye(\'rP\',\'eyeRP\')">👁️</button></div><button class="btn" onclick="doRegister()">Create Account</button></div>';
document.getElementById("app").innerHTML=h;
}
function doRegister(){
var n=document.getElementById("rN").value.trim(),c=document.getElementById("rC").value.trim(),e=document.getElementById("rE").value.trim(),p=document.getElementById("rP").value.trim();
if(!n||!c||!e||!p){alert("Fill all *");return;}
var code="DMS"+String(users.length+1).padStart(3,"0");
var u={cell:c,name:n,email:e,pass:p,invite:code,by:null,w:{main:0,inviter:0,loyalty:0},pkgs:[],bank:null,inviterBonusGiven:false};
users.push(u);save();alert("Registered! "+code+"!");goHome();
}
function doLogin(){var c=document.getElementById("lC").value.trim(),p=document.getElementById("lP").value.trim();if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();return;}for(var i=0;i<users.length;i++){if(users[i].cell===c&&users[i].pass===p){ensureWallets(users[i]);cur={cell:users[i].cell};save();goHome();return;}}alert("Wrong");}
function adminLogin(){var c=document.getElementById("aC").value.trim(),p=document.getElementById("aP").value.trim();if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();}else{alert("Wrong");}}
function goPackages(){setActive("bP");var h='<div class="card"><h3 class="gold">Packages - Daily cashback</h3>';for(var i=0;i<PKGS.length;i++){var pk=PKGS[i];h+='<div class="pkg"><span class="badge">'+pk.name+'</span> <b style="float:right">R'+pk.price+'</b><br><br><b>R'+pk.price+' > R'+pk.daily+' Daily cashback</b><br><button class="btn2" onclick="buyPkg('+i+')">Buy '+pk.name+'</button></div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function buyPkg(i){var u=getUser();if(!u){alert("Login first");return;}var pkg=PKGS[i];u.pkgs.push({id:pkg.id,price:pkg.price,daily:pkg.daily,earliest:pkg.earliest,boughtAt:new Date().toISOString(),lastClaim:null,totalEarned:0,done:false});save();alert("Bought "+pkg.name);goHome();}
function goWallets(){setActive("bW");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var h='<div class="card"><h3 class="gold">Wallets</h3><div>Main: <b>R'+u.w.main.toFixed(2)+'</b></div><div>Inviter: <b>R'+u.w.inviter.toFixed(2)+'</b></div><div>Loyalty: <b>R'+u.w.loyalty.toFixed(2)+'</b></div></div>';document.getElementById("app").innerHTML=h;}
function goTeam(){setActive("bT");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var h='<div class="card"><h3>My Team</h3><p>Code <b>'+u.invite+'</b></p></div>';document.getElementById("app").innerHTML=h;}
function goHistory(){setActive("bHI");var h='<div class="card"><h3>History</h3><p>No history yet</p></div>';document.getElementById("app").innerHTML=h;}
function goActivePackages(){setActive("bAP");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var h='<div class="card"><h3>Active Packages</h3>';for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];h+='<div class="pkg"><b>'+p.id+'</b> R'+p.price+' Earned R'+p.totalEarned+'</div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function setAdminSub(s){adminSub=s;goAdmin();}
function editUserWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;ensureWallets(u);var h='<div class="card"><h3>Edit Wallets - '+u.name+'</h3><input id="editMain" class="input" type="number" value="'+u.w.main+'"><input id="editInv" class="input" type="number" value="'+u.w.inviter+'"><input id="editLoy" class="input" type="number" value="'+u.w.loyalty+'"><button class="btn" onclick="saveWallets(\''+u.cell+'\')">Save</button><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;}
function saveWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;u.w.main=parseFloat(document.getElementById("editMain").value)||0;u.w.inviter=parseFloat(document.getElementById("editInv").value)||0;u.w.loyalty=parseFloat(document.getElementById("editLoy").value)||0;save();goAdmin();}
function editUserDetails(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;var h='<div class="card"><h3>Edit Personal Details - '+u.cell+'</h3><input id="editName" class="input" value="'+u.name+'"><input id="editEmail" class="input" value="'+u.email+'"><button class="btn" onclick="saveUserDetails(\''+u.cell+'\')">Save Details</button><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;}
function saveUserDetails(oldCell){var u=users.find(function(x){return x.cell===oldCell});if(!u)return;u.name=document.getElementById("editName").value.trim();u.email=document.getElementById("editEmail").value.trim();save();alert("Details Updated");goAdmin();}
function editAdminBank(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;if(!u.bank)u.bank={holder:u.name,acc:"",approved:false};var h='<div class="card"><h3>Edit Banking - '+u.name+'</h3><input id="editBankHolder" class="input" value="'+u.bank.holder+'"><input id="editBankAcc" class="input" value="'+u.bank.acc+'"><select id="editBankStatus" class="input"><option value="approved" '+(u.bank.approved?"selected":"")+'>APPROVED</option><option value="pending" '+(!u.bank.approved?"selected":"")+'>PENDING</option></select><button class="btn" onclick="saveAdminBank(\''+u.cell+'\')">Save Bank</button><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;}
function saveAdminBank(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;u.bank.holder=document.getElementById("editBankHolder").value.trim();u.bank.acc=document.getElementById("editBankAcc").value.trim();var st=document.getElementById("editBankStatus").value;u.bank.approved=(st==="approved");save();goAdmin();}
function goAdmin(){
setActive("bA");
if(!cur||cur.cell!=="ADMIN"){
document.getElementById("app").innerHTML='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cellphone" value="0510011039"><div class="pwdWrap"><input id="aP" class="input" type="password" placeholder="Password"><button class="eyeBtn" id="eyeAP" onclick="toggleEye(\'aP\',\'eyeAP\')">👁️</button></div><button class="btn" onclick="adminLogin()">Login</button></div>';
return;
}
var h='<div class="card"><h2 class="gold">Admin Dashboard - FULL WORKING</h2>';
for(var j=0;j<users.length;j++){var uu=users[j];ensureWallets(uu);
h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px"><b>'+uu.name+'</b><br>'+uu.cell+' - <b class="gold">'+uu.invite+'</b><br>Main R'+uu.w.main.toFixed(2)+' | Inviter R'+uu.w.inviter.toFixed(2)+' | Loyalty R'+uu.w.loyalty.toFixed(2)+'<br><button class="btn2" onclick="editUserWallets(\''+uu.cell+'\')">Edit Wallets</button><button class="btn2" onclick="editUserDetails(\''+uu.cell+'\')" style="background:#0f2a22;color:#2ee89e;border:1px solid #2ee89e">Edit Details</button><button class="btn2" onclick="editAdminBank(\''+uu.cell+'\')" style="background:#1a1a1a;color:#d4af37;border:1px solid #d4af37">Edit Bank</button></div>';
}
h+='</div>';document.getElementById("app").innerHTML=h;
}
try{goHome();}catch(e){document.getElementById("app").innerHTML='<div class="card">Error: '+e.message+'</div>';}
</script>
</body>
</html>
