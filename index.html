<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS - Devine Money Savings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f0f0f;color:#fff}
header{background:#111;border-bottom:2px solid #d4af37;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
header h1{color:#d4af37;font-size:16px}
.tabs{display:flex;gap:8px;padding:10px;background:#111;border-bottom:1px solid #333;overflow-x:auto}
.tabs button{background:#222;color:#d4af37;border:1px solid #d4af37;padding:8px 14px;border-radius:20px;cursor:pointer}
.tabs button.active{background:#d4af37;color:#000}
.card{background:#1a1a1a;border:1px solid #d4af37;border-radius:16px;padding:16px;margin:12px}
.yellow{background:#d4af37;color:#000;border:none;padding:8px 16px;border-radius:20px;font-weight:bold;cursor:pointer}
.gold{color:#d4af37}
.input{background:#111;border:1px solid #d4af37;color:#fff;padding:10px;border-radius:8px;width:100%;margin:6px 0}
.input:disabled{background:#2a2a2a;color:#aaa}
.btn-full{width:100%;padding:14px;background:#d4af37;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:10px;cursor:pointer;font-size:16px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal-box{background:#1a1a1a;border:2px solid #d4af37;border-radius:16px;padding:20px;width:100%;max-width:400px}
.wallet-opt{background:#222;border:1px solid #d4af37;padding:12px;border-radius:10px;margin:8px 0;cursor:pointer;display:flex;justify-content:space-between}
.pass-wrap{position:relative}
.eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;color:#d4af37}
select.input{appearance:auto}
#auth{padding:20px}
.auth-tab{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.auth-tab button{background:#222;color:#d4af37;border:1px solid #d4af37;padding:8px 16px;border-radius:20px}
.auth-tab button.active{background:#d4af37;color:#000}
</style>
</head>
<body>
<header><h1>DMS - Devine Money Savings</h1><button id="logoutBtn" class="yellow" style="display:none;background:#ff3333;color:#fff" onclick="logout()">Logout</button></header>

<div id="auth">
<div class="card" style="max-width:450px;margin:auto">
<h2 class="gold" style="text-align:center">DEVINE MONEY SAVINGS</h2>
<p style="text-align:center;color:#aaa;font-size:13px;margin:8px 0">Min R70 | 3 Wallets | Bank Zero</p>

<div class="auth-tab">
<button id="btnReg" class="active" onclick="switchAuth('reg')">Register</button>
<button id="btnLogin" onclick="switchAuth('login')">User Login</button>
<button id="btnAdmin" onclick="switchAuth('admin')">Admin Login</button>
</div>

<div id="regDiv">
<input id="rFull" class="input" placeholder="Full Name & Surname *">
<select id="rGender" class="input"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select>
<input id="rCell" class="input" placeholder="Cell Number * (e.g. 0712345678)">
<input id="rEmail" class="input" placeholder="Email *">
<input id="rInviter" class="input" placeholder="Inviter Code (optional)">
<select id="rProvince" class="input"><option value="">Province *</option><option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Free State</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select>
<div class="pass-wrap"><input id="rPass" class="input" type="password" placeholder="Password *"><span class="eye" onclick="toggleEye('rPass')">👁️</span></div>
<button class="btn-full" onclick="register()">Register</button>
</div>

<div id="loginDiv" style="display:none">
<input id="lEmail" class="input" placeholder="Email">
<div class="pass-wrap"><input id="lPass" class="input" type="password" placeholder="Password"><span class="eye" onclick="toggleEye('lPass')">👁️</span></div>
<button class="btn-full" onclick="login()">Login</button>
</div>

<div id="adminDiv" style="display:none">
<input id="aEmail" class="input" placeholder="Admin Email" value="admin@dms.co.za">
<div class="pass-wrap"><input id="aPass" class="input" type="password" placeholder="Admin Password" value="admin123"><span class="eye" onclick="toggleEye('aPass')">👁️</span></div>
<button class="btn-full" onclick="adminLogin()">Admin Login</button>
<p style="font-size:12px;color:#aaa;margin-top:6px;text-align:center">Default: admin@dms.co.za / admin123</p>
</div>

</div>
</div>

<div id="app" style="display:none">
<div class="tabs">
<button class="active" onclick="showTab('wallets')">Wallets</button>
<button onclick="showTab('packages')">Packages</button>
<button onclick="showTab('team')">Team</button>
<button onclick="showTab('history')">History</button>
<button onclick="showTab('adminP')">Admin</button>
</div>

<div id="wallets" class="tab">
<div class="card">
<h3 class="gold">3 Wallets</h3>
<div style="border:1px solid #d4af37;border-radius:10px;padding:10px;margin:6px 0">Main Wallet: R<span id="mainW">0.00</span></div>
<div style="border:1px solid #d4af37;border-radius:10px;padding:10px;margin:6px 0">Inviter Bonus Wallet: R<span id="invW">0.00</span></div>
