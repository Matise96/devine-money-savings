<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DMS Final</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff}header{background:#000;border-bottom:2px solid #d4af37;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{color:#d4af37;font-weight:900}.gold{color:#d4af37}.card{background:#141414;border:1px solid #333;margin:12px;border-radius:14px;padding:16px}.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff}.btn{width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:900}.btn2{padding:9px 14px;background:#d4af37;color:#000;border:none;border-radius:8px;font-weight:700;margin:4px}.btnRed{padding:9px 14px;background:#ff3b3b;color:#fff;border:none;border-radius:8px;font-weight:700;margin:4px}.badge{display:inline-block;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}.pkg{border:1px solid #333;background:#1c1c1c;padding:14px;border-radius:12px;margin:10px 0}.small{font-size:12px;color:#aaa}nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#111}nav button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#d4af37;white-space:nowrap}nav button.active{background:#d4af37;color:#000}.walletBox{border:1px solid #d4af37;background:#1a1a1a;padding:10px;border-radius:10px;margin:6px 0}.statBox{display:inline-block;border:1px solid #d4af37;background:#1e1e1e;padding:12px;border-radius:12px;margin:5px;min-width:140px;text-align:center}.adminTab{display:flex;gap:6px;overflow:auto;margin:10px 0}.adminTab button{padding:8px 12px;border-radius:20px;border:1px solid #d4af37;background:#111;color:#d4af37}.adminTab button.active{background:#d4af37;color:#000}</style></head><body><header><div class="logo">DMS - Devine Money Savings</div><button class="btn2" onclick="logout()" id="logoutBtn" style="display:none;background:#ff3b3b;color:#fff">Logout</button></header><nav><button onclick="goHome()" id="bH" class="active">Home</button><button onclick="goWallets()" id="bW">Wallets</button><button onclick="goPackages()" id="bP">Packages</button><button onclick="goTeam()" id="bT">Team</button><button onclick="goHistory()" id="bHI">History</button><button onclick="location.href='deposit.html'" id="bDEP" style="background:#d4af37;color:#000;font-weight:bold;">Deposit</button><button onclick="goAdmin()" id="bA">Admin</button></nav><div id="app"></div><script>
var PKGS=[{id:"A",name:"PACKAGE A",price:160,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"B",name:"PACKAGE B",price:250,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"C",name:"PACKAGE C",price:340,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},{id:"D",name:"PACKAGE D",price:430,daily:35,earliest:2,desc:"Earliest withdrawal in 2 days. Minimum withdrawal at R70."},{id:"E",name:"PACKAGE E",price:520,daily:70,earliest:1,desc:"Earliest withdrawal in 24hrs. Minimum withdrawal at R70."}];
var users=JSON.parse(localStorage.getItem("dms_users")||"[]");var txs=JSON.parse(localStorage.getItem("dms_txs")||"[]");var cur=JSON.parse(localStorage.getItem("dms_cur")||"null");var adminSub="users";
function save(){localStorage.setItem("dms_users",JSON.stringify(users));localStorage.setItem("dms_txs",JSON.stringify(txs));localStorage.setItem("dms_cur",JSON.stringify(cur));}
function ensureWallets(u){if(!u.w)u.w={main:0,inviter:0,loyalty:0};if(u.w.bonus!==undefined&&u.w.inviter===undefined){u.w.inviter=u.w.bonus;delete u.w.bonus;}if(u.w.main===undefined)u.w.main=0;if(u.w.inviter===undefined)u.w.inviter=0;if(u.w.loyalty===undefined)u.w.loyalty=0;if(!u.bank)u.bank=null;}
function setActive(id){document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});var e=document.getElementById(id);if(e)e.classList.add("active");}
function getUser(){if(!cur||cur.cell==="ADMIN")return null;for(var i=0;i<users.length;i++){if(users[i].cell===cur.cell){ensureWallets(users[i]);return users[i];}}return null;}
function logout(){cur=null;localStorage.removeItem("dms_cur");document.getElementById("logoutBtn").style.display="none";goHome();}
function checkLogout(){document.getElementById("logoutBtn").style.display=cur?"block":"none";}
function goHome(){setActive("bH");checkLogout();var u=getUser();if(!u&&(!cur||cur.cell!=="ADMIN")){var html='<div class="card" style="text-align:center;border:2px solid #d4af37"><div class="badge">EXCLUSIVE PACKAGES</div><h2 class="gold">DEVINE MONEY SAVINGS</h2><div style="text-align:left;margin-top:12px">';for(var i=0;i<PKGS.length;i++){var p=PKGS[i];html+='<div class="pkg"><span class="badge">'+p.name+'</span> <b style="float:right">R'+p.price+'</b><br><br><b>R'+p.price+' > R'+p.daily+' daily</b><br><span class="small">'+p.desc+'</span></div>';}html+='</div><hr><h3>Login</h3><input id="lC" class="input" placeholder="Cellphone"><input id="lP" class="input" type="password" placeholder="Password"><button class="btn" onclick="doLogin()">Login</button><p class="small">No account? <a href="#" onclick="goRegister()" style="color:#d4af37">Register here</a></p></div>';document.getElementById("app").innerHTML=html;return;}if(cur&&cur.cell==="ADMIN"){goAdmin();return;}var totalDaily=0;for(var j=0;j<u.pkgs.length;j++){if(!u.pkgs[j].done)totalDaily+=u.pkgs[j].daily;}var totalBal=u.w.main+u.w.inviter+u.w.loyalty;var h='<div class="card"><h3 class="gold">Welcome '+u.name+'</h3><p>Cell: '+u.cell+'<br>Invite: <b class="gold">'+u.invite+'</b></p><hr><div class="walletBox">Main Wallet: <b>R'+u.w.main.toFixed(2)+'</b></div><div class="walletBox">Inviter Bonus Wallet: <b>R'+u.w.inviter.toFixed(2)+'</b></div><div class="walletBox">Loyalty Bonus Wallet: <b>R'+u.w.loyalty.toFixed(2)+'</b></div><p>Total: <b class="gold">R'+totalBal.toFixed(2)+'</b> Daily: R'+totalDaily+'</p><button class="btn2" onclick="goWallets()">Wallets</button><button class="btn2" onclick="goPackages()">Buy Package</button><button class="btn2" onclick="goTeam()">My Team</button></div>';document.getElementById("app").innerHTML=h;}
function goRegister(){var inv=new URLSearchParams(location.search).get("invite")||"";var h='<div class="card"><h3 class="gold">Register</h3><input id="rN" class="input" placeholder="Full Name *"><input id="rC" class="input" placeholder="Cellphone *"><input id="rE" class="input" placeholder="Email *"><select id="rPr" class="input"><option value="">Province *</option><option>Free State</option><option>Gauteng</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Western Cape</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select><select id="rG" class="input"><option value="">Gender *</option><option>Male</option><option>Female</option></select><input id="rP" class="input" type="password" placeholder="Password *"><input id="rI" class="input" placeholder="Invite Code (optional)" value="'+inv+'"><button class="btn" onclick="doRegister()">Create Account</button></div>';document.getElementById("app").innerHTML=h;}
function doRegister(){var n=document.getElementById("rN").value.trim(),c=document.getElementById("rC").value.trim(),e=document.getElementById("rE").value.trim(),pr=document.getElementById("rPr").value,g=document.getElementById("rG").value,p=document.getElementById("rP").value.trim(),inv=document.getElementById("rI").value.trim().toUpperCase();if(!n||!c||!e||!pr||!g||!p){alert("Fill all *");return;}for(var i=0;i<users.length;i++){if(users[i].cell===c){alert("Cell exists");return;}}var code="DMS"+String(users.length+1).padStart(3,"0");var u={cell:c,name:n,email:e,prov:pr,gender:g,pass:p,invite:code,by:inv||null,w:{main:0,inviter:0,loyalty:0},pkgs:[],bank:null};users.push(u);if(inv){for(var k=0;k<users.length-1;k++){if(users[k].invite===inv||users[k].cell===inv){ensureWallets(users[k]);users[k].w.inviter+=10;txs.push({cell:users[k].cell,type:"bonus",amount:10,fee:0,note:"Inviter bonus from "+c+" ("+code+")",date:new Date().toISOString(),status:"done"});break;}}}save();alert("Registered! Code "+code);goHome();}
function doLogin(){var c=document.getElementById("lC").value.trim(),p=document.getElementById("lP").value.trim();if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();return;}for(var i=0;i<users.length;i++){if(users[i].cell===c&&users[i].pass===p){ensureWallets(users[i]);cur={cell:users[i].cell};save();goHome();return;}}alert("Wrong");}
function adminLogin(){var c=document.getElementById("aC").value.trim(),p=document.getElementById("aP").value.trim();if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();}else{alert("Wrong");}}
function goPackages(){setActive("bP");checkLogout();var h='<div class="card"><h3 class="gold">Packages</h3>';for(var i=0;i<PKGS.length;i++){var pk=PKGS[i];h+='<div class="pkg"><span class="badge">'+pk.name+'</span> <b style="float:right">R'+pk.price+'</b><br><br><b>R'+pk.price+' > R'+pk.daily+' daily</b><br><span class="small">'+pk.desc+'</span><br><br><button class="btn2" onclick="buyPkg('+i+')">Buy '+pk.name+'</button></div>';}h+='</div>';document.getElementById("app").innerHTML=h;}
 function buyPkg(i){var u=getUser();if(!u){alert("Login first");return;}var price=PKGS[i].price||160;var b1=u.w.main||0;var b2=u.w.ref||0;var b3=u.w.bonus||0;if(Math.max(b1,b2,b3)<price){alert("Insufficient funds / Not enough funds. Deposit to purchase.\nMain: R"+b1+" Referral: R"+b2+" Bonus: R"+b3+"\nNeed R"+price);return;}
  pkgPrice = pkgPrice || 160; // Minimum R160 for Package A
  // Get 3 wallets - try localStorage and page
  let w1 = parseFloat(localStorage.getItem('wallet_main') || localStorage.getItem('mainBalance') || document.getElementById('mainWallet')?.innerText?.replace('R','') || 0) || 0;
  let w2 = parseFloat(localStorage.getItem('wallet_referral') || localStorage.getItem('referralBalance') || document.getElementById('referralWallet')?.innerText?.replace('R','') || 0) || 0;
  let w3 = parseFloat(localStorage.getItem('wallet_income') || localStorage.getItem('incomeBalance') || document.getElementById('incomeWallet')?.innerText?.replace('R','') || 0) || 0;

  // If no localStorage, check all wallet elements containing R
  if(w1==0 && w2==0 && w3==0){
    let vals = [...document.querySelectorAll('[class*=wallet]')].map(e=>parseFloat(e.innerText.replace(/[^0-9.]/g,''))||0).filter(v=>v>=0);
    if(vals.length>=3){ w1=vals[0]; w2=vals[1]; w3=vals[2]; }
  }

  let maxBal = Math.max(w1,w2,w3);

  // R0 - R159 = Block
  if(maxBal < pkgPrice){
    alert("Insufficient funds / Not enough funds. Deposit to purchase.\n\nYour balances:\nMain: R"+w1+"\nReferral: R"+w2+"\nIncome: R"+w3+"\n\nMinimum required: R"+pkgPrice+"\nPlease deposit first via Deposit page (BANK ZERO 8020 5598 418)");
    return;
  }

  // R160+ = Let them CHOOSE wallet
  let choice = prompt(
    "You have enough funds!\n\nMain Wallet: R"+w1+"\nReferral Wallet: R"+w2+"\nIncome Wallet: R"+w3+"\n\nWhich wallet to buy "+pkgName+" (R"+pkgPrice+") from?\n\nType: 1 = Main, 2 = Referral, 3 = Income"
  );

  if(choice==null) return; // cancelled

  let selectedBal = 0;
  let walletName = "";
  let walletKey = "";

  if(choice=="1"){ selectedBal=w1; walletName="Main Wallet"; walletKey="wallet_main"; }
  else if(choice=="2"){ selectedBal=w2; walletName="Referral Wallet"; walletKey="wallet_referral"; }
  else if(choice=="3"){ selectedBal=w3; walletName="Income Wallet"; walletKey="wallet_income"; }
  else { alert("Invalid choice. Please type 1, 2 or 3."); return; }

  if(selectedBal < pkgPrice){
    alert("Not enough funds in "+walletName+" (R"+selectedBal+"). You need R"+pkgPrice+". Try another wallet or deposit.");
    return;
  }

  // Deduct
  let newBal = selectedBal - pkgPrice;
  localStorage.setItem(walletKey, newBal);
  // Also try generic keys
  if(walletKey=="wallet_main") localStorage.setItem('mainBalance', newBal);
  if(walletKey=="wallet_referral") localStorage.setItem('referralBalance', newBal);
  if(walletKey=="wallet_income") localStorage.setItem('incomeBalance', newBal);

  alert("Success! Package "+pkgName+" bought from "+walletName+" for R"+pkgPrice+"!\nNew "+walletName+" balance: R"+newBal+"\nGo to Wallets to claim daily.");
  location.reload();
  }! Track it in 24hrs.");goWallets();}
function goWallets(){setActive("bW");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}checkLogout();var h='<div class="card"><h3 class="gold">Wallets</h3>';h+='<div class="walletBox">Main Wallet: <b>R'+u.w.main.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div>';h+='<div class="walletBox">Inviter Bonus: <b>R'+u.w.inviter.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div>';h+='<div class="walletBox">Loyalty Bonus: <b>R'+u.w.loyalty.toFixed(2)+'</b> <button class="btn2" onclick="doWithdraw()">Withdraw</button></div>';h+='<hr><h4 class="gold">My Packages ('+u.pkgs.length+')</h4>';if(u.pkgs.length===0){h+="<p class=small>No packages. Buy one.</p>";}else{for(var i=0;i<u.pkgs.length;i++){var p=u.pkgs[i];var bought=new Date(p.boughtAt);var diffDays=Math.floor((new Date()-bought)/(1000*60*60*24));var canClaim=false;var msg="";if(p.done){msg="Completed";}else if(diffDays < p.earliest){msg="Earliest in "+(p.earliest-diffDays)+" day(s)";}else{var last=p.lastClaim?new Date(p.lastClaim):null;if(!last|| (new Date()-last) >= 24*60*60*1000){canClaim=true;msg="Ready to claim R"+p.daily;}else{msg="Come back tomorrow";}}h+='<div class="pkg"><span class="badge">'+p.id+'</span> R'+p.price+' -> R'+p.daily+'/day | Earned R'+p.totalEarned+'<br><span class="small">Bought '+bought.toLocaleDateString()+' - '+msg+'</span><br>';if(canClaim){h+='<button class="btn2" onclick="claimPkg('+i+')">Claim R'+p.daily+'</button>';}h+='</div>';}}h+='</div>';document.getElementById("app").innerHTML=h;}
function claimPkg(idx){var u=getUser();if(!u)return;var p=u.pkgs[idx];if(!p||p.done)return;var bought=new Date(p.boughtAt);var diffDays=Math.floor((new Date()-bought)/(1000*60*60*24));if(diffDays < p.earliest){alert("Earliest withdrawal in "+(p.earliest-diffDays)+" days");return;}var last=p.lastClaim?new Date(p.lastClaim):null;if(last && (new Date()-last) < 24*60*60*1000){alert("Come back tomorrow");return;}var earned=p.daily;p.totalEarned+=earned;if(p.totalEarned>=p.price*2){p.done=true;}p.lastClaim=new Date().toISOString();if(earned===0){return doWithdraw();}u.w.main+=earned;txs.push({cell:u.cell,type:"earn",amount:earned,fee:0,note:"Daily from "+p.id,date:new Date().toISOString(),status:"done"});save();goWallets();}
function doWithdraw(){var u=getUser();if(!u){alert("Login first");return;}var w=prompt("Choose wallet to withdraw from:\n1 = Main Wallet (R"+(u.w.main||0).toFixed(2)+")\n2 = Inviter Bonus Wallet (R"+(u.w.inviter||0).toFixed(2)+")\n3 = Loyalty Bonus Wallet (R"+(u.w.loyalty||0).toFixed(2)+")\n\nType 1, 2 or 3");if(!w)return;var bal=0;var wName="";var wKey="";if(w=="1"){bal=u.w.main||0;wName="Main";wKey="main";}else if(w=="2"){bal=u.w.inviter||0;wName="Inviter Bonus";wKey="inviter";}else if(w=="3"){bal=u.w.loyalty||0;wName="Loyalty";wKey="loyalty";}else{alert("Invalid choice");return;}if(bal<=0){alert("Insufficient funds");return;}if(bal<70){alert("Minimum withdrawal is R70");return;}if(!u.bank||!u.bank.acc){alert("Please upload your banking details first");return goBankForm(wKey);}if(!u.bank.approved){alert("Your banking details are pending admin approval. Please wait.");return;}var amtStr=prompt("Withdraw from "+wName+" (Available R"+bal.toFixed(2)+")\nEnter amount (Min R70):");if(!amtStr)return;var amt=parseFloat(amtStr);if(isNaN(amt)||amt<70){alert("Minimum withdrawal is R70");return;}if(amt>bal){alert("Insufficient funds");return;}var fee=amt*0.1;if(wKey==="main")u.w.main-=amt;if(wKey==="inviter")u.w.inviter-=amt;if(wKey==="loyalty")u.w.loyalty-=amt;txs.push({cell:u.cell,type:"withdraw",wallet:wKey,amount:amt,fee:fee,note:"Withdraw from "+wName,status:"pending",date:new Date().toISOString()});save();alert("Withdrawal request of R"+amt+" from "+wName+" submitted! You will receive R"+(amt-fee).toFixed(2)+" after fee. Awaiting admin.");goWallets();}
function goBankForm(walletToWithdraw){var h='<div class="card"><h3 class="gold">Upload Banking Details</h3><p class="small">Required before withdrawal. Admin will approve.</p><input id="bName" class="input" placeholder="Account Holder Name"><input id="bBank" class="input" placeholder="Bank Name (e.g. Capitec)"><input id="bAcc" class="input" placeholder="Account Number"><input id="bBranch" class="input" placeholder="Branch Code"><button class="btn" onclick="saveBank()">Submit for Approval</button><br><br><button class="btn2" onclick="goWallets()">Back to Wallets</button></div>';document.getElementById("app").innerHTML=h;}
function saveBank(){var name=document.getElementById("bName").value.trim();var bank=document.getElementById("bBank").value.trim();var acc=document.getElementById("bAcc").value.trim();var branch=document.getElementById("bBranch").value.trim();if(!name||!bank||!acc||!branch){alert("Fill all fields");return;}var u=getUser();if(!u)return;u.bank={holder:name,bankName:bank,acc:acc,branch:branch,approved:false,pending:true};save();alert("Banking details uploaded! Admin must approve before you can withdraw.");goWallets();}
function approveBank(cell){var u=users.find(function(x){return x.cell===cell});if(!u||!u.bank)return;u.bank.approved=true;u.bank.pending=false;save();alert("Banking approved for "+cell);goAdmin();}
function rejectBank(cell){if(!confirm("Reject and delete banking details for "+cell+"?"))return;var u=users.find(function(x){return x.cell===cell});if(!u)return;u.bank=null;save();goAdmin();}
function goTeam(){setActive("bT");var u=getUser();if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var code=u.invite;var team=[];for(var i=0;i<users.length;i++){if(users[i].by===code||users[i].by===u.cell)team.push(users[i]);}var link=location.origin+location.pathname+"?invite="+code;var h='<div class="card"><h3 class="gold">My Team '+team.length+'</h3><p>Code <b>'+code+'</b></p><input class="input" value="'+link+'" readonly><button class="btn2" onclick="navigator.clipboard.writeText(\''+link+'\')">Copy Link</button><hr>';for(var k=0;k<team.length;k++){h+='<div>'+team[k].name+' '+team[k].cell+' - '+team[k].invite+'</div>';}if(team.length===0)h+="No team";h+="<p>Inviter Wallet: R"+u.w.inviter.toFixed(2)+"</p></div>";document.getElementById("app").innerHTML=h;}
function goHistory(){setActive("bHI");if(!cur){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}var list=[];if(cur.cell==="ADMIN"){list=txs;}else{var gu=getUser();if(!gu){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}for(var i=0;i<txs.length;i++){if(txs[i].cell===gu.cell)list.push(txs[i]);}}var h='<div class="card"><h3 class="gold">History</h3>';for(var i=list.length-1;i>=0;i--){var t=list[i];h+='<div style="border-bottom:1px solid #222;padding:6px 0"><b>'+t.type+'</b> R'+t.amount+' '+(t.fee?"fee R"+t.fee.toFixed(2):"")+'<br><span class="small">'+new Date(t.date).toLocaleString()+" "+(t.note||"")+" "+(t.status||"")+(t.wallet?" ["+t.wallet+"]":"")+'</span></div>';}if(list.length===0)h+="No history";h+="</div>";document.getElementById("app").innerHTML=h;}
function setAdminSub(s){adminSub=s;goAdmin();}
function editUserWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;ensureWallets(u);var h='<div class="card" style="border:2px solid #d4af37"><h3 class="gold">Edit 3 Wallets - '+u.name+'<br><span class="small">'+u.cell+' - '+u.invite+'</span></h3>';h+='<label>Main Wallet</label><input id="editMain" class="input" type="number" value="'+u.w.main.toFixed(2)+'">';h+='<label>Inviter Bonus Wallet</label><input id="editInv" class="input" type="number" value="'+u.w.inviter.toFixed(2)+'">';h+='<label>Loyalty Bonus Wallet</label><input id="editLoy" class="input" type="number" value="'+u.w.loyalty.toFixed(2)+'">';h+='<p>Total: <b id="editTotal">R'+(u.w.main+u.w.inviter+u.w.loyalty).toFixed(2)+'</b></p>';h+='<button class="btn" onclick="saveWallets(\''+u.cell+'\')">Save All 3 Wallets</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button></div>';document.getElementById("app").innerHTML=h;var upd=function(){var m=parseFloat(document.getElementById("editMain").value)||0;var iv=parseFloat(document.getElementById("editInv").value)||0;var l=parseFloat(document.getElementById("editLoy").value)||0;document.getElementById("editTotal").innerText="R"+(m+iv+l).toFixed(2);};document.getElementById("editMain").addEventListener("input",upd);document.getElementById("editInv").addEventListener("input",upd);document.getElementById("editLoy").addEventListener("input",upd);}
function saveWallets(cell){var u=users.find(function(x){return x.cell===cell});if(!u)return;var m=parseFloat(document.getElementById("editMain").value)||0;var iv=parseFloat(document.getElementById("editInv").value)||0;var l=parseFloat(document.getElementById("editLoy").value)||0;u.w.main=m;u.w.inviter=iv;u.w.loyalty=l;save();alert("Saved! Main R"+m+" | Inviter R"+iv+" | Loyalty R"+l);goAdmin();}
function deleteUser(cell){if(!confirm("Delete user "+cell+"?"))return;if(!confirm("FINAL CONFIRM DELETE "+cell+"?"))return;users=users.filter(function(x){return x.cell!==cell});txs=txs.filter(function(t){return t.cell!==cell});save();goAdmin();}
function approveWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;t.status="done";save();alert("Approved R"+t.amount+" for "+t.cell+" Receive R"+(t.amount-t.fee).toFixed(2));goAdmin();}
function rejectWithdraw(idx){var t=txs[idx];if(!t||t.status!=="pending")return;if(!confirm("Reject and refund R"+t.amount+" to "+t.cell+"?"))return;var u=users.find(function(x){return x.cell===t.cell});if(u){ensureWallets(u);if(t.wallet==="main")u.w.main+=t.amount;else if(t.wallet==="inviter")u.w.inviter+=t.amount;else if(t.wallet==="loyalty")u.w.loyalty+=t.amount;else u.w.main+=t.amount;}t.status="rejected";save();goAdmin();}
function goAdmin(){setActive("bA");if(!cur||cur.cell!=="ADMIN"){document.getElementById("app").innerHTML='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cellphone" value="0510011039"><input id="aP" class="input" type="password" placeholder="Password"><button class="btn" onclick="adminLogin()">Login</button></div>';return;}for(var i=0;i<users.length;i++){var exp="DMS"+String(i+1).padStart(3,"0");users[i].invite=exp;}var totalMain=0,totalInv=0,totalLoy=0;users.forEach(function(u){ensureWallets(u);totalMain+=u.w.main;totalInv+=u.w.inviter;totalLoy+=u.w.loyalty;});var pend=txs.filter(function(t){return t.status==="pending"});var doneW=txs.filter(function(t){return t.type==="withdraw"&&t.status==="done"});var totalPaid=0;doneW.forEach(function(t){totalPaid+=t.amount;});var h='<div class="card"><h2 class="gold">Admin Dashboard</h2>';h+='<div class="statBox"><b>'+users.length+'</b><br><span class="small">Total Users</span></div><div class="statBox"><b>'+pend.length+'</b><br><span class="small">Pending</span></div><div class="statBox"><b>R'+totalMain.toFixed(0)+'</b><br><span class="small">Total Main</span></div><div class="statBox"><b>R'+totalInv.toFixed(0)+'</b><br><span class="small">Inviter</span></div><div class="statBox"><b>R'+totalLoy.toFixed(0)+'</b><br><span class="small">Loyalty</span></div><div class="statBox"><b>R'+totalPaid.toFixed(0)+'</b><br><span class="small">Paid Out</span></div>';h+='<hr><div class="adminTab"><button onclick="setAdminSub(\'dashboard\')" class="'+(adminSub==="dashboard"?"active":"")+'">Dashboard</button><button onclick="setAdminSub(\'withdrawals\')" class="'+(adminSub==="withdrawals"?"active":"")+'">Withdrawals ('+pend.length+')</button><button onclick="setAdminSub(\'users\')" class="'+(adminSub==="users"?"active":"")+'">Users ('+users.length+')</button><button onclick="setAdminSub(\'settings\')" class="'+(adminSub==="settings"?"active":"")+'">Settings</button></div><hr>';if(adminSub==="dashboard"){h+='<h3 class="gold">Pending Withdrawals</h3>';if(pend.length===0){h+="<p>No pending</p>";}for(var i=0;i<pend.length;i++){var t=pend[i];var idx=txs.indexOf(t);var receive=(t.amount-t.fee).toFixed(2);h+='<div style="border:1px solid #d4af37;padding:10px;margin:8px 0;border-radius:10px;background:#1a1a1a"><b>'+t.cell+'</b><br>Request R'+t.amount+' Fee R'+t.fee.toFixed(2)+' Receive <b class="gold">R'+receive+'</b><br><button class="btn2" onclick="approveWithdraw('+idx+')">Approve</button><button class="btnRed" onclick="rejectWithdraw('+idx+')">Reject</button></div>';}}if(adminSub==="withdrawals"){h+='<h3 class="gold">All Withdrawals</h3>';var allW=txs.filter(function(t){return t.type==="withdraw"}).reverse();for(var i=0;i<allW.length;i++){var t=allW[i];var idx=txs.indexOf(t);h+='<div style="border:1px solid #444;padding:8px;margin:6px 0"><b>'+t.cell+'</b> R'+t.amount+' Fee R'+t.fee.toFixed(2)+' Receive R'+(t.amount-t.fee).toFixed(2)+' - <b>'+t.status+'</b><br><span class="small">'+new Date(t.date).toLocaleString()+' '+(t.wallet||"")+'</span>';if(t.status==="pending"){h+='<br><button class="btn2" onclick="approveWithdraw('+idx+')">Approve</button><button class="btnRed" onclick="rejectWithdraw('+idx+')">Reject</button>';}h+='</div>';}}if(adminSub==="users"){h+='<h3 class="gold">Users - Edit 3 Wallets + Banking</h3><input id="searchUser" class="input" placeholder="Search" oninput="filterUsers(this.value)"><div id="userList">';for(var j=0;j<users.length;j++){var uu=users[j];ensureWallets(uu);h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px" class="userItem" data-search="'+uu.cell+' '+uu.invite+' '+uu.name.toLowerCase()+'"><b>'+uu.name+'</b><br>'+uu.cell+' - <b class="gold">'+uu.invite+'</b><br>Main R'+uu.w.main.toFixed(2)+' | Inviter R'+uu.w.inviter.toFixed(2)+' | Loyalty R'+uu.w.loyalty.toFixed(2)+' | '+uu.pkgs.length+' pkgs<br>By: '+(uu.by||"None")+' | '+uu.prov+'';if(uu.bank){h+='<div style="margin-top:8px;padding:8px;border:1px solid gold;border-radius:8px;background:#1a1a1a"><b>Bank:</b> '+(uu.bank.bankName||"")+'<br><b>Holder:</b> '+(uu.bank.holder||"")+'<br><b>Acc:</b> '+(uu.bank.acc||"")+'<br><b>Branch:</b> '+(uu.bank.branch||"")+'<br><b>Status:</b> '+(uu.bank.approved?'<span style="color:lightgreen">APPROVED</span>':'<span style="color:orange">PENDING</span>')+'<br>';if(!uu.bank.approved){h+='<button class="btn2" onclick="approveBank(\''+uu.cell+'\')" style="background:green;color:white">Approve Banking</button> <button class="btnRed" onclick="rejectBank(\''+uu.cell+'\')">Reject</button>';}h+='</div>';}else{h+='<div style="margin-top:6px" class="small">No banking uploaded</div>';}h+='<br><button class="btn2" onclick="editUserWallets(\''+uu.cell+'\')">Edit 3 Wallets</button><button class="btnRed" onclick="deleteUser(\''+uu.cell+'\')">Delete User</button></div>';}h+='</div>';}if(adminSub==="settings"){h+='<h3 class="gold">Settings</h3><button class="btn2" onclick="var c=prompt(\'Add bonus to ALL - Inviter:\',\'10\'); if(c){var amt=parseFloat(c); users.forEach(function(u){ensureWallets(u); u.w.inviter+=amt;}); save(); goAdmin();}">Bonus All - Inviter</button><br><br><button class="btn2" onclick="var c=prompt(\'Add bonus to ALL - Loyalty:\',\'5\'); if(c){var amt=parseFloat(c); users.forEach(function(u){ensureWallets(u); u.w.loyalty+=amt;}); save(); goAdmin();}">Bonus All - Loyalty</button><br><br><button class="btnRed" onclick="if(confirm(\'Clear ALL data?\')){if(confirm(\'FINAL CONFIRM?\')){users=[]; txs=[]; save(); goAdmin();}}">Clear All Data</button>';}h+='</div>';document.getElementById("app").innerHTML=h;}
function filterUsers(q){q=q.toLowerCase();document.querySelectorAll(".userItem").forEach(function(el){var s=el.getAttribute("data-search");el.style.display=s.includes(q)?"block":"none";});}
goHome();
</script></body></html>
