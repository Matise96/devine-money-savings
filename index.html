<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS - Devine Money Savings</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:#0a0a0a;color:#fff;padding-bottom:20px}
header{background:#000;border-bottom:2px solid #d4af37;padding:14px 12px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{color:#d4af37;font-weight:900}
.gold{color:#d4af37}
.card{background:#141414;border:1px solid #333;margin:12px;border-radius:14px;padding:16px}
.input{width:100%;padding:13px;margin:8px 0;border-radius:10px;border:1px solid #444;background:#0f0f0f;color:#fff}
.btn{width:100%;padding:14px;background:#d4af37;color:#000;border:none;border-radius:10px;font-weight:900}
.btn2{padding:9px 14px;background:#d4af37;color:#000;border:none;border-radius:8px;font-weight:700;margin:4px}
.btnRed{padding:9px 14px;background:#ff3b3b;color:#fff;border:none;border-radius:8px;font-weight:700;margin:4px}
.badge{display:inline-block;background:#d4af37;color:#000;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}
.pkg{border:1px solid #333;background:#1c1c1c;padding:14px;border-radius:12px;margin:10px 0}
.small{font-size:12px;color:#aaa}
nav{display:flex;gap:6px;overflow:auto;padding:10px;background:#111}
nav button{padding:9px 14px;border-radius:20px;border:1px solid #444;background:#1a1a1a;color:#d4af37;white-space:nowrap}
nav button.active{background:#d4af37;color:#000}
.walletBox{border:1px solid #d4af37;background:#1a1a1a;padding:10px;border-radius:10px;margin:6px 0}
.statBox{display:inline-block;border:1px solid #d4af37;background:#1e1e1e;padding:12px;border-radius:12px;margin:5px;min-width:130px;text-align:center}
.adminTab{display:flex;gap:6px;overflow:auto;margin:10px 0}
.adminTab button{padding:8px 12px;border-radius:20px;border:1px solid #d4af37;background:#111;color:#d4af37}
.adminTab button.active{background:#d4af37;color:#000}
.activePkgCard{border:2px solid #d4af37;background:linear-gradient(135deg,#1a1a1a,#0f2a22);padding:16px;border-radius:16px;margin:12px 0}
.nextCredit{color:#2ee89e;font-weight:800;background:#0a1f18;padding:8px 12px;border-radius:10px;display:inline-block;margin-top:6px;border:1px solid #2ee89e}
.leadTable{width:100%;border-collapse:collapse;margin-top:10px}
.leadTable th{background:#d4af37;color:#000;padding:10px;text-align:left;font-size:13px}
.leadTable td{padding:10px;border-bottom:1px solid #333;font-size:13px}
.pwdWrap{position:relative;display:flex;align-items:center;width:100%}
.eyeBtn{position:absolute;right:12px;background:none;border:none;font-size:20px;cursor:pointer;color:#d4af37}
</style>
</head>
<body>
<header>
<div class="logo">DMS - Devine Money Savings</div>
<button class="btn2" onclick="logout()" id="logoutBtn" style="display:none;background:#ff3b3b;color:#fff">Logout</button>
</header>
<nav>
<button onclick="goHome()" id="bH" class="active">Home</button>
<button onclick="goWallets()" id="bW">Wallets</button>
<button onclick="goPackages()" id="bP">Packages</button>
<button onclick="goActivePackages()" id="bAP" style="background:#0f2a22;color:#2ee89e;border-color:#2ee89e;font-weight:900;">Active Packages</button>
<button onclick="goTeam()" id="bT">Team</button>
<button onclick="goHistory()" id="bHI">History</button>
<button onclick="goAdmin()" id="bA">Admin</button>
</nav>
<div id="app"></div>
<script>
function safeParse(k,f){
  try{
    var v=localStorage.getItem(k);
    if(!v)return JSON.parse(f);
    return JSON.parse(v);
  }catch(e){
    return JSON.parse(f);
  }
}
var PKGS=[
  {id:"A",name:"PACKAGE A",price:160,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},
  {id:"B",name:"PACKAGE B",price:250,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},
  {id:"C",name:"PACKAGE C",price:340,daily:10,earliest:7,desc:"Earliest withdrawal in 7 days. Minimum withdrawal at R70."},
  {id:"D",name:"PACKAGE D",price:430,daily:35,earliest:2,desc:"Earliest withdrawal in 2 days. Minimum withdrawal at R70."},
  {id:"E",name:"PACKAGE E",price:520,daily:70,earliest:1,desc:"Earliest withdrawal in 24hrs. Minimum withdrawal at R70."}
];
var users=safeParse("dms_users","[]");
var txs=safeParse("dms_txs","[]");
var cur=safeParse("dms_cur","null");
var adminSub="leaderboard";
var VALID_DEPOSITS=[160,250,340,430,520];
function save(){
  localStorage.setItem("dms_users",JSON.stringify(users));
  localStorage.setItem("dms_txs",JSON.stringify(txs));
  localStorage.setItem("dms_cur",JSON.stringify(cur));
}
function ensureWallets(u){
  if(!u.w)u.w={main:0,inviter:0,loyalty:0};
  if(u.w.main===undefined)u.w.main=0;
  if(u.w.inviter===undefined)u.w.inviter=0;
  if(u.w.loyalty===undefined)u.w.loyalty=0;
  if(!u.hasOwnProperty('bank'))u.bank=null;
}
function setActive(id){
  try{
    document.querySelectorAll("nav button").forEach(function(b){b.classList.remove("active")});
    var e=document.getElementById(id);
    if(e)e.classList.add("active");
  }catch(e){}
}
function getUser(){
  if(!cur||cur.cell==="ADMIN")return null;
  for(var i=0;i<users.length;i++){
    if(users[i].cell===cur.cell){
      ensureWallets(users[i]);
      return users[i];
    }
  }
  return null;
}
function toggleEye(a,b){
  var x=document.getElementById(a);
  var y=document.getElementById(b);
  if(!x)return;
  if(x.type==="password"){
    x.type="text";
    y.textContent="🙈";
  }else{
    x.type="password";
    y.textContent="👁️";
  }
}
function goHome(){
  setActive("bH");
  checkLogout();
  var u=getUser();
  if(!u&&(!cur||cur.cell!=="ADMIN")){
    var html='<div class="card" style="text-align:center;border:2px solid #d4af37"><h2 class="gold">DEVINE MONEY SAVINGS</h2><div style="text-align:left;margin-top:12px">';
    for(var i=0;i<PKGS.length;i++){
      var p=PKGS[i];
      html+='<div class="pkg"><span class="badge">'+p.name+'</span> <b style="float:right">R'+p.price+'</b><br><br><b>R'+p.price+' > R'+p.daily+' Daily cashback</b></div>';
    }
    html+='</div><hr><h3>Login</h3>';
    html+='<input id="lC" class="input" placeholder="Cellphone">';
    html+='<div class="pwdWrap"><input id="lP" class="input" type="password" placeholder="Password"><button class="eyeBtn" id="eyeLP" onclick="toggleEye(&quot;lP&quot;,&quot;eyeLP&quot;)">👁️</button></div>';
    html+='<button class="btn" onclick="doLogin()">Login</button>';
    html+='<p><a href="#" onclick="goRegister()" style="color:#d4af37">Register here</a></p></div>';
    document.getElementById("app").innerHTML=html;
    return;
  }
  if(cur&&cur.cell==="ADMIN"){goAdmin();return;}
  var h='<div class="card"><h3 class="gold">Welcome '+u.name+'</h3><p>Cell: '+u.cell+'</p><button class="btn2" onclick="goWallets()">Wallets</button><button class="btn2" onclick="goPackages()">Buy Package</button></div>';
  document.getElementById("app").innerHTML=h;
}
function goRegister(){
  var h='<div class="card"><h3 class="gold">Register</h3>';
  h+='<input id="rN" class="input" placeholder="Full Name *">';
  h+='<input id="rC" class="input" placeholder="Cellphone *">';
  h+='<input id="rE" class="input" placeholder="Email *">';
  h+='<div class="pwdWrap"><input id="rP" class="input" type="password" placeholder="Password *"><button class="eyeBtn" id="eyeRP" onclick="toggleEye(&quot;rP&quot;,&quot;eyeRP&quot;)">👁️</button></div>';
  h+='<button class="btn" onclick="doRegister()">Create Account</button></div>';
  document.getElementById("app").innerHTML=h;
}
function doRegister(){
  var n=document.getElementById("rN").value.trim();
  var c=document.getElementById("rC").value.trim();
  var e=document.getElementById("rE").value.trim();
  var p=document.getElementById("rP").value.trim();
  if(!n||!c||!e||!p){alert("Fill all *");return;}
  var code="DMS"+String(users.length+1).padStart(3,"0");
  var u={cell:c,name:n,email:e,pass:p,invite:code,by:null,w:{main:0,inviter:0,loyalty:0},pkgs:[],bank:null};
  users.push(u);
  save();
  alert("Registered! "+code+"!");
  goHome();
}
function doLogin(){
  var c=document.getElementById("lC").value.trim();
  var p=document.getElementById("lP").value.trim();
  if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();return;}
  for(var i=0;i<users.length;i++){
    if(users[i].cell===c&&users[i].pass===p){
      ensureWallets(users[i]);
      cur={cell:users[i].cell};
      save();
      goHome();
      return;
    }
  }
  alert("Wrong");
}
function adminLogin(){
  var c=document.getElementById("aC").value.trim();
  var p=document.getElementById("aP").value.trim();
  if(c==="0510011039"&&p==="Tiisetso#96"){cur={cell:"ADMIN"};save();goAdmin();}else{alert("Wrong");}
}
function goPackages(){
  setActive("bP");
  var h='<div class="card"><h3 class="gold">Packages - Daily cashback</h3>';
  for(var i=0;i<PKGS.length;i++){
    var pk=PKGS[i];
    h+='<div class="pkg"><span class="badge">'+pk.name+'</span> R'+pk.price+' > R'+pk.daily+' Daily cashback<br><button class="btn2" onclick="buyPkg('+i+')">Buy '+pk.name+'</button></div>';
  }
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
function buyPkg(i){
  var u=getUser();
  if(!u){alert("Login first");return;}
  var pkg=PKGS[i];
  var price=pkg.price||160;
  var b1=u.w.main||0;
  if(b1<price){alert("Insufficient funds - Need R"+price);return;}
  u.w.main-=price;
  u.pkgs.push({id:pkg.id,price:price,daily:pkg.daily,earliest:pkg.earliest,boughtAt:new Date().toISOString(),lastClaim:null,totalEarned:0,done:false});
  save();
  alert("Success! "+pkg.name+" bought");
  goHome();
}
function goWallets(){
  setActive("bW");
  var u=getUser();
  if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}
  var h='<div class="card"><h3 class="gold">Wallets</h3>';
  h+='<div class="walletBox">Main: <b>R'+u.w.main.toFixed(2)+'</b></div>';
  h+='<div class="walletBox">Inviter: <b>R'+u.w.inviter.toFixed(2)+'</b></div>';
  h+='<div class="walletBox">Loyalty: <b>R'+u.w.loyalty.toFixed(2)+'</b></div>';
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
function goTeam(){
  setActive("bT");
  var u=getUser();
  if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}
  var code=u.invite;
  var h='<div class="card"><h3>My Team - Code '+code+'</h3></div>';
  document.getElementById("app").innerHTML=h;
}
function goHistory(){
  setActive("bHI");
  var h='<div class="card"><h3>History</h3>';
  for(var i=txs.length-1;i>=0;i--){
    var t=txs[i];
    h+='<div><b>'+t.type+'</b> R'+t.amount+'</div>';
  }
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
function goActivePackages(){
  setActive("bAP");
  var u=getUser();
  if(!u){document.getElementById("app").innerHTML="<div class=card>Login</div>";return;}
  var h='<div class="card"><h3>Active Packages ('+u.pkgs.length+')</h3>';
  for(var i=0;i<u.pkgs.length;i++){
    var p=u.pkgs[i];
    h+='<div class="pkg"><b>'+p.id+'</b> R'+p.price+' Earned R'+p.totalEarned+'</div>';
  }
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
function editUserWallets(cell){
  var u=users.find(function(x){return x.cell===cell});
  if(!u)return;
  var h='<div class="card"><h3>Edit Wallets - '+u.name+'</h3>';
  h+='<input id="editMain" class="input" type="number" value="'+u.w.main+'">';
  h+='<button class="btn" onclick="saveWallets(\''+cell+'\')">Save</button></div>';
  document.getElementById("app").innerHTML=h;
}
function saveWallets(cell){
  var u=users.find(function(x){return x.cell===cell});
  if(!u)return;
  u.w.main=parseFloat(document.getElementById("editMain").value)||0;
  save();
  goAdmin();
}
function editUserDetails(cell){
  var u=users.find(function(x){return x.cell===cell});
  if(!u)return;
  var h='<div class="card"><h3>Edit Personal Details - '+u.cell+'</h3>';
  h+='<label>Name</label><input id="editName" class="input" value="'+(u.name||"")+'">';
  h+='<label>Email</label><input id="editEmail" class="input" value="'+(u.email||"")+'">';
  h+='<label>Cell</label><input id="editCell" class="input" value="'+(u.cell||"")+'">';
  h+='<button class="btn" onclick="saveUserDetails(\''+u.cell+'\')">Save Personal Details</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button></div>';
  document.getElementById("app").innerHTML=h;
}
function saveUserDetails(oldCell){
  var u=users.find(function(x){return x.cell===oldCell});
  if(!u)return;
  u.name=document.getElementById("editName").value.trim();
  u.email=document.getElementById("editEmail").value.trim();
  var newCell=document.getElementById("editCell").value.trim();
  if(newCell&&newCell!==oldCell){u.cell=newCell;}
  save();
  alert("Personal Details Updated");
  goAdmin();
}
function editAdminBank(cell){
  var u=users.find(function(x){return x.cell===cell});
  if(!u)return;
  if(!u.bank)u.bank={holder:u.name,bankName:"Bank Zero",acc:"",branch:"888000",approved:false};
  var h='<div class="card"><h3>Edit Banking Details - '+u.name+'</h3>';
  h+='<label>Holder Name</label><input id="editBankHolder" class="input" value="'+(u.bank.holder||"")+'">';
  h+='<label>Bank Name</label><input id="editBankName" class="input" value="'+(u.bank.bankName||"Bank Zero")+'">';
  h+='<label>Account Number</label><input id="editBankAcc" class="input" value="'+(u.bank.acc||"")+'">';
  h+='<label>Status</label><select id="editBankStatus" class="input"><option value="approved" '+(u.bank.approved?"selected":"")+'>APPROVED ✓</option><option value="pending" '+(!u.bank.approved?"selected":"")+'>PENDING</option></select>';
  h+='<button class="btn" onclick="saveAdminBank(\''+u.cell+'\')">Save Banking Details</button><br><br><button class="btn2" onclick="goAdmin()">Cancel</button></div>';
  document.getElementById("app").innerHTML=h;
}
function saveAdminBank(cell){
  var u=users.find(function(x){return x.cell===cell});
  if(!u)return;
  if(!u.bank)u.bank={};
  u.bank.holder=document.getElementById("editBankHolder").value.trim();
  u.bank.bankName=document.getElementById("editBankName").value.trim();
  u.bank.acc=document.getElementById("editBankAcc").value.trim();
  var st=document.getElementById("editBankStatus").value;
  u.bank.approved=(st==="approved");
  save();
  alert("Banking Details Updated");
  goAdmin();
}
function logout(){
  cur=null;
  localStorage.removeItem("dms_cur");
  document.getElementById("logoutBtn").style.display="none";
  goHome();
}
function checkLogout(){
  var b=document.getElementById("logoutBtn");
  if(b)b.style.display=cur?"block":"none";
}
function goAdmin(){
  setActive("bA");
  if(!cur||cur.cell!=="ADMIN"){
    var h='<div class="card"><h3>Admin Login</h3><input id="aC" class="input" placeholder="Cellphone" value="0510011039"><div class="pwdWrap"><input id="aP" class="input" type="password" placeholder="Password"><button class="eyeBtn" id="eyeAP" onclick="toggleEye(&quot;aP&quot;,&quot;eyeAP&quot;)">👁️</button></div><button class="btn" onclick="adminLogin()">Login</button></div>';
    document.getElementById("app").innerHTML=h;
    return;
  }
  var h='<div class="card"><h2 class="gold">Admin Dashboard - 472 LINES FIXED</h2>';
  for(var j=0;j<users.length;j++){
    var uu=users[j];
    ensureWallets(uu);
    h+='<div style="border:1px solid #444;padding:10px;margin:8px 0;border-radius:10px"><b>'+uu.name+'</b><br>'+uu.cell+' - <b class="gold">'+uu.invite+'</b><br>Main R'+uu.w.main.toFixed(2)+' | Inviter R'+uu.w.inviter.toFixed(2)+' | Loyalty R'+uu.w.loyalty.toFixed(2)+'<br><button class="btn2" onclick="editUserWallets(\''+uu.cell+'\')">Edit 3 Wallets</button><button class="btn2" onclick="editUserDetails(\''+uu.cell+'\')" style="background:#5dade2;color:#000">Edit Personal Details</button><button class="btn2" onclick="editAdminBank(\''+uu.cell+'\')" style="background:#1a1a1a;color:#d4af37;border:1px solid #d4af37">Edit Banking Details</button></div>';
  }
  h+='</div>';
  document.getElementById("app").innerHTML=h;
}
try{goHome();}catch(e){document.getElementById("app").innerHTML='<div class="card">Error: '+e.message+'</div>';}
</script>
</body>
</html>
