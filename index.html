<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DMS - Devine Money Savings</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0a1931;color:#fff}
header{background:#111;border-bottom:2px solid #d4af37;padding:12px;display:flex;justify-content:space-between}
header h1{color:#d4af37;font-size:14px}
.tabs{display:flex;gap:5px;padding:8px;background:#111;overflow-x:auto}
.tabs button{background:#222;color:#d4af37;border:1px solid #d4af37;padding:7px 10px;border-radius:20px;font-size:11px;white-space:nowrap}
.tabs button.active{background:#d4af37;color:#000}
.card{background:#111;border:1px solid #d4af37;border-radius:12px;padding:12px;margin:8px}
.gold{color:#d4af37}
.input{background:#000;border:1px solid #d4af37;color:#fff;padding:11px;border-radius:8px;width:100%;margin:5px 0;font-size:16px}
.btn-full{width:100%;padding:13px;background:#d4af37;color:#000;font-weight:bold;border:none;border-radius:10px;margin-top:8px}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px;cursor:pointer}
.pass-wrap{position:relative}
.auth-tab{display:flex;gap:6px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.auth-tab button{background:#222;color:#d4af37;border:1px solid #d4af37;padding:8px 12px;border-radius:20px;font-size:12px}
.auth-tab button.active{background:#d4af37;color:#000}
.flag-box{border:2px solid #d4af37;border-radius:12px;overflow:hidden;margin:8px}
.flag-box img{width:100%;display:block}
.poster{background:#000;border:2px solid #d4af37;border-radius:12px;padding:10px;margin:8px}
.pkg-row{border-bottom:1px solid #333;padding:8px 0;display:flex;justify-content:space-between}
.pkg-row b{background:#222;color:#d4af37;padding:3px 7px;border-radius:10px;font-size:11px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.stat{background:#222;border:1px solid #d4af37;border-radius:8px;padding:8px;text-align:center;font-size:12px}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}
.modal-box{background:#1a1a1a;border:2px solid #d4af37;border-radius:12px;padding:16px;width:100%;max-width:380px}
.wallet-opt{background:#222;border:1px solid #d4af37;padding:10px;border-radius:8px;margin:6px 0;display:flex;justify-content:space-between;cursor:pointer}
</style>
</head>
<body>
<header>
<h1>DMS - Devine Money Savings</h1>
<button id="logoutBtn" type="button" style="display:none;background:#ff3333;color:#fff;border:none;padding:5px 10px;border-radius:20px" onclick="logout()">Logout</button>
</header>
<div id="auth" style="padding:12px">
<div class="card" style="max-width:420px;margin:auto">
<h2 class="gold" style="text-align:center">DEVINE MONEY SAVINGS</h2>
<p style="text-align:center;color:#aaa;font-size:11px">Reg No: 2024/344088/07 | Free State | Min R70 | Bank Zero</p>
<div class="auth-tab">
<button type="button" id="btnReg" class="active" onclick="switchAuth('reg')">Register</button>
<button type="button" id="btnLogin" onclick="switchAuth('login')">User Login</button>
<button type="button" id="btnAdmin" onclick="switchAuth('admin')">Admin Login</button>
</div>
<div id="regDiv">
<input id="rFull" class="input" placeholder="Full Name & Surname *">
<select id="rGender" class="input"><option value="">Gender *</option><option>Male</option><option>Female</option><option>Other</option></select>
<input id="rCell" class="input" placeholder="Cell Number *">
<input id="rEmail" class="input" placeholder="Email *">
<input id="rInviter" class="input" placeholder="Inviter Code (optional)">
<select id="rProvince" class="input"><option value="">Province *</option><option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option><option>Eastern Cape</option><option>Free State</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select>
<div class="pass-wrap"><input id="rPass" class="input" type="password" placeholder="Password *"><span class="eye" onclick="toggleEye('rPass')">👁️</span></div>
<button type="button" class="btn-full" onclick="register()">Register</button>
</div>
<div id="loginDiv" style="display:none">
<input id="lEmail" class="input" placeholder="Email">
<div class="pass-wrap"><input id="lPass" class="input" type="password" placeholder="Password"><span class="eye" onclick="toggleEye('lPass')">👁️</span></div>
<button type="button" class="btn-full" onclick="login()">Login</button>
</div>
<div id="adminDiv" style="display:none">
<input id="aEmail" class="input" value="admin@dms.co.za">
<div class="pass-wrap"><input id="aPass" class="input" type="password" value="admin123"><span class="eye" onclick="toggleEye('aPass')">👁️</span></div>
<button type="button" class="btn-full" onclick="adminLogin()">Admin Login</button>
</div>
</div>
</div>
<!--PART 1 END-->
